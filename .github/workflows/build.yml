      - name: Pro ki chaabi, UPI aur WhatsApp daalo (GitHub Secrets se)
        env:
          FL_SECRET: ${{ secrets.FL_SECRET }}
          FL_UPI: ${{ secrets.FL_UPI }}
          FL_WHATSAPP: ${{ secrets.FL_WHATSAPP }}
        run: |
          D=Palrakh/app/src/main/java/com/rakesh/palrakh
          if [ -z "$FL_SECRET" ] || [ -z "$FL_UPI" ] || [ -z "$FL_WHATSAPP" ]; then
            echo "::error::Teeno secrets chahiye: FL_SECRET, FL_UPI, FL_WHATSAPP (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          if ! echo "$FL_SECRET" | grep -Eq '^[A-Za-z0-9]{16,}$'; then echo "::error::FL_SECRET galat hai"; exit 1; fi
          if ! echo "$FL_UPI" | grep -Eq '^[A-Za-z0-9._-]+@[A-Za-z0-9.]+$'; then echo "::error::FL_UPI galat hai (jaise naam@okaxis)"; exit 1; fi
          if ! echo "$FL_WHATSAPP" | grep -Eq '^91[0-9]{10}$'; then echo "::error::FL_WHATSAPP 91 ke saath 12 ank ka ho (jaise 919876543210)"; exit 1; fi
          sed -i "s|__FL_SECRET__|${FL_SECRET}|" $D/Secret.java
          sed -i "s|__UPI_ID__|${FL_UPI}|; s|__WHATSAPP__|${FL_WHATSAPP}|" $D/Pro.java
          echo "Secrets daal diye"

      - name: Fonts laao (Baloo 2 + Mukta, Google Fonts se, OFL license)
        run: |
          D=Palrakh/app/src/main/assets/fonts
          mkdir -p $D
          G=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -fsSL -o $D/Baloo2.ttf "$G/baloo2/Baloo2%5Bwght%5D.ttf"
          curl -fsSL -o $D/Mukta-Regular.ttf "$G/mukta/Mukta-Regular.ttf"
          curl -fsSL -o $D/Mukta-SemiBold.ttf "$G/mukta/Mukta-SemiBold.ttf"
          ls -la $D

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Signing chaabi (GitHub Secrets se)
        env:
          PALRAKH_KEYSTORE: ${{ secrets.PALRAKH_KEYSTORE }}
          PALRAKH_KEYPASS: ${{ secrets.PALRAKH_KEYPASS }}
        run: |
          if [ -n "$PALRAKH_KEYSTORE" ] && [ -n "$PALRAKH_KEYPASS" ]; then
            echo "$PALRAKH_KEYSTORE" | tr -d ' \n\r' | base64 -d > Palrakh/app/palrakh.jks
            echo "Asli chaabi lagi"
          elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
            # sirf jaanch wali branch: kachchi chaabi (release nahi banegi)
            keytool -genkeypair -keystore Palrakh/app/palrakh.jks -storetype PKCS12 -alias palrakh -keyalg RSA -keysize 2048 -validity 30 -storepass testpass123 -keypass testpass123 -dname "CN=Test"
            echo "PALRAKH_KEYPASS=testpass123" >> $GITHUB_ENV
            echo "::warning::Test branch: kachchi chaabi se build"
          else
            echo "::error::Do naye secrets chahiye: PALRAKH_KEYSTORE aur PALRAKH_KEYPASS (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: APK banao
        working-directory: Palrakh
        env:
          PALRAKH_KEYPASS: ${{ secrets.PALRAKH_KEYPASS || env.PALRAKH_KEYPASS }}
        run: gradle assembleFullRelease assembleLiteRelease bundlePlayRelease --no-daemon --stacktrace

      - name: APK ka naam badlo
        run: |
          VER=$(grep versionName Palrakh/app/build.gradle | grep -o '"[^"]*"' | tr -d '"')
          cp Palrakh/app/build/outputs/apk/full/release/app-full-release.apk "Palrakh-v${VER}.apk"
          cp Palrakh/app/build/outputs/apk/lite/release/app-lite-release.apk "Palrakh-Lite-v${VER}.apk"
          # Play Store ke liye (Play Console me upload)
          cp Palrakh/app/build/outputs/bundle/playRelease/app-play-release.aab "Palrakh-Play-v${VER}.aab"
          # website ke liye hamesha ek jaisa naam
          cp "Palrakh-v${VER}.apk" Palrakh.apk
          cp "Palrakh-Lite-v${VER}.apk" Palrakh-Lite.apk
          ls -la *.apk
          echo "VER=$VER" >> $GITHUB_ENV

      - name: Release me APK daalo
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}-build${{ github.run_number }}
          name: Palrakh v${{ env.VER }} (build ${{ github.run_number }})
          body_path: Palrakh/RELEASE_NOTES.md
          make_latest: true
          files: |
            Palrakh-v${{ env.VER }}.apk
            Palrakh-Lite-v${{ env.VER }}.apk
            Palrakh.apk
            Palrakh-Lite.apk
            Palrakh-Play-v${{ env.VER }}.aab
            Palrakh/release-notes.json
