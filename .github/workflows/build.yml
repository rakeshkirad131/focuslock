          package com.rakesh.focuslock;

          import android.accessibilityservice.AccessibilityService;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.widget.Toast;

          import java.util.List;

          /**
           * Accessibility service:
           * 1) YouTube Shorts / Instagram Reels / Facebook Reels khulte hi peeche bhej deta hai.
           * 2) Sakht mode: lock ke dauraan Settings me is app ka page (force stop / uninstall) nahi khulne deta.
           * Sirf screen ke element ke ID/naam dekhta hai, kuch save ya bhejta nahi.
           */
          public class ShortsService extends AccessibilityService {

              private static final String YT = "com.google.android.youtube";
              private static final String IG = "com.instagram.android";
              private static final String FB = "com.facebook.katana";

              private static final String[] YT_IDS = {
                      YT + ":id/reel_recycler",
                      YT + ":id/reel_player_page_container",
                      YT + ":id/reel_watch_player",
                      YT + ":id/shorts_container"
              };
              private static final String[] IG_IDS = {
                      IG + ":id/clips_viewer_view_pager",
                      IG + ":id/clips_viewer_container",
                      IG + ":id/clips_video_container"
              };
              private static final String[] FB_IDS = {
                      FB + ":id/reels_viewer_container",
                      FB + ":id/reels_video_container"
              };

              private static final String[] SETTINGS_PKGS = {
                      "com.android.settings",
                      "com.google.android.packageinstaller",
                      "com.android.packageinstaller",
                      "com.miui.securitycenter",
                      "com.coloros.safecenter",
                      "com.samsung.android.lool",
                      "com.android.vending"
              };

              private long lastAction;
              private long lastCheck;

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event == null || event.getPackageName() == null) return;
                  String pkg = event.getPackageName().toString();
                  long now = System.currentTimeMillis();
                  if (now - lastAction < 1200) return;
                  if (now - lastCheck < 300 && event.getEventType() != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return;
                  lastCheck = now;

                  try {
                      if (YT.equals(pkg) && Store.blockYtShorts(this)) {
                          if (hasAny(YT_IDS)) back("YouTube Shorts बंद हैं 🚫");
                      } else if (IG.equals(pkg) && Store.blockIgReels(this)) {
                          if (hasAny(IG_IDS)) back("Instagram Reels बंद हैं 🚫");
                      } else if (FB.equals(pkg) && Store.blockFbReels(this)) {
                          if (hasAny(FB_IDS)) back("Facebook Reels बंद हैं 🚫");
                      } else if (isSettings(pkg) && Store.strict(this) && Store.lockedNow(this)) {
                          if (mentionsMe()) {
                              lastAction = now;
                              performGlobalAction(GLOBAL_ACTION_HOME);
                              toast("सख़्त मोड: लॉक के दौरान यह सेटिंग नहीं खुलेगी 🔒");
                          }
                      }
                  } catch (Exception ignored) {
                  }
              }

              private boolean isSettings(String pkg) {
                  for (String s : SETTINGS_PKGS) if (s.equals(pkg)) return true;
                  return false;
              }

              private boolean hasAny(String[] ids) {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return false;
                  for (String id : ids) {
                      List<AccessibilityNodeInfo> found = root.findAccessibilityNodeInfosByViewId(id);
                      if (found != null) {
                          for (AccessibilityNodeInfo n : found) {
                              if (n != null && n.isVisibleToUser()) return true;
                          }
                      }
                  }
                  return false;
              }

              private boolean mentionsMe() {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return false;
                  String name = getString(R.string.app_name);
                  List<AccessibilityNodeInfo> a = root.findAccessibilityNodeInfosByText(name);
                  if (a != null && !a.isEmpty()) return true;
                  List<AccessibilityNodeInfo> b = root.findAccessibilityNodeInfosByText("FocusLock");
                  return b != null && !b.isEmpty();
              }

              private void back(String msg) {
                  lastAction = System.currentTimeMillis();
                  performGlobalAction(GLOBAL_ACTION_BACK);
                  toast(msg);
              }

              private void toast(String msg) {
                  try {
                      Toast.makeText(this, msg, Toast.LENGTH_SHORT).show();
                  } catch (Exception ignored) {
                  }
              }

              @Override
              public void onInterrupt() {
              }
          }
