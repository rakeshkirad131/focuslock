              public static void setPausePassMin(Context c, int m) {
                  p(c).edit().putInt("pausePass", m).commit();
              }

              /** pkg -> chhoot kab tak (elapsedRealtime). Sirf memory me: restart par chhoot khatam. */
              private static final java.util.Map<String, Long> PASS = new java.util.concurrent.ConcurrentHashMap<>();

              public static void grantPass(String pkg, int minutes) {
                  PASS.put(pkg, android.os.SystemClock.elapsedRealtime() + minutes * 60_000L);
              }

              public static boolean hasPass(String pkg) {
                  Long until = PASS.get(pkg);
                  return until != null && until > android.os.SystemClock.elapsedRealtime();
              }

              /** closed = true: ruk kar band kiya, false: phir bhi khola */
              public static void countPause(Context c, boolean closed) {
                  SharedPreferences sp = p(c);
                  long today = LocalDate.now().toEpochDay();
                  boolean same = sp.getLong("pauseDay", -1) == today;
                  int cl = same ? sp.getInt("pauseClosed", 0) : 0;
                  int op = same ? sp.getInt("pauseOpened", 0) : 0;
                  if (closed) cl++;
                  else op++;
                  sp.edit().putLong("pauseDay", today).putInt("pauseClosed", cl).putInt("pauseOpened", op).apply();
              }

              public static int pauseClosedToday(Context c) {
                  SharedPreferences sp = p(c);
                  return sp.getLong("pauseDay", -1) == LocalDate.now().toEpochDay() ? sp.getInt("pauseClosed", 0) : 0;
              }

              public static int pauseOpenedToday(Context c) {
                  SharedPreferences sp = p(c);
                  return sp.getLong("pauseDay", -1) == LocalDate.now().toEpochDay() ? sp.getInt("pauseOpened", 0) : 0;
              }

              private static final long EM_WAIT = 10 * 60_000L;

              /** Hafte me ek baar. */
              public static boolean emergencyAvailable(Context c) {
                  return LocalDate.now().toEpochDay() - p(c).getLong("emDay", -100) >= 7;
              }

              public static int emergencyDaysLeft(Context c) {
                  long d = 7 - (LocalDate.now().toEpochDay() - p(c).getLong("emDay", -100));
                  return (int) Math.max(0, d);
              }

              public static void emergencyRequest(Context c) {
                  p(c).edit()
                          .putLong("emEl", android.os.SystemClock.elapsedRealtime())
                          .putInt("emBoot", bootCount(c))
                          .commit();
              }

              /** -1 = koi request nahi; 0 = ab unlock kar sakte hain; >0 = itne ms aur rukna */
              public static long emergencyWaitLeft(Context c) {
                  SharedPreferences sp = p(c);
                  long el = sp.getLong("emEl", 0L);
                  if (el == 0L) return -1;
                  long nowEl = android.os.SystemClock.elapsedRealtime();
                  if (sp.getInt("emBoot", -2) != bootCount(c) || nowEl < el) {
                      emergencyCancel(c);   // restart hua: intezaar dobara karna hoga
                      return -1;
                  }
                  return Math.max(0L, el + EM_WAIT - nowEl);
              }

              public static void emergencyCancel(Context c) {
                  p(c).edit().putLong("emEl", 0L).commit();
              }

              /** Session turant khatam (streak me nahi gina jayega). */
              public static void emergencyUse(Context c) {
                  p(c).edit()
                          .putLong("emEl", 0L)
                          .putLong("emDay", LocalDate.now().toEpochDay())
                          .putLong("endEl", 0L)
                          .putLong("remain", 0L)
                          .putInt("sessionMins", 0)
                          .commit();
              }

              // ================= v3.5 =================

              /** Band ऐप ki website bhi band (default ON). */
              public static boolean appWeb(Context c) {
                  return p(c).getBoolean("appWeb", true);
              }

              /** Lock ke dauraan Play Store / installer band (default ON). */
              public static boolean playLock(Context c) {
                  return p(c).getBoolean("playLock", true);
              }

              /** Lock ke dauraan band apps ki notifications rokna. */
              public static boolean notifHold(Context c) {
                  return p(c).getBoolean("notifHold", false);
              }

              /** Rukiye mode me kholne se pehle kaam: 0 = koi nahi, 1 = ganit, 2 = vaakya likhna. */
              public static int pauseTask(Context c) {
                  return p(c).getInt("pauseTask", 1);
              }

              public static void setPauseTask(Context c, int v) {
                  p(c).edit().putInt("pauseTask", v).commit();
              }

              private static SharedPreferences held(Context c) {
                  return c.getSharedPreferences("held", Context.MODE_PRIVATE);
              }

              /** Roki gayi notification gino (pkg ke hisaab se). */
              public static void countHeld(Context c, String pkg) {
                  SharedPreferences h = held(c);
                  h.edit().putInt(pkg, h.getInt(pkg, 0) + 1).apply();
              }

              /** pkg -> ginti, aur saaf kar do. */
              public static Map<String, Integer> takeHeld(Context c) {
                  Map<String, Integer> m = new HashMap<>();
                  SharedPreferences h = held(c);
                  for (Map.Entry<String, ?> e : h.getAll().entrySet()) {
                      if (e.getValue() instanceof Integer) m.put(e.getKey(), (Integer) e.getValue());
                  }
                  h.edit().clear().commit();
                  return m;
              }

              // ================= v3.9: mata-pita mode =================

              public static boolean parentOn(Context c) {
                  return p(c).getBoolean("parentOn", false);
              }

              /** Sirf Pro + PIN ke saath laagu. */
              public static boolean parentLive(Context c) {
                  return parentOn(c) && hasPin(c) && Pro.has(c);
              }

              /** Mata-pita ne lock abhi khatam kiya (streak me nahi gina jayega). */
              public static void endNow(Context c) {
                  p(c).edit()
                          .putLong("emEl", 0L)
                          .putLong("endEl", 0L)
                          .putLong("remain", 0L)
                          .putInt("sessionMins", 0)
                          .commit();
              }

              private static SharedPreferences blocks(Context c) {
                  return c.getSharedPreferences("blocks", Context.MODE_PRIVATE);
              }

              /** Band app kholne ki koshish gino (sirf aaj ki). */
              public static void countBlock(Context c, String pkg) {
                  SharedPreferences b = blocks(c);
                  long today = LocalDate.now().toEpochDay();
                  SharedPreferences.Editor e = b.edit();
                  if (b.getLong("day", -1) != today) {
                      e.clear();
                      e.putLong("day", today);
                  }
                  int n = b.getLong("day", -1) == today ? b.getInt("b_" + pkg, 0) : 0;
                  e.putInt("b_" + pkg, n + 1).apply();
              }

              /** pkg -> aaj kitni baar band app kholne ki koshish */
              public static Map<String, Integer> blocksToday(Context c) {
                  Map<String, Integer> m = new HashMap<>();
                  SharedPreferences b = blocks(c);
                  if (b.getLong("day", -1) != LocalDate.now().toEpochDay()) return m;
                  for (Map.Entry<String, ?> e : b.getAll().entrySet()) {
                      if (e.getKey().startsWith("b_") && e.getValue() instanceof Integer) {
                          m.put(e.getKey().substring(2), (Integer) e.getValue());
                      }
                  }
                  return m;
              }

              // ================= samay dikhane ke helper =================

              public static String left(long ms) {
                  long m = (ms + 59_999L) / 60_000L;
                  return mins(m);
              }

              public static String mins(long m) {
                  if (m >= 60) {
                      long h = m / 60;
                      long r = m % 60;
                      return r == 0 ? h + " घंटे" : h + " घंटे " + r + " मिनट";
                  }
                  return m + " मिनट";
              }

              public static String clock(long t) {
                  return new SimpleDateFormat("h:mm a", Locale.ENGLISH).format(new Date(t));
              }

              public static String clockMin(int minOfDay) {
                  int h = minOfDay / 60, m = minOfDay % 60;
                  String ap = h < 12 ? "AM" : "PM";
                  int h12 = h % 12 == 0 ? 12 : h % 12;
                  return String.format(Locale.ENGLISH, "%d:%02d %s", h12, m, ap);
              }

              public static String minutesLabel(int m) {
                  if (m < 60) return m + " मिनट";
                  if (m == 60) return "1 घंटा";
                  if (m % 60 == 0) return (m / 60) + " घंटे";
                  return mins(m);
              }
          }
