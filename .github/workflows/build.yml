              private void drawNav() {
                  nav.removeAllViews();
                  for (int i = 0; i < NAV.length; i++) {
                      final int idx = i;
                      boolean sel = i == tab;
                      LinearLayout item = new LinearLayout(this);
                      item.setOrientation(LinearLayout.VERTICAL);
                      item.setGravity(Gravity.CENTER);
                      item.setPadding(0, dp(6), 0, dp(6));
                      if (sel) {
                          item.setBackground(Fx.raised(ui.accent2, ui.accent, Fx.shade(ui.accent, 0.6f), dp(18), dp(3)));
                          if (idx == navPopped) {
                              Fx.pop(item);
                              navPopped = -1;
                          }
                      }
                      Fx.press(item);
                      // v3.15: sirf naam, icon nahi
                      TextView lb = text(L.en(this) ? NAV[i][2] : NAV[i][1], 14, sel ? ui.onAccent : ui.muted, true);
                      lb.setTypeface(Fonts.head(this));
                      lb.setGravity(Gravity.CENTER);
                      lb.setPadding(0, dp(6), 0, sel ? dp(9) : dp(6));
                      item.addView(lb);
                      item.setOnClickListener(v -> {
                          if (tab != idx) navPopped = idx;
                          tab = idx;
                          render();
                      });
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                      lp.setMargins(dp(3), 0, dp(3), 0);
                      nav.addView(item, lp);
                  }
              }

              private void render() {
                  stopTicker();
                  content.removeAllViews();
                  boxes.clear();
                  hideBottom();
                  // v3.12: tab badalne par cards ek-ek karke upar aayein
                  if (tab != lastAnimTab) {
                      lastAnimTab = tab;
                      content.post(() -> Fx.enter(content));
                  }

                  boolean usage = hasUsageAccess();
                  boolean overlay = Settings.canDrawOverlays(this);
                  if (!usage || !overlay) {
                      nav.setVisibility(View.GONE);
                      renderPermissions(usage, overlay);
                      return;
                  }
                  nav.setVisibility(View.VISIBLE);
                  drawNav();
                  BlockService.ensure(this);
                  FocusWidget.updateAll(this);

                  // v3.9: mata-pita mode — bina PIN sirf haal dikhao
                  if (!parentUnlocked()) {
                      nav.setVisibility(View.GONE);
                      renderChild();
                      return;
                  }
                  if (Store.parentLive(this)) renderParentBanner();

                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                  if (!pm.isIgnoringBatteryOptimizations(getPackageName())) {
                      LinearLayout c = softCard(ui.warnSoft);
                      c.addView(text(t("⚡ बैटरी रोक हटाएँ", "⚡ Remove battery restriction"), 16, ui.warn, true));
                      c.addView(text(t("ज़रूरी है, वरना लॉक बीच में रुक सकता है। यहाँ टैप करें।",
                              "Needed, or the lock may stop. Tap here."), 13, ui.muted, false));
                      c.setOnClickListener(v -> openBatterySetting());
                      content.addView(c);
                  }

                  switch (tab) {
                      case 1: renderLimits(); break;
                      case 2: renderSchedule(); break;
                      case 3: renderBlock(); break;
                      case 4: renderStats(); break;
                      case 5: renderPro(); break;
                      default:
                          if (Store.active(this)) renderActive();
                          else renderFocusSetup();
                  }
              }

