          package com.rakesh.focuslock;

          import android.content.Context;
          import android.content.SharedPreferences;

          import java.nio.charset.StandardCharsets;
          import java.security.MessageDigest;
          import java.time.LocalDate;
          import java.util.Locale;

          import javax.crypto.Mac;
          import javax.crypto.spec.SecretKeySpec;

          /**
           * v3.6: Pro membership (bina internet).
           * Grahak UPI se paise bhejta hai, Rakesh ek code banakar bhejta hai.
           * Code sirf usi phone par chalta hai (Phone ID se juda) aur ek tareekh tak valid hai.
           * Code: "20774-K7P3QX9M" = aakhri din (epochDay) + 8 akshar ka hastakshar.
           */
          public final class Pro {
              private Pro() {}

              // ---- bhugtan ki jaankari (Rakesh ki) ----
              public static final String UPI_ID = "__UPI_ID__";
              public static final String UPI_NAME = "Lagaam";
              /** 91 ke saath, bina + ke */
              public static final String WHATSAPP = "__WHATSAPP__";

              /** v3.14: Rakesh ka business QR (CSC STORE). QR image res/drawable-nodpi/upi_qr.png me hai. */
              public static final String QR_PA = "9617093276@okbizaxis";
              public static final String QR_PN = "CSC STORE";
              public static final String QR_MC = "4816";

              // ---- daam ----
              public static final int[][] PLANS = {
                      // {rupaye, din}
                      {1, 3},
                      {99, 30},
                      {999, 365}
              };

              /** Admin (code banane wala) password ka SHA-256. */
              private static final String ADMIN_HASH = "7e6caa06f75c870c196df165b6434425befc43ba70a3ab86837ba17133d607e6";

              /** Galat padhne wale akshar (0/O, 1/I) nahi. */
              private static final String ALPHA = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";

              private static long cacheAt;
              private static boolean cacheHas;

              private static SharedPreferences p(Context c) {
                  return c.getSharedPreferences("pro", Context.MODE_PRIVATE);
              }

              private static String b32(byte[] b, int n) {
                  StringBuilder sb = new StringBuilder();
                  int buf = 0, bits = 0, i = 0;
                  while (sb.length() < n) {
                      if (bits < 5) {
                          buf = (buf << 8) | (b[i++] & 0xFF);
                          bits += 8;
                      }
                      sb.append(ALPHA.charAt((buf >> (bits - 5)) & 31));
                      bits -= 5;
                      buf &= (1 << bits) - 1;
                  }
                  return sb.toString();
              }

              /** Is phone ki pehchaan (8 akshar). Reinstall par wahi rehti hai. */
              public static String deviceId(Context c) {
                  try {
                      String a = android.provider.Settings.Secure.getString(c.getContentResolver(),
                              android.provider.Settings.Secure.ANDROID_ID);
                      if (a == null) a = "none";
                      byte[] h = MessageDigest.getInstance("SHA-256").digest(("fl:" + a).getBytes(StandardCharsets.UTF_8));
                      return b32(h, 8);
                  } catch (Exception e) {
                      return "XXXXXXXX";
                  }
              }

              private static String sign(String dev, long day) {
                  try {
                      Mac mac = Mac.getInstance("HmacSHA256");
                      mac.init(new SecretKeySpec(Secret.KEY.getBytes(StandardCharsets.UTF_8), "HmacSHA256"));
                      byte[] h = mac.doFinal((dev.toUpperCase(Locale.ROOT) + ":" + day).getBytes(StandardCharsets.UTF_8));
                      return b32(h, 8);
                  } catch (Exception e) {
                      return "";
                  }
              }

              /** Admin: kisi phone ke liye code banao. */
              public static String makeCode(String dev, long lastDay) {
                  return lastDay + "-" + sign(dev.trim().toUpperCase(Locale.ROOT), lastDay);
              }

              /** Code sahi ho to aakhri din, warna -1. */
              public static long verify(Context c, String code) {
                  if (code == null) return -1;
                  String s = code.trim().toUpperCase(Locale.ROOT).replace(" ", "");
                  int dash = s.indexOf('-');
                  if (dash <= 0) return -1;
                  try {
                      long day = Long.parseLong(s.substring(0, dash));
                      String sig = s.substring(dash + 1);
                      if (sig.length() != 8) return -1;
                      return sig.equals(sign(deviceId(c), day)) ? day : -1;
                  } catch (NumberFormatException e) {
                      return -1;
                  }
              }

              /**
               * Aaj ka din. Phone ki ghadi peeche karne se Pro lamba nahi chalega:
               * ab tak dekha sabse bada din yaad rakhte hain.
               */
              public static long today(Context c) {
                  long now = LocalDate.now().toEpochDay();
                  long seen = p(c).getLong("maxDay", 0);
                  if (now > seen) {
                      p(c).edit().putLong("maxDay", now).apply();
                      return now;
                  }
                  return seen;
              }

              /** Code daalo. true = chal gaya. */
              public static boolean activate(Context c, String code) {
                  long day = verify(c, code);
                  if (day < 0 || day < today(c)) return false;
                  p(c).edit().putString("code", code.trim().toUpperCase(Locale.ROOT)).commit();
                  cacheAt = 0;
                  return true;
              }

              /** Pro ka aakhri din (-1 = koi code nahi). */
              public static long lastDay(Context c) {
                  return verify(c, p(c).getString("code", null));
              }

              public static boolean has(Context c) {
                  long now = System.currentTimeMillis();
                  if (now - cacheAt < 30_000) return cacheHas;
                  long d = lastDay(c);
                  cacheHas = d >= 0 && d >= today(c);
                  cacheAt = now;
                  return cacheHas;
              }

              public static int daysLeft(Context c) {
                  long d = lastDay(c);
                  return d < 0 ? 0 : (int) Math.max(0, d - today(c) + 1);
              }

              // ---- admin ----

              public static boolean checkAdmin(String pw) {
                  try {
                      byte[] h = MessageDigest.getInstance("SHA-256")
                              .digest(("fladmin:" + pw.trim().toUpperCase(Locale.ROOT)).getBytes(StandardCharsets.UTF_8));
                      StringBuilder sb = new StringBuilder();
                      for (byte x : h) sb.append(String.format(Locale.ENGLISH, "%02x", x));
                      return sb.toString().equals(ADMIN_HASH);
                  } catch (Exception e) {
                      return false;
                  }
              }

              public static boolean adminOn(Context c) {
                  return p(c).getBoolean("admin", false);
              }

              public static void setAdmin(Context c, boolean on) {
                  p(c).edit().putBoolean("admin", on).commit();
              }
          }
