          mkdir -p FocusLock/app/src/main/java/com/rakesh/focuslock
          cat > FocusLock/app/src/main/java/com/rakesh/focuslock/BlockActivity.java <<'ENDOFFILE'
          package com.rakesh.focuslock;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.util.Map;

          /** Band app kholne par yeh screen aati hai. */
          public class BlockActivity extends Activity {

              private TextView title;
              private TextView sub;
              private String pkg;
              private int reason;
              private final Handler handler = new Handler(Looper.getMainLooper());

              private final Runnable updater = new Runnable() {
                  @Override
                  public void run() {
                      update();
                      handler.postDelayed(this, 1000);
                  }
              };

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  float d = getResources().getDisplayMetrics().density;

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setBackgroundColor(Color.parseColor("#1B4332"));
                  int pad = (int) (32 * d);
                  root.setPadding(pad, pad, pad, pad);

                  TextView icon = new TextView(this);
                  icon.setText("🔒");
                  icon.setTextSize(72);
                  icon.setGravity(Gravity.CENTER);
                  root.addView(icon);

                  title = new TextView(this);
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(24);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, (int) (16 * d), 0, (int) (8 * d));
                  root.addView(title);

                  sub = new TextView(this);
                  sub.setTextColor(Color.parseColor("#D8F3DC"));
                  sub.setTextSize(18);
                  sub.setGravity(Gravity.CENTER);
                  root.addView(sub);

                  TextView note = new TextView(this);
                  note.setText("आपने खुद यह लॉक लगाया है। अभी अपने काम पर ध्यान दें 💪");
                  note.setTextColor(Color.parseColor("#95D5B2"));
                  note.setTextSize(15);
                  note.setGravity(Gravity.CENTER);
                  note.setPadding(0, (int) (24 * d), 0, (int) (24 * d));
                  root.addView(note);

                  Button home = new Button(this);
                  home.setText("होम पर जाएँ");
                  home.setTextSize(18);
                  home.setOnClickListener(v -> goHome());
                  root.addView(home);

                  setContentView(root);
                  showFor(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  showFor(intent);
              }

              private void showFor(Intent i) {
                  pkg = i == null ? null : i.getStringExtra("pkg");
                  reason = i == null ? BlockService.REASON_SESSION
                          : i.getIntExtra("reason", BlockService.REASON_SESSION);
                  String label = "यह ऐप";
                  if (pkg != null) {
                      try {
                          PackageManager pm = getPackageManager();
                          label = pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)).toString();
                      } catch (Exception ignored) {
                      }
                  }
                  if (reason == BlockService.REASON_LIMIT) {
                      title.setText(label + " की आज की सीमा पूरी");
                  } else {
                      title.setText(label + " अभी बंद है");
                  }
                  update();
              }

              private void update() {
                  long now = System.currentTimeMillis();
                  if (reason == BlockService.REASON_SESSION) {
                      long end = Store.end(this);
                      long left = end - now;
                      if (left <= 0) {
                          finish();
                          return;
                      }
                      sub.setText("फ़ोकस सत्र: " + Store.left(left) + " बाकी (" + Store.clock(end) + " तक)");
                  } else if (reason == BlockService.REASON_SCHEDULE) {
                      if (!Store.schedNow(this)) {
                          finish();
                          return;
                      }
                      sub.setText("शेड्यूल: " + Store.clockMin(Store.schedStart(this)) + " से "
                              + Store.clockMin(Store.schedEnd(this)) + " तक");
                  } else {
                      Map<String, Integer> lim = Store.limits(this);
                      Integer m = pkg == null ? null : lim.get(pkg);
                      if (m == null) {
                          finish();
                          return;
                      }
                      sub.setText("रोज़ की सीमा: " + Store.minutesLabel(m) + "\nकल सुबह फिर खुलेगा");
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  handler.post(updater);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  handler.removeCallbacks(updater);
              }

              @Override
              public void onBackPressed() {
                  goHome();
              }

              private void goHome() {
                  Intent i = new Intent(Intent.ACTION_MAIN);
                  i.addCategory(Intent.CATEGORY_HOME);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try {
                      startActivity(i);
                  } catch (Exception ignored) {
                  }
                  finish();
              }
          }
          ENDOFFILE
          mkdir -p FocusLock/app/src/main/java/com/rakesh/focuslock
          cat > FocusLock/app/src/main/java/com/rakesh/focuslock/BlockService.java <<'ENDOFFILE'
          package com.rakesh.focuslock;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.app.usage.UsageEvents;
          import android.app.usage.UsageStatsManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;

          import java.util.HashMap;
          import java.util.Map;
          import java.util.Set;

          /**
           * Background me chalta hai: har 0.7 second dekhta hai ki saamne kaunsa app khula hai.
           * 3 niyam: focus session, shedule, aur roz ki seema.
           */
          public class BlockService extends Service {

              public static final int REASON_SESSION = 1;
              public static final int REASON_SCHEDULE = 2;
              public static final int REASON_LIMIT = 3;

              private static final String CHANNEL = "focus_lock";
              private static final int NOTIF_ID = 7;

              private Handler handler;
              private String currentFg;
              private long lastLaunch;
              private String lastNotifText = "";

              // settings cache (har 5 sec taaza)
              private long settingsAt;
              private boolean sessionWas;
              private long end;
              private Set<String> sessionPkgs;
              private Set<String> schedPkgs;
              private boolean schedNow;
              private Map<String, Integer> limits = new HashMap<>();

              // usage cache (har 15 sec taaza)
              private long usageAt;
              private Map<String, Long> usage = new HashMap<>();

              private final Runnable tick = new Runnable() {
                  @Override
                  public void run() {
                      check();
                      if (handler != null) handler.postDelayed(this, 700);
                  }
              };

              /** Zaroorat ho to service chalao, nahi to band karo. */
              public static void ensure(Context c) {
                  Intent i = new Intent(c, BlockService.class);
                  try {
                      if (Store.needsService(c)) c.startForegroundService(i);
                      else c.stopService(i);
                  } catch (Exception ignored) {
                  }
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  settingsAt = 0;
                  usageAt = 0;
                  loadSettings(System.currentTimeMillis());
                  Notification n = buildNotification(notifText());
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                  } else {
                      startForeground(NOTIF_ID, n);
                  }

                  if (!Store.needsService(this)) {
                      shutdown();
                      return START_NOT_STICKY;
                  }
                  if (handler == null) {
                      handler = new Handler(Looper.getMainLooper());
                      handler.post(tick);
                  }
                  return START_STICKY;
              }

              private void loadSettings(long now) {
                  settingsAt = now;
                  Store.saveRemain(this);
                  end = Store.end(this);
                  sessionPkgs = Store.pkgs(this);
                  schedPkgs = Store.schedPkgs(this);
                  schedNow = Store.schedNow(this);
                  limits = Store.limits(this);
              }

              private String notifText() {
                  long now = System.currentTimeMillis();
                  if (Store.remaining(this) > 0) return "फ़ोकस सत्र: " + Store.left(Store.remaining(this)) + " बाकी";
                  if (schedNow) return "शेड्यूल चालू, " + Store.clockMin(Store.schedEnd(this)) + " तक";
                  return "सीमा और शेड्यूल पर नज़र रखी जा रही है";
              }

              private Notification buildNotification(String text) {
                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  NotificationChannel ch = new NotificationChannel(CHANNEL, "फ़ोकस लॉक",
                          NotificationManager.IMPORTANCE_LOW);
                  nm.createNotificationChannel(ch);
                  PendingIntent pi = PendingIntent.getActivity(this, 0,
                          new Intent(this, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
                  lastNotifText = text;
                  return new Notification.Builder(this, CHANNEL)
                          .setSmallIcon(R.drawable.ic_lock_white)
                          .setContentTitle("🔒 फ़ोकस लॉक")
                          .setContentText(text)
                          .setOngoing(true)
                          .setContentIntent(pi)
                          .build();
              }

              private void check() {
                  long now = System.currentTimeMillis();

                  // focus session: ghadi badalne se asar nahi (bacha samay elapsedRealtime se)
                  long rem = Store.remaining(this);
                  boolean sessionOn = rem > 0;
                  if (sessionWas && !sessionOn) {
                      Store.completeSession(this);
                      settingsAt = 0;
                  }
                  sessionWas = sessionOn;

                  if (now - settingsAt > 5000) {
                      loadSettings(now);
                      if (!Store.needsService(this)) {
                          shutdown();
                          return;
                      }
                      String t = notifText();
                      if (!t.equals(lastNotifText)) {
                          NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                          nm.notify(NOTIF_ID, buildNotification(t));
                      }
                  }

                  String fg = foregroundApp(now);
                  if (fg != null) currentFg = fg;
                  if (currentFg == null || currentFg.equals(getPackageName())) return;

                  int reason = 0;
                  if (sessionOn && sessionPkgs.contains(currentFg)) {
                      reason = REASON_SESSION;
                  } else if (schedNow && schedPkgs.contains(currentFg)) {
                      reason = REASON_SCHEDULE;
                  } else if (limits.containsKey(currentFg)) {
                      if (now - usageAt > 15000) {
                          usage = Usage.today(this);
                          usageAt = now;
                      }
                      Long used = usage.get(currentFg);
                      long ms = (used == null ? 0 : used) + (now - usageAt);
                      if (ms >= limits.get(currentFg) * 60_000L) reason = REASON_LIMIT;
                  }

                  if (reason != 0 && now - lastLaunch > 1500) {
                      lastLaunch = now;
                      Intent i = new Intent(this, BlockActivity.class);
                      i.putExtra("pkg", currentFg);
                      i.putExtra("reason", reason);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_NO_ANIMATION);
                      try {
                          startActivity(i);
                      } catch (Exception ignored) {
                      }
                  }
              }

              /** Pichhle 1 minute ke events me se aakhri "saamne aaya" app. */
              private String foregroundApp(long now) {
                  try {
                      UsageStatsManager usm = (UsageStatsManager) getSystemService(USAGE_STATS_SERVICE);
                      UsageEvents events = usm.queryEvents(now - 60_000L, now);
                      UsageEvents.Event e = new UsageEvents.Event();
                      String last = null;
                      while (events.hasNextEvent()) {
                          events.getNextEvent(e);
                          if (e.getEventType() == UsageEvents.Event.MOVE_TO_FOREGROUND) {
                              last = e.getPackageName();
                          }
                      }
                      return last;
                  } catch (Exception ex) {
                      return null;
                  }
              }

              private void shutdown() {
                  if (handler != null) {
                      handler.removeCallbacks(tick);
                      handler = null;
                  }
                  stopForeground(true);
                  stopSelf();
              }

              @Override
              public void onDestroy() {
                  if (handler != null) {
                      handler.removeCallbacks(tick);
                      handler = null;
                  }
                  super.onDestroy();
              }
          }
          ENDOFFILE
          mkdir -p FocusLock/app/src/main/java/com/rakesh/focuslock
          cat > FocusLock/app/src/main/java/com/rakesh/focuslock/BootReceiver.java <<'ENDOFFILE'
          package com.rakesh.focuslock;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          /** Phone restart hone par lock/seema/shedule dobara shuru karta hai. */
          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  BlockService.ensure(context);
              }
          }
          ENDOFFILE
          mkdir -p FocusLock/app/src/main/java/com/rakesh/focuslock
          cat > FocusLock/app/src/main/java/com/rakesh/focuslock/MainActivity.java <<'ENDOFFILE'
          package com.rakesh.focuslock;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.AppOpsManager;
          import android.app.TimePickerDialog;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.os.Process;
          import android.provider.Settings;
          import android.telecom.TelecomManager;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.HorizontalScrollView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.RadioButton;
          import android.widget.RadioGroup;
          import android.widget.ScrollView;
          import android.widget.Switch;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;

          public class MainActivity extends Activity {

              private static final int[] MINUTES = {25, 15, 30, 60, 120, 240, 480};
              private static final int[] LIMIT_OPTIONS = {0, 15, 30, 45, 60, 90, 120, 180};
              private static final String[] TABS = {"🎯 फ़ोकस", "⏳ सीमा", "📅 शेड्यूल", "🚫 Shorts", "📊 आँकड़े"};
              private static final String[] DAY_NAMES = {"र", "सो", "मं", "बु", "गु", "शु", "श"};

              /** Pehli baar ye apps apne aap tick rahenge (agar phone me hain). */
              private static final Set<String> POPULAR = new HashSet<>(Arrays.asList(
                      "com.google.android.youtube",
                      "com.instagram.android",
                      "com.instagram.lite",
                      "com.facebook.katana",
                      "com.facebook.lite",
                      "com.snapchat.android",
                      "in.mohalla.sharechat",
                      "in.mohalla.video",
                      "com.eterno.shortvideos",
                      "com.next.innovation.takatak",
                      "com.zhiliaoapp.musically"
              ));

              private static final int GREEN = Color.parseColor("#2D6A4F");
              private static final int DARK = Color.parseColor("#1B4332");
              private static final int MUTED = Color.parseColor("#52796F");
              private static final int LIGHT = Color.parseColor("#D8F3DC");

              /** Ek app ki jaankari. */
              private static class App {
                  String pkg;
                  String label;
                  Drawable icon;
              }

              private LinearLayout tabBar;
              private LinearLayout content;
              private Button bottomButton;
              private Runnable bottomAction;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private Runnable activeTicker;
              private final Map<String, CheckBox> boxes = new LinkedHashMap<>();
              private List<App> appsCache;
              private int tab = 0;

              // focus tab
              private int selectedMinutes;
              // schedule tab (bina save kiye badlav)
              private int schedStart, schedEnd, schedDays;
              private boolean schedDraftLoaded;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);

                  LinearLayout outer = new LinearLayout(this);
                  outer.setOrientation(LinearLayout.VERTICAL);
                  outer.setBackgroundColor(Color.parseColor("#F4F9F6"));

                  TextView head = new TextView(this);
                  head.setText("फ़ोकस लॉक");
                  head.setTextSize(26);
                  head.setTextColor(DARK);
                  head.setTypeface(Typeface.DEFAULT_BOLD);
                  head.setPadding(dp(20), dp(20), dp(20), dp(8));
                  outer.addView(head);

                  HorizontalScrollView hs = new HorizontalScrollView(this);
                  hs.setHorizontalScrollBarEnabled(false);
                  tabBar = new LinearLayout(this);
                  tabBar.setOrientation(LinearLayout.HORIZONTAL);
                  tabBar.setPadding(dp(14), 0, dp(14), dp(6));
                  hs.addView(tabBar);
                  outer.addView(hs);

                  ScrollView scroll = new ScrollView(this);
                  content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(dp(20), dp(10), dp(20), dp(24));
                  scroll.addView(content);
                  outer.addView(scroll, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f));

                  bottomButton = new Button(this);
                  bottomButton.setTextSize(18);
                  bottomButton.setAllCaps(false);
                  bottomButton.setTextColor(Color.WHITE);
                  bottomButton.setTypeface(Typeface.DEFAULT_BOLD);
                  bottomButton.setBackground(round(GREEN, 14));
                  LinearLayout.LayoutParams blp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, dp(58));
                  blp.setMargins(dp(16), dp(8), dp(16), dp(16));
                  outer.addView(bottomButton, blp);
                  bottomButton.setOnClickListener(v -> {
                      if (bottomAction != null) bottomAction.run();
                  });

                  setContentView(outer);

                  if (Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  appsCache = null;
                  schedDraftLoaded = false;
                  render();
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  stopTicker();
              }

              // ================= screen banana =================

              private void render() {
                  stopTicker();
                  content.removeAllViews();
                  boxes.clear();
                  hideBottom();

                  boolean usage = hasUsageAccess();
                  boolean overlay = Settings.canDrawOverlays(this);
                  if (!usage || !overlay) {
                      tabBar.setVisibility(View.GONE);
                      renderPermissions(usage, overlay);
                      return;
                  }
                  tabBar.setVisibility(View.VISIBLE);
                  drawTabs();
                  BlockService.ensure(this);

                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                  if (!pm.isIgnoringBatteryOptimizations(getPackageName())) {
                      addActionButton("⚡ बैटरी रोक हटाएँ (ज़रूरी, वरना लॉक बीच में रुक सकता है)",
                              v -> openBatterySetting());
                  }

                  switch (tab) {
                      case 1: renderLimits(); break;
                      case 2: renderSchedule(); break;
                      case 3: renderShorts(); break;
                      case 4: renderStats(); break;
                      default:
                          if (Store.active(this)) renderActive();
                          else renderFocusSetup();
                  }
              }

              private void drawTabs() {
                  tabBar.removeAllViews();
                  for (int i = 0; i < TABS.length; i++) {
                      final int idx = i;
                      TextView t = new TextView(this);
                      t.setText(TABS[i]);
                      t.setTextSize(15);
                      t.setPadding(dp(14), dp(8), dp(14), dp(8));
                      boolean sel = i == tab;
                      t.setTextColor(sel ? Color.WHITE : DARK);
                      t.setTypeface(sel ? Typeface.DEFAULT_BOLD : Typeface.DEFAULT);
                      t.setBackground(round(sel ? GREEN : LIGHT, 20));
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                      lp.setMargins(dp(4), 0, dp(4), 0);
                      t.setOnClickListener(v -> {
                          tab = idx;
                          render();
                      });
                      tabBar.addView(t, lp);
                  }
              }

