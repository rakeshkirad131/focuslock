              // ================= v3.16: apne-aap update =================

              private static Updater.Info pendingUpdate;
              private static boolean updateBusy;
              private AlertDialog updateDialog;

              /** Update ke baad pehli baar khulne par: "kya naya hai". */
              private boolean showWhatsNew() {
                  String n = Updater.freshNotes(this);
                  if (n == null) return false;
                  Updater.markNotesShown(this);
                  new AlertDialog.Builder(this)
                          .setTitle(t("Lagaam v" + Updater.currentVersion(this) + " में अपडेट हो गया",
                                  "Lagaam updated to v" + Updater.currentVersion(this)))
                          .setMessage(L.clean(t("क्या नया है:\n\n", "What's new:\n\n")
                                  + (n.isEmpty() ? t("छोटे सुधार", "Small improvements") : n)))
                          .setPositiveButton(t("ठीक है", "OK"), null)
                          .show();
                  return true;
              }

              private void checkUpdate() {
                  if (updateBusy) return;
                  if (pendingUpdate != null && Updater.isNewer(this, pendingUpdate)) {
                      showUpdate(pendingUpdate);
                      return;
                  }
                  if (!Updater.dueForCheck(this)) return;
                  updateBusy = true;
                  new Thread(() -> {
                      Updater.Info i = Updater.fetch(getApplicationContext());
                      runOnUiThread(() -> {
                          updateBusy = false;
                          if (Updater.isNewer(this, i)) {
                              pendingUpdate = i;
                              if (!isFinishing()) showUpdate(i);
                          }
                      });
                  }).start();
              }

              /** Sandesh: "ऐप अपडेट होगा" + kya naya hai + download progress. Download apne-aap shuru. */
              private void showUpdate(Updater.Info i) {
                  if (updateDialog != null && updateDialog.isShowing()) return;
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(22), dp(8), dp(22), dp(4));
                  box.addView(text(t("Lagaam अब नए वर्शन में अपडेट होगा.", "Lagaam will now update to the new version."),
                          15, ui.text, false));
                  String n = i.notes(this);
                  TextView whats = text(t("क्या नया है:", "What's new:"), 15, ui.text, true);
                  whats.setPadding(0, dp(14), 0, dp(4));
                  box.addView(whats);
                  box.addView(text(n.isEmpty() ? t("छोटे सुधार", "Small improvements") : n, 14, ui.muted, false));
                  final TextView status = text("", 14, ui.accent, true);
                  status.setPadding(0, dp(16), 0, dp(4));
                  box.addView(status);
                  final android.widget.ProgressBar bar = new android.widget.ProgressBar(this, null,
                          android.R.attr.progressBarStyleHorizontal);
                  bar.setMax(100);
                  box.addView(bar);
                  ScrollView sv = new ScrollView(this);
                  sv.addView(box);

                  AlertDialog.Builder b = new AlertDialog.Builder(this)
                          .setTitle(t("नया अपडेट: v" + i.version, "New update: v" + i.version))
                          .setView(sv)
                          .setCancelable(false);
                  if (!Updater.canInstall(this)) {
                      // Pehli baar: Lagaam ko install ki anumati chahiye
                      status.setText(L.clean(t("एक बार अनुमति दें: अगली स्क्रीन पर Lagaam के लिए \"Allow\" चालू करें, फिर वापस आएँ.",
                              "Allow once: turn on \"Allow\" for Lagaam on the next screen, then come back.")));
                      bar.setVisibility(View.GONE);
                      b.setPositiveButton(t("अनुमति दें", "Allow"), (d, w) -> {
                          try {
                              startActivity(new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                                      Uri.parse("package:" + getPackageName())));
                          } catch (Exception e) {
                              toast(t("सेटिंग नहीं खुली", "Could not open settings"));
                          }
                      });
                      b.setNegativeButton(t("बाद में", "Later"), null);
                      updateDialog = b.show();
                      return;
                  }
                  status.setText(t("डाउनलोड शुरू हो रहा है…", "Starting download…"));
                  b.setNegativeButton(t("पीछे चलने दें", "Run in background"), null);
                  updateDialog = b.show();
                  updateBusy = true;
                  final Context app = getApplicationContext();
                  new Thread(() -> Updater.downloadAndInstall(app, i, new Updater.Progress() {
                      public void onProgress(int pc) {
                          runOnUiThread(() -> {
                              bar.setProgress(pc);
                              status.setText(t("डाउनलोड हो रहा है… " + pc + "%", "Downloading… " + pc + "%"));
                          });
                      }

                      public void onDone(boolean ok, String msg) {
                          runOnUiThread(() -> {
                              updateBusy = false;
                              if (ok) {
                                  bar.setProgress(100);
                                  status.setText(t("इंस्टॉल हो रहा है… ऐप कुछ सेकंड में फिर खुलेगा.",
                                          "Installing… the app will restart in a few seconds."));
                              } else {
                                  status.setText(t("अपडेट नहीं हो सका, बाद में फिर कोशिश होगी. ",
                                          "Update failed, will try again later. ") + (msg == null ? "" : msg));
                                  if (updateDialog != null) updateDialog.setCancelable(true);
                              }
                          });
                      }
                  })).start();
              }

              private String t(String hi, String en) {
