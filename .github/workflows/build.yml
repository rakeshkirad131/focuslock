              /** Is profile ka samay abhi chal raha hai? */
              public static boolean schedNow(Context c, int i) {
                  if (i > 0 && !Pro.has(c)) return false;   // profile 2 aur 3 sirf Pro me
                  if (!schedOn(c, i) || schedPkgs(c, i).isEmpty()) return false;
                  Calendar cal = Calendar.getInstance();
                  int day = cal.get(Calendar.DAY_OF_WEEK) - 1;
                  int m = cal.get(Calendar.HOUR_OF_DAY) * 60 + cal.get(Calendar.MINUTE);
                  int s = schedStart(c, i), e = schedEnd(c, i);
                  int days = schedDays(c, i);
                  if (s == e) return false;
                  if (s < e) {
                      return ((days >> day) & 1) == 1 && m >= s && m < e;
                  }
                  // raat bhar wala (jaise 10 PM - 6 AM)
                  if (m >= s) return ((days >> day) & 1) == 1;
                  int prev = (day + 6) % 7;
                  return m < e && ((days >> prev) & 1) == 1;
              }

