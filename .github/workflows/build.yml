          package com.rakesh.focuslock;

          import android.animation.ValueAnimator;
          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Matrix;
          import android.graphics.Paint;
          import android.graphics.RadialGradient;
          import android.graphics.RectF;
          import android.graphics.Shader;
          import android.graphics.SweepGradient;
          import android.view.View;
          import android.view.animation.DecelerateInterpolator;

          /**
           * Gol progress ring, beech me bacha samay.
           * v3.12: do rang ki chamakti ring, andar halka ubhra hua gola (3D), aur samay dheere-dheere (smooth) ghatta hai.
           */
          public class RingView extends View {

              private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final RectF rect = new RectF();
              private final Matrix rot = new Matrix();
              private float progress;
              private float shown = -1f;
              private ValueAnimator anim;
              private String big = "";
              private String small = "";
              private int trackColor, ringColor, ringColor2, textColor, mutedColor;

              public RingView(Context c) {
                  super(c);
                  setLayerType(LAYER_TYPE_SOFTWARE, null); // parchhai (shadow layer) ke liye
              }

              public void setColors(int track, int ring, int text, int muted) {
                  trackColor = track;
                  ringColor = ring;
                  ringColor2 = Fx.shade(ring, 1.35f);
                  textColor = text;
                  mutedColor = muted;
                  invalidate();
              }

              public void set(float progress, String big, String small) {
                  this.progress = Math.max(0f, Math.min(1f, progress));
                  this.big = big == null ? "" : big;
                  this.small = small == null ? "" : small;
                  if (shown < 0f) {
                      // pehli baar: shuru se ghoomkar apni jagah tak
                      animateTo(0f, this.progress, 900);
                  } else if (Math.abs(this.progress - shown) > 0.0001f) {
                      animateTo(shown, this.progress, 900);
                  } else {
                      invalidate();
                  }
              }

              private void animateTo(float from, float to, long ms) {
                  if (anim != null) anim.cancel();
                  anim = ValueAnimator.ofFloat(from, to);
                  anim.setDuration(ms);
                  anim.setInterpolator(new DecelerateInterpolator(1.6f));
                  anim.addUpdateListener(a -> {
                      shown = (float) a.getAnimatedValue();
                      invalidate();
                  });
                  anim.start();
              }

              @Override
              protected void onDetachedFromWindow() {
                  if (anim != null) anim.cancel();
                  super.onDetachedFromWindow();
              }

              @Override
              protected void onDraw(Canvas canvas) {
                  super.onDraw(canvas);
                  float w = getWidth(), h = getHeight();
                  float size = Math.min(w, h);
                  float stroke = size * 0.08f;
                  float cx = w / 2f, cy = h / 2f;
                  float r = size / 2f - stroke;
                  rect.set(cx - r, cy - r, cx + r, cy + r);
                  float p = shown < 0f ? progress : shown;

                  // andar ka ubhra hua gola (upar-baayein roshni)
                  paint.setStyle(Paint.Style.FILL);
                  float inner = r - stroke * 0.9f;
                  paint.setShader(new RadialGradient(cx - inner * 0.3f, cy - inner * 0.35f, inner * 1.4f,
                          Color.argb(46, 255, 255, 255), Color.argb(0, 255, 255, 255), Shader.TileMode.CLAMP));
                  canvas.drawCircle(cx, cy, inner, paint);
                  paint.setShader(null);

                  // track
                  paint.setStyle(Paint.Style.STROKE);
                  paint.setStrokeWidth(stroke);
                  paint.setStrokeCap(Paint.Cap.ROUND);
                  paint.setColor(trackColor);
                  canvas.drawArc(rect, 0, 360, false, paint);

                  // chamakti ring + naram parchhai
                  SweepGradient sg = new SweepGradient(cx, cy, new int[]{ringColor, ringColor2, ringColor}, null);
                  rot.setRotate(-90, cx, cy);
                  sg.setLocalMatrix(rot);
                  paint.setShader(sg);
                  paint.setShadowLayer(stroke * 0.45f, 0, stroke * 0.25f, Color.argb(70, Color.red(ringColor),
                          Color.green(ringColor), Color.blue(ringColor)));
                  canvas.drawArc(rect, -90, Math.max(0.5f, 360f * p), false, paint);
                  paint.clearShadowLayer();
                  paint.setShader(null);

                  // ring ke sire par chhota chamakta gola
                  if (p > 0.005f) {
                      double ang = Math.toRadians(-90 + 360f * p);
                      float ex = cx + (float) (r * Math.cos(ang)), ey = cy + (float) (r * Math.sin(ang));
                      paint.setStyle(Paint.Style.FILL);
                      paint.setColor(Color.WHITE);
                      canvas.drawCircle(ex, ey, stroke * 0.22f, paint);
                  }

                  paint.setStyle(Paint.Style.FILL);
                  paint.setTextAlign(Paint.Align.CENTER);
                  paint.setTypeface(Fonts.head(getContext()));
                  paint.setColor(textColor);
                  paint.setTextSize(size * 0.15f);
                  canvas.drawText(big, cx, cy + size * 0.04f, paint);

                  paint.setTypeface(Fonts.body(getContext()));
                  paint.setColor(mutedColor);
                  paint.setTextSize(size * 0.07f);
                  canvas.drawText(small, cx, cy + size * 0.16f, paint);
              }
          }
