              private View stepRow(boolean done, String title, String hint, View.OnClickListener l) {
                  LinearLayout r = new LinearLayout(this);
                  r.setOrientation(LinearLayout.HORIZONTAL);
                  r.setGravity(Gravity.CENTER_VERTICAL);
                  r.setPadding(dp(14), dp(12), dp(14), dp(12));
                  r.setBackground(round(done ? ui.accentSoft : ui.bg, 14));
                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.addView(text(title, 16, ui.text, true));
                  col.addView(text(hint, 13, ui.muted, false));
                  r.addView(col, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                  r.addView(text(done ? "✅" : "›", 22, ui.accent, true));
                  r.setOnClickListener(l);
                  return r;
              }

