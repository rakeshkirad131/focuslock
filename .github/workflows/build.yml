              private void renderSchedule() {
                  addText("रोज़ का शेड्यूल", 18, DARK, true, dp(4));
                  addText("तय समय पर चुने हुए ऐप अपने आप बंद हो जाएँगे (जैसे काम के घंटे या रात में)।",
                          14, MUTED, false, dp(12));

                  if (Store.schedNow(this)) {
                      LinearLayout card = card(LIGHT);
                      card.addView(text("📅 शेड्यूल अभी चालू है", 20, DARK, true));
                      card.addView(text(Store.clockMin(Store.schedStart(this)) + " से "
                              + Store.clockMin(Store.schedEnd(this)) + " तक।\nखत्म होने के बाद बदल सकेंगे।", 15, MUTED, false));
                      content.addView(card);
                      addText("बंद ऐप:", 16, DARK, true, dp(8));
                      for (String pkg : Store.schedPkgs(this)) addText("•  " + labelOf(pkg), 16, Color.DKGRAY, false, dp(4));
                      return;
                  }

                  if (!schedDraftLoaded) {
                      schedStart = Store.schedStart(this);
                      schedEnd = Store.schedEnd(this);
                      schedDays = Store.schedDays(this);
                      schedDraftLoaded = true;
                  }

                  final Switch on = new Switch(this);
                  on.setText("शेड्यूल चालू  ");
                  on.setTextSize(17);
                  on.setChecked(Store.schedOn(this));
                  content.addView(on);

                  LinearLayout times = new LinearLayout(this);
                  times.setOrientation(LinearLayout.HORIZONTAL);
                  times.setPadding(0, dp(10), 0, dp(6));
                  Button sBtn = new Button(this);
                  sBtn.setAllCaps(false);
                  sBtn.setText("शुरू: " + Store.clockMin(schedStart));
                  sBtn.setOnClickListener(v -> new TimePickerDialog(this, (tp, h, m) -> {
                      schedStart = h * 60 + m;
                      render();
                  }, schedStart / 60, schedStart % 60, false).show());
                  Button eBtn = new Button(this);
                  eBtn.setAllCaps(false);
                  eBtn.setText("खत्म: " + Store.clockMin(schedEnd));
                  eBtn.setOnClickListener(v -> new TimePickerDialog(this, (tp, h, m) -> {
                      schedEnd = h * 60 + m;
                      render();
                  }, schedEnd / 60, schedEnd % 60, false).show());
                  times.addView(sBtn, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                  times.addView(eBtn, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                  content.addView(times);

                  addText("किन दिनों में?", 16, DARK, true, dp(4));
                  LinearLayout days = new LinearLayout(this);
                  days.setOrientation(LinearLayout.HORIZONTAL);
                  // Som se shuru karke dikhao
                  int[] order = {1, 2, 3, 4, 5, 6, 0};
                  for (int d : order) {
                      final int bit = d;
                      TextView t = new TextView(this);
                      t.setText(DAY_NAMES[d]);
                      t.setTextSize(15);
                      t.setGravity(Gravity.CENTER);
                      boolean sel = ((schedDays >> d) & 1) == 1;
                      t.setTextColor(sel ? Color.WHITE : DARK);
                      t.setBackground(round(sel ? GREEN : LIGHT, 20));
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, dp(40), 1f);
                      lp.setMargins(dp(2), 0, dp(2), 0);
                      t.setOnClickListener(v -> {
                          schedDays ^= (1 << bit);
                          render();
                      });
                      days.addView(t, lp);
                  }
                  content.addView(days);

                  addText("कौन से ऐप बंद हों?", 17, DARK, true, dp(16));
                  Set<String> picked = Store.schedPkgs(this);
                  if (picked.isEmpty()) picked = POPULAR;
                  addAppChecklist(picked);

                  showBottom("💾  शेड्यूल सेव करें", () -> {
                      Set<String> chosen = checkedPkgs();
                      if (on.isChecked() && chosen.isEmpty()) {
                          toast("कम से कम एक ऐप चुनें");
                          return;
                      }
                      if (on.isChecked() && schedDays == 0) {
                          toast("कम से कम एक दिन चुनें");
                          return;
                      }
                      if (schedStart == schedEnd) {
                          toast("शुरू और खत्म का समय अलग रखें");
                          return;
                      }
                      Store.saveSchedule(this, on.isChecked(), schedStart, schedEnd, schedDays, chosen);
                      BlockService.ensure(this);
                      toast(on.isChecked() ? "✅ शेड्यूल सेव और चालू" : "शेड्यूल बंद कर दिया");
                      render();
                  });
              }

