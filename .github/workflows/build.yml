              private void renderActive() {
                  renderStatsRow();
                  renderThought();
                  renderStrictWarning();

                  LinearLayout c = card();
                  c.setGravity(Gravity.CENTER_HORIZONTAL);
                  c.addView(text(t("🔒 फ़ोकस सत्र चालू है", "🔒 Focus session running"), 18, ui.text, true));
                  final RingView ring = new RingView(this);
                  ring.setColors(ui.accentSoft, ui.accent, ui.text, ui.muted);
                  LinearLayout.LayoutParams rlp = new LinearLayout.LayoutParams(dp(230), dp(230));
                  rlp.setMargins(0, dp(14), 0, dp(10));
                  c.addView(ring, rlp);
                  final TextView until = text("", 14, ui.muted, false);
                  until.setGravity(Gravity.CENTER);
                  c.addView(until);
                  c.addView(gap(8));
                  TextView note = text(t("समय पूरा होने से पहले यह लॉक नहीं खुलेगा।", "This lock won't open before time is up."),
                          13, ui.muted, false);
                  note.setGravity(Gravity.CENTER);
                  c.addView(note);
                  content.addView(c);

                  LinearLayout apps = card();
                  apps.addView(text(t("बंद ऐप", "Locked apps"), 16, ui.text, true));
                  apps.addView(gap(10));
                  HorizontalScrollView hs = new HorizontalScrollView(this);
                  hs.setHorizontalScrollBarEnabled(false);
                  LinearLayout icons = new LinearLayout(this);
                  icons.setOrientation(LinearLayout.HORIZONTAL);
                  for (String pkg : Store.pkgs(this)) {
                      LinearLayout one = new LinearLayout(this);
                      one.setOrientation(LinearLayout.VERTICAL);
                      one.setGravity(Gravity.CENTER_HORIZONTAL);
                      ImageView iv = new ImageView(this);
                      iv.setImageDrawable(iconOf(pkg));
                      iv.setAlpha(0.5f);
                      one.addView(iv, new LinearLayout.LayoutParams(dp(44), dp(44)));
                      TextView lb = text(labelOf(pkg), 11, ui.muted, false);
                      lb.setMaxWidth(dp(64));
                      lb.setSingleLine(true);
                      lb.setGravity(Gravity.CENTER);
                      one.addView(lb);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(dp(68), LinearLayout.LayoutParams.WRAP_CONTENT);
                      icons.addView(one, lp);
                  }
                  hs.addView(icons);
                  apps.addView(hs);
                  content.addView(apps);

                  final long emStart = Store.emergencyWaitLeft(this);
                  final TextView emText = Store.parentLive(this) ? null : renderEmergency(emStart);

                  activeTicker = new Runnable() {
                      @Override
                      public void run() {
                          long ms = Store.remaining(MainActivity.this);
                          long em = Store.emergencyWaitLeft(MainActivity.this);
                          if (emStart > 0 && em <= 0) {
                              render();
                              return;
                          }
                          if (emText != null && em > 0) {
                              emText.setText(t("⏳ " + L.left(MainActivity.this, em) + " बाद unlock कर सकेंगे",
                                      "⏳ You can unlock in " + L.left(MainActivity.this, em)));
                          }
                          if (ms <= 0) {
                              toast(t("🎉 शाबाश! फ़ोकस पूरा हुआ", "🎉 Well done! Focus complete"));
                              render();
                              return;
                          }
                          int total = Math.max(1, Store.sessionMins(MainActivity.this));
                          ring.set(1f - ms / (total * 60_000f), L.left(MainActivity.this, ms), t("बाकी", "left"));
                          until.setText(t(Store.clock(Store.end(MainActivity.this)) + " तक",
                                  "until " + Store.clock(Store.end(MainActivity.this))));
                          handler.postDelayed(this, 1000);
                      }
                  };
                  handler.post(activeTicker);
              }

              /** Hafte me 1 baar, 10 minute intezaar ke baad. Lautata hai: intezaar wala TextView (ya null). */
              private TextView renderEmergency(long wait) {
                  LinearLayout c = card();
                  c.addView(text(t("🆘 आपातकालीन unlock", "🆘 Emergency unlock"), 16, ui.text, true));
                  TextView live = null;
                  if (wait > 0) {
                      live = text("", 14, ui.warn, true);
                      live.setPadding(0, dp(6), 0, dp(8));
                      c.addView(live);
                      c.addView(text(t("तब तक ऐप बंद रहेंगे। सच में ज़रूरी न हो तो रद्द कर दें।",
                              "Apps stay locked meanwhile. Cancel if it is not really urgent."), 13, ui.muted, false));
                      TextView cancel = pill(t("रद्द करें", "Cancel request"), false);
                      cancel.setOnClickListener(v -> {
                          Store.emergencyCancel(this);
                          toast(t("👍 बढ़िया! फ़ोकस जारी", "👍 Great! Focus continues"));
                          render();
                      });
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                      lp.setMargins(0, dp(10), 0, 0);
                      c.addView(cancel, lp);
                  } else if (wait == 0) {
                      c.addView(text(t("इंतज़ार पूरा। अब चाहें तो फ़ोकस खत्म कर सकते हैं (यह streak में नहीं गिना जाएगा)।",
                              "Wait over. You may end the focus now (it won't count toward your streak)."), 13, ui.muted, false));
                      TextView go = pill(t("🔓 अभी unlock करें", "🔓 Unlock now"), true);
                      go.setOnClickListener(v -> new AlertDialog.Builder(this)
                              .setTitle(t("फ़ोकस खत्म करें?", "End the focus?"))
                              .setMessage(t("अगला आपातकालीन unlock 7 दिन बाद मिलेगा।", "The next emergency unlock is available in 7 days."))
                              .setPositiveButton(t("हाँ, unlock", "Yes, unlock"), (d, w) -> {
                                  Store.emergencyUse(this);
                                  BlockService.ensure(this);
                                  toast(t("🔓 Unlock हो गया", "🔓 Unlocked"));
                                  render();
                              })
                              .setNegativeButton(t("नहीं, फ़ोकस जारी रखें", "No, keep focusing"), (d, w) -> {
                                  Store.emergencyCancel(this);
                                  render();
                              })
                              .show());
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                      lp.setMargins(0, dp(10), 0, 0);
                      c.addView(go, lp);
                  } else if (Store.emergencyAvailable(this)) {
                      c.addView(text(t("सच में ज़रूरी हो तो। हफ़्ते में 1 बार, माँगने के बाद 10 मिनट इंतज़ार।",
                              "Only for real emergencies. Once a week, with a 10-minute wait after asking."), 13, ui.muted, false));
                      TextView ask = pill(t("आपातकालीन unlock माँगें", "Request emergency unlock"), false);
                      ask.setOnClickListener(v -> requirePin(() -> {
                          Store.emergencyRequest(this);
                          render();
                      }));
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                      lp.setMargins(0, dp(10), 0, 0);
                      c.addView(ask, lp);
                  } else {
                      c.addView(text(t("अगला आपातकालीन unlock " + Store.emergencyDaysLeft(this) + " दिन बाद।",
                              "Next emergency unlock in " + Store.emergencyDaysLeft(this) + " days."), 13, ui.muted, false));
                  }
                  content.addView(c);
