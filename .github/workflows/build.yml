      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK banao
        working-directory: FocusLock
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK ka naam badlo
        run: |
          VER=$(grep versionName FocusLock/app/build.gradle | grep -o '"[^"]*"' | tr -d '"')
          cp FocusLock/app/build/outputs/apk/debug/app-debug.apk "FocusLock-v${VER}.apk"
          echo "VER=$VER" >> $GITHUB_ENV

      - name: Release me APK daalo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}-build${{ github.run_number }}
          name: FocusLock v${{ env.VER }} (build ${{ github.run_number }})
          files: FocusLock-v${{ env.VER }}.apk
