          package com.rakesh.focuslock;

          import android.animation.ValueAnimator;
          import android.graphics.Color;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.LayerDrawable;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.animation.DecelerateInterpolator;
          import android.view.animation.OvershootInterpolator;

          /**
           * v3.12: 3D aur smooth effects.
           * - raised(): button jaisa utha hua: neeche gehra kinara + upar halki chamak.
           * - press(): dabane par andar dhanse, chhodne par uchhal kar wapas.
           * - enter(): screen ke cards ek-ek karke halke se upar aayein.
           */
          public final class Fx {
              private Fx() {}

              /** Rang ko gehra / halka karo (f < 1 gehra, > 1 halka). */
              public static int shade(int c, float f) {
                  int a = Color.alpha(c);
                  int r = Color.red(c), g = Color.green(c), b = Color.blue(c);
                  if (f < 1f) {
                      r = (int) (r * f); g = (int) (g * f); b = (int) (b * f);
                  } else {
                      float t = f - 1f;
                      r = (int) (r + (255 - r) * t); g = (int) (g + (255 - g) * t); b = (int) (b + (255 - b) * t);
                  }
                  return Color.argb(a, Math.min(255, r), Math.min(255, g), Math.min(255, b));
              }

              /** Utha hua 3D chehra: neeche edge, upar se halka gradient, upari kinare par chamak. */
              public static Drawable raised(int top, int bottom, int edge, float radius, int depth) {
                  GradientDrawable base = new GradientDrawable();
                  base.setColor(edge);
                  base.setCornerRadius(radius);

                  GradientDrawable face = new GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, new int[]{top, bottom});
                  face.setCornerRadius(radius);
                  face.setStroke(1, Color.argb(60, 255, 255, 255));

                  LayerDrawable ld = new LayerDrawable(new Drawable[]{base, face});
                  ld.setLayerInset(1, 0, 0, 0, depth);
                  return ld;
              }

              /** Dabane ka ehsaas: thoda chhota + neeche; chhodne par spring se wapas. */
              public static void press(final View v) {
                  v.setOnTouchListener((view, e) -> {
                      switch (e.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              view.animate().scaleX(0.96f).scaleY(0.96f).translationY(view.getResources().getDisplayMetrics().density * 2)
                                      .setDuration(90).setInterpolator(new DecelerateInterpolator()).start();
                              break;
                          case MotionEvent.ACTION_UP:
                          case MotionEvent.ACTION_CANCEL:
                              view.animate().scaleX(1f).scaleY(1f).translationY(0)
                                      .setDuration(260).setInterpolator(new OvershootInterpolator(2.2f)).start();
                              break;
                          default:
                              break;
                      }
                      return false;   // click chalta rahe
                  });
              }

              /** Screen ke bachche (cards) ek ke baad ek halke se upar aayein. */
              public static void enter(ViewGroup parent) {
                  float dy = parent.getResources().getDisplayMetrics().density * 18;
                  int n = Math.min(parent.getChildCount(), 8);
                  for (int i = 0; i < n; i++) {
                      View c = parent.getChildAt(i);
                      c.setAlpha(0f);
                      c.setTranslationY(dy);
                      c.animate().alpha(1f).translationY(0).setStartDelay(i * 45L).setDuration(340)
                              .setInterpolator(new DecelerateInterpolator(2f)).start();
                  }
              }

              /** Ek baar halka uchhal (jaise chuna gaya tab). */
              public static void pop(View v) {
                  v.setScaleX(0.9f);
                  v.setScaleY(0.9f);
                  v.animate().scaleX(1f).scaleY(1f).setDuration(320).setInterpolator(new OvershootInterpolator(3f)).start();
              }

              /** Dheere-dheere saans jaisa ubharna (lock screen glow ke liye). */
              public static ValueAnimator breathe(final View v, long ms) {
                  ValueAnimator a = ValueAnimator.ofFloat(0.92f, 1.06f);
                  a.setDuration(ms);
                  a.setRepeatMode(ValueAnimator.REVERSE);
                  a.setRepeatCount(ValueAnimator.INFINITE);
                  a.addUpdateListener(an -> {
                      float s = (float) an.getAnimatedValue();
                      v.setScaleX(s);
                      v.setScaleY(s);
                  });
                  a.start();
                  return a;
              }
          }
