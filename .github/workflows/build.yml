                  c.addView(gap(14));
                  c.addView(stepRow(usage, t("1. ऐप उपयोग की अनुमति", "1. Usage access"),
                          t("सूची में \"Lagaam\" चालू करें", "Turn on \"Lagaam\" in the list"),
                          v -> open(new Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS))));
                  c.addView(gap(10));
                  c.addView(stepRow(overlay, t("2. दूसरे ऐप्स के ऊपर दिखाएँ", "2. Display over other apps"),
                          t("\"Allow display over other apps\" चालू करें", "Turn on \"Allow display over other apps\""),
                          v -> open(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:" + getPackageName())))));
                  content.addView(c);
                  if (!Edition.lite(this)) addRestrictedNote();
