              /** v3.5: widget se "25 मिनट फ़ोकस" — pakka karne ka sawaal dikhao. */
              private void handleQuick() {
                  Intent in = getIntent();
                  if (in == null) return;
                  int q = in.getIntExtra("quick", 0);
                  if (q <= 0) return;
                  in.removeExtra("quick");
                  setIntent(in);
                  if (Store.active(this) || !hasUsageAccess() || !Settings.canDrawOverlays(this)) return;
                  tab = 0;
                  selectedMinutes = q;
                  render();
                  confirmStart();
              }

