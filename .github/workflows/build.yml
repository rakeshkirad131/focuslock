              private void addAppChecklist(LinearLayout parent, Set<String> picked) {
                  List<App> first = new ArrayList<>();
                  List<App> rest = new ArrayList<>();
                  for (App a : apps()) {
                      if (picked.contains(a.pkg)) first.add(a);
                      else rest.add(a);
                  }
                  first.addAll(rest);
                  for (App app : first) {
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      row.setGravity(Gravity.CENTER_VERTICAL);
                      row.setPadding(0, dp(6), 0, dp(6));

                      ImageView icon = new ImageView(this);
                      icon.setImageDrawable(app.icon);
                      row.addView(icon, new LinearLayout.LayoutParams(dp(36), dp(36)));

                      CheckBox cb = new CheckBox(this);
                      cb.setText(app.label);
                      cb.setTextSize(15);
                      cb.setChecked(picked.contains(app.pkg));
                      cb.setTextColor(ui.text);
                      cb.setButtonTintList(ColorStateList.valueOf(ui.accent));
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                              0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                      lp.setMargins(dp(12), 0, 0, 0);
                      row.addView(cb, lp);
                      row.setOnClickListener(v -> cb.toggle());

                      parent.addView(row);
                      boxes.put(app.pkg, cb);
                  }
              }

              private Set<String> checkedPkgs() {
                  Set<String> chosen = new HashSet<>();
                  for (Map.Entry<String, CheckBox> e : boxes.entrySet()) {
                      if (e.getValue().isChecked()) chosen.add(e.getKey());
                  }
                  return chosen;
              }

              private List<App> apps() {
                  if (appsCache != null) return appsCache;
                  PackageManager pm = getPackageManager();

                  Set<String> skip = new HashSet<>();
                  skip.add(getPackageName());
                  Intent home = new Intent(Intent.ACTION_MAIN);
                  home.addCategory(Intent.CATEGORY_HOME);
                  for (ResolveInfo ri : pm.queryIntentActivities(home, 0)) {
                      skip.add(ri.activityInfo.packageName);
                  }
                  try {
                      TelecomManager tm = (TelecomManager) getSystemService(TELECOM_SERVICE);
                      String dialer = tm.getDefaultDialerPackage();
                      if (dialer != null) skip.add(dialer);
                  } catch (Exception ignored) {
                  }

                  Intent launcher = new Intent(Intent.ACTION_MAIN);
                  launcher.addCategory(Intent.CATEGORY_LAUNCHER);
                  Map<String, App> unique = new LinkedHashMap<>();
                  for (ResolveInfo ri : pm.queryIntentActivities(launcher, 0)) {
                      String pkg = ri.activityInfo.packageName;
                      if (skip.contains(pkg) || unique.containsKey(pkg)) continue;
                      App a = new App();
                      a.pkg = pkg;
                      a.label = ri.loadLabel(pm).toString();
                      try {
                          a.icon = ri.loadIcon(pm);
                      } catch (Exception ignored) {
                      }
                      unique.put(pkg, a);
                  }
                  List<App> list = new ArrayList<>(unique.values());
                  list.sort((a, b) -> a.label.compareToIgnoreCase(b.label));
                  appsCache = list;
                  return list;
              }

              private String labelOf(String pkg) {
                  String l = labelCache.get(pkg);
                  if (l != null) return l;
                  l = pkg;
                  try {
                      PackageManager pm = getPackageManager();
                      l = pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)).toString();
                  } catch (Exception ignored) {
                  }
                  labelCache.put(pkg, l);
                  return l;
              }

              private Drawable iconOf(String pkg) {
                  try {
                      return getPackageManager().getApplicationIcon(pkg);
                  } catch (Exception e) {
                      return null;
                  }
              }

              // ================= system =================

              private boolean hasUsageAccess() {
                  AppOpsManager aom = (AppOpsManager) getSystemService(APP_OPS_SERVICE);
                  int mode;
                  if (Build.VERSION.SDK_INT >= 29) {
                      mode = aom.unsafeCheckOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS,
                              Process.myUid(), getPackageName());
                  } else {
                      mode = aom.checkOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS,
                              Process.myUid(), getPackageName());
                  }
                  if (mode == AppOpsManager.MODE_DEFAULT) {
                      return checkSelfPermission(Manifest.permission.PACKAGE_USAGE_STATS)
                              == PackageManager.PERMISSION_GRANTED;
                  }
                  return mode == AppOpsManager.MODE_ALLOWED;
              }

              private boolean a11yEnabled() {
                  String enabled = Settings.Secure.getString(getContentResolver(),
                          Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                  if (enabled == null) return false;
                  ComponentName me = new ComponentName(this, ShortsService.class);
                  String full = me.flattenToString();
                  String shortName = me.flattenToShortString();
                  for (String s : enabled.split(":")) {
                      if (s.equalsIgnoreCase(full) || s.equalsIgnoreCase(shortName)) return true;
                  }
                  return false;
              }

              private void openBatterySetting() {
                  try {
                      startActivity(new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                              Uri.parse("package:" + getPackageName())));
                  } catch (Exception e) {
                      open(new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS));
                  }
              }

              private void open(Intent i) {
                  try {
                      startActivity(i);
                  } catch (Exception e) {
                      try {
                          startActivity(new Intent(Settings.ACTION_SETTINGS));
                      } catch (Exception ignored) {
                      }
                  }
              }

