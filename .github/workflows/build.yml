              private void renderLimits() {
                  addText("हर ऐप के लिए रोज़ की सीमा", 18, DARK, true, dp(4));
                  addText("सीमा पूरी होते ही ऐप रात 12 बजे तक बंद रहेगा।", 14, MUTED, false, dp(12));

                  boolean locked = Store.lockedNow(this);
                  if (locked) {
                      addText("🔒 फ़ोकस/शेड्यूल चालू है: अभी सिर्फ़ नई सीमा लगा सकते हैं या सीमा घटा सकते हैं।",
                              14, Color.parseColor("#9C6644"), false, dp(10));
                  }

                  final Map<String, Long> usage = Usage.today(this);
                  final Map<String, Integer> limits = Store.limits(this);
                  List<App> apps = new ArrayList<>(apps());
                  apps.sort((a, b) -> {
                      boolean la = limits.containsKey(a.pkg), lb = limits.containsKey(b.pkg);
                      if (la != lb) return la ? -1 : 1;
                      long ua = usage.containsKey(a.pkg) ? usage.get(a.pkg) : 0;
                      long ub = usage.containsKey(b.pkg) ? usage.get(b.pkg) : 0;
                      return Long.compare(ub, ua);
                  });

                  for (App app : apps) {
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      row.setGravity(Gravity.CENTER_VERTICAL);
                      row.setPadding(0, dp(6), 0, dp(6));

                      ImageView icon = new ImageView(this);
                      icon.setImageDrawable(app.icon);
                      row.addView(icon, new LinearLayout.LayoutParams(dp(36), dp(36)));

                      long usedMin = (usage.containsKey(app.pkg) ? usage.get(app.pkg) : 0) / 60_000L;
                      Integer lim = limits.get(app.pkg);
                      TextView t = text(app.label + "\nआज: " + Store.mins(usedMin)
                              + (lim != null ? "  /  " + Store.minutesLabel(lim) : ""), 15,
                              lim != null && usedMin >= lim ? Color.parseColor("#B00020") : DARK, false);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                              0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                      lp.setMargins(dp(12), 0, dp(8), 0);
                      row.addView(t, lp);

                      Button btn = new Button(this);
                      btn.setAllCaps(false);
                      btn.setTextSize(14);
                      btn.setText(lim != null ? "⏳ " + Store.minutesLabel(lim) : "सीमा लगाएँ");
                      btn.setOnClickListener(v -> chooseLimit(app, lim, locked));
                      row.addView(btn);

                      content.addView(row);
                  }
              }

              private void chooseLimit(App app, Integer current, boolean locked) {
                  String[] labels = new String[LIMIT_OPTIONS.length];
                  for (int i = 0; i < LIMIT_OPTIONS.length; i++) {
                      labels[i] = LIMIT_OPTIONS[i] == 0 ? "कोई सीमा नहीं" : Store.minutesLabel(LIMIT_OPTIONS[i]);
                  }
                  new AlertDialog.Builder(this)
                          .setTitle(app.label + " – रोज़ कितनी देर?")
                          .setItems(labels, (d, which) -> {
                              int m = LIMIT_OPTIONS[which];
                              boolean loosen = current != null && (m == 0 || m > current);
                              if (locked && loosen) {
                                  toast("लॉक के दौरान सीमा बढ़ा या हटा नहीं सकते");
                                  return;
                              }
                              Store.setLimit(this, app.pkg, m);
                              BlockService.ensure(this);
                              render();
                          })
                          .show();
              }

