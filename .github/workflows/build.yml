              private void addSwitch(String label, boolean value, final String key, final boolean strictKey) {
                  Switch s = new Switch(this);
                  s.setText(label + "  ");
                  s.setTextSize(16);
                  s.setChecked(value);
                  s.setPadding(0, dp(8), 0, dp(8));
                  s.setOnCheckedChangeListener((btn, checked) -> {
                      if (!checked && Store.lockedNow(this)) {
                          toast("लॉक के दौरान इसे बंद नहीं कर सकते");
                          btn.setChecked(true);
                          return;
                      }
                      if (checked && strictKey && !a11yEnabled()) {
                          toast("पहले ऊपर से ब्लॉक सेवा चालू करें");
                      }
                      Store.setFlag(this, key, checked);
                  });
                  content.addView(s);
              }

              private boolean a11yEnabled() {
                  String enabled = Settings.Secure.getString(getContentResolver(),
                          Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                  if (enabled == null) return false;
                  ComponentName me = new ComponentName(this, ShortsService.class);
                  String full = me.flattenToString();
                  String shortName = me.flattenToShortString();
                  for (String s : enabled.split(":")) {
                      if (s.equalsIgnoreCase(full) || s.equalsIgnoreCase(shortName)) return true;
                  }
                  return false;
              }

