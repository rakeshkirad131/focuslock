              /** looseWhenOn: true = ON karna dheel dena hai (jaise "sirf lock ke samay"). */
              private View guardSwitch(String label, boolean value, final String key, final boolean looseWhenOn) {
                  Switch s = new Switch(this);
                  s.setText(L.clean(label) + "  ");
                  s.setTextSize(15);
                  s.setChecked(value);
                  s.setPadding(0, dp(10), 0, dp(10));
                  styleSwitch(s);
                  s.setOnCheckedChangeListener((btn, checked) -> {
                      if (Boolean.TRUE.equals(btn.getTag())) return;
                      boolean loosen = checked == looseWhenOn;
                      if (!loosen) {
                          Store.setFlag(this, key, checked);
                          if (checked && "strict".equals(key) && !a11yEnabled()) {
                              toast(t("ब्लॉक सेवा भी चालू करें", "Also turn on the block service"));
                          }
                          return;
                      }
                      setSilently(btn, !checked);
                      if (Store.lockedNow(this)) {
                          toast(t("लॉक के दौरान इसे बदल नहीं सकते", "Can't change this during a lock"));
                          return;
                      }
                      requirePin(() -> {
                          Store.setFlag(this, key, checked);
                          render();
                      });
                  });
                  return s;
              }

              private void setSilently(CompoundButton b, boolean v) {
                  b.setTag(Boolean.TRUE);
                  b.setChecked(v);
                  b.setTag(null);
              }

              private void askSite() {
                  final EditText et = new EditText(this);
                  et.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_URI);
                  et.setHint("example.com");
                  new AlertDialog.Builder(this)
                          .setTitle(t("वेबसाइट जोड़ें", "Add website"))
                          .setView(padded(et))
                          .setPositiveButton("OK", (d, w) -> {
                              String s = et.getText().toString().trim().toLowerCase(Locale.ROOT);
                              int sch = s.indexOf("://");
                              if (sch >= 0) s = s.substring(sch + 3);
                              if (s.startsWith("www.")) s = s.substring(4);
                              int slash = s.indexOf('/');
                              if (slash >= 0) s = s.substring(0, slash);
                              if (!s.contains(".") || s.contains(" ")) {
                                  toast(t("सही वेबसाइट लिखें, जैसे example.com", "Enter a valid site like example.com"));
                                  return;
                              }
                              Set<String> all = Store.sites(this);
                              all.add(s);
                              Store.setSites(this, all);
                              render();
                          })
                          .setNegativeButton(t("रद्द", "Cancel"), null)
                          .show();
              }

              // ================= PIN =================

              private void requirePin(final Runnable ok) {
                  if (!Store.hasPin(this)) {
                      ok.run();
                      return;
                  }
                  final EditText et = new EditText(this);
                  et.setInputType(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_VARIATION_PASSWORD);
                  et.setHint("PIN");
                  new AlertDialog.Builder(this)
                          .setTitle(t("🔑 PIN डालें", "🔑 Enter PIN"))
                          .setView(padded(et))
                          .setPositiveButton("OK", (d, w) -> {
                              if (Store.checkPin(this, et.getText().toString())) ok.run();
                              else toast(t("गलत PIN", "Wrong PIN"));
                          })
                          .setNegativeButton(t("रद्द", "Cancel"), null)
                          .show();
              }

              private void askNewPin() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  final EditText p1 = new EditText(this);
                  p1.setInputType(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_VARIATION_PASSWORD);
                  p1.setHint(t("नया PIN (4 से 8 अंक)", "New PIN (4 to 8 digits)"));
                  final EditText p2 = new EditText(this);
                  p2.setInputType(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_VARIATION_PASSWORD);
                  p2.setHint(t("दोबारा लिखें", "Repeat PIN"));
                  box.addView(p1);
                  box.addView(p2);
                  new AlertDialog.Builder(this)
                          .setTitle(t("🔑 PIN लगाएँ", "🔑 Set PIN"))
                          .setView(padded(box))
                          .setPositiveButton("OK", (d, w) -> {
                              String a = p1.getText().toString(), b = p2.getText().toString();
                              if (a.length() < 4 || a.length() > 8) {
                                  toast(t("PIN 4 से 8 अंक का हो", "PIN must be 4 to 8 digits"));
                              } else if (!a.equals(b)) {
                                  toast(t("दोनों PIN एक जैसे नहीं", "PINs don't match"));
                              } else {
                                  Store.setPin(this, a);
                                  toast(t("✅ PIN लग गया", "✅ PIN set"));
                                  render();
                              }
                          })
                          .setNegativeButton(t("रद्द", "Cancel"), null)
                          .show();
              }

              // ================= 5. STATS =================

              private void renderStats() {
                  Map<String, Long> usage = Usage.today(this);
                  long total = 0;
                  for (long v : usage.values()) total += v;

                  LinearLayout top = card();
                  top.addView(text(t("आज का स्क्रीन टाइम", "Screen time today"), 14, ui.muted, false));
                  top.addView(text(L.mins(this, total / 60_000L), 32, ui.text, true));
                  content.addView(top);

                  // v3.9: band app kholne ki koshish
                  Map<String, Integer> tries = Store.blocksToday(this);
                  LinearLayout tr = card();
                  tr.addView(text(t("🚫 आज बंद ऐप खोलने की कोशिश", "🚫 Tries to open locked apps today"), 16, ui.text, true));
                  if (tries.isEmpty()) {
                      tr.addView(text(t("एक भी नहीं 👏", "None at all 👏"), 14, ui.accent, true));
                  } else {
                      List<Map.Entry<String, Integer>> tl = new ArrayList<>(tries.entrySet());
                      java.util.Collections.sort(tl, (a, b) -> b.getValue() - a.getValue());
                      for (Map.Entry<String, Integer> e : tl) {
                          LinearLayout row = new LinearLayout(this);
                          row.setOrientation(LinearLayout.HORIZONTAL);
                          row.setPadding(0, dp(6), 0, dp(6));
                          row.addView(text(labelOf(e.getKey()), 15, ui.text, false),
                                  new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                          row.addView(text(e.getValue() + t(" बार", "×"), 15, ui.danger, true));
                          tr.addView(row);
                      }
                  }
                  content.addView(tr);

                  long[] week = Usage.week(this);
                  String[] labels = new String[7];
                  Calendar cal = Calendar.getInstance();
                  cal.add(Calendar.DAY_OF_YEAR, -6);
                  for (int i = 0; i < 7; i++) {
                      int d = cal.get(Calendar.DAY_OF_WEEK) - 1;
                      labels[i] = L.en(this) ? DAYS_EN[d] : DAYS_HI[d];
                      cal.add(Calendar.DAY_OF_YEAR, 1);
                  }
                  long sum = 0;
                  for (long v : week) sum += v;
                  LinearLayout wk = card();
                  wk.addView(text(t("📈 पिछले 7 दिन", "📈 Last 7 days"), 16, ui.text, true));
                  wk.addView(text(t("रोज़ औसत: ", "Daily average: ") + L.mins(this, sum / 7), 13, ui.muted, false));
                  BarChartView chart = new BarChartView(this);
                  chart.setColors(ui.accentSoft, ui.accent, ui.text, ui.muted);
                  chart.setData(week, labels);
                  LinearLayout.LayoutParams clp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, dp(180));
                  clp.setMargins(0, dp(12), 0, 0);
                  wk.addView(chart, clp);
                  content.addView(wk);

                  renderStatsRow();

                  // 🏆 khud se mukabla: pichhle 7 din ka screen time history me daalo
                  long todayDay = java.time.LocalDate.now().toEpochDay();
                  for (int i = 0; i < 7; i++) {
                      long d = todayDay - 6 + i;
                      if (week[i] > 0 || d == todayDay) Score.setScreen(this, d, (int) week[i]);
                  }
                  if (Pro.has(this)) renderLeaderboard(todayDay);
                  else proGate(t("🏆 खुद से मुकाबला + 🎖️ Badges", "🏆 Beat your best + 🎖️ Badges"));

                  LinearLayout list = card();
                  list.addView(text(t("सबसे ज़्यादा चले ऐप (आज)", "Most used apps (today)"), 16, ui.text, true));
                  list.addView(gap(6));
                  List<Map.Entry<String, Long>> entries = new ArrayList<>(usage.entrySet());
                  entries.sort((a, b) -> Long.compare(b.getValue(), a.getValue()));
                  long max = entries.isEmpty() ? 1 : Math.max(1, entries.get(0).getValue());
                  int shown = 0;
                  for (Map.Entry<String, Long> e : entries) {
                      long min = e.getValue() / 60_000L;
                      if (min < 1) continue;
                      if (shown++ >= 12) break;
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      row.setGravity(Gravity.CENTER_VERTICAL);
                      row.setPadding(0, dp(7), 0, dp(7));
                      ImageView iv = new ImageView(this);
                      iv.setImageDrawable(iconOf(e.getKey()));
                      row.addView(iv, new LinearLayout.LayoutParams(dp(32), dp(32)));
                      LinearLayout col = new LinearLayout(this);
                      col.setOrientation(LinearLayout.VERTICAL);
                      LinearLayout top2 = new LinearLayout(this);
                      top2.setOrientation(LinearLayout.HORIZONTAL);
                      top2.addView(text(labelOf(e.getKey()), 14, ui.text, true),
                              new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                      top2.addView(text(L.mins(this, min), 13, ui.muted, false));
                      col.addView(top2);
                      col.addView(gap(4));
                      col.addView(progressBar(e.getValue() / (float) max, ui.accent),
                              new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(6)));
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                      lp.setMargins(dp(12), 0, 0, 0);
                      row.addView(col, lp);
                      list.addView(row);
                  }
                  if (shown == 0) list.addView(text(t("आज अभी तक कोई डेटा नहीं।", "No data yet today."), 14, ui.muted, false));
                  content.addView(list);
              }

