              private void payUpi(int rs, String plan, String dev) {
                  try {
                      // v3.14: business (merchant) ID par bhejo, merchant code ke saath
                      Uri.Builder ub = new Uri.Builder().scheme("upi").authority("pay")
                              .appendQueryParameter("pa", Pro.QR_PA)
                              .appendQueryParameter("pn", Pro.QR_PN)
                              .appendQueryParameter("mc", Pro.QR_MC);
                      Uri u = ub
                              .appendQueryParameter("am", rs + ".00")
                              .appendQueryParameter("cu", "INR")
                              .appendQueryParameter("tn", "Lagaam Pro " + dev)
                              .build();
                      startActivity(Intent.createChooser(new Intent(Intent.ACTION_VIEW, u), t("UPI ऐप चुनें", "Choose UPI app")));
                  } catch (Exception e) {
                      copyText(Pro.QR_PA);
                      toast(t("UPI ऐप नहीं मिला। UPI ID कॉपी हो गई: ", "No UPI app found. UPI ID copied: ") + Pro.QR_PA);
                  }
              }

              private void openWhatsApp(String msg) {
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW,
                              Uri.parse("https://wa.me/" + Pro.WHATSAPP + "?text=" + Uri.encode(msg))));
                  } catch (Exception e) {
                      toast(t("WhatsApp नहीं खुला", "Couldn't open WhatsApp"));
                  }
              }

