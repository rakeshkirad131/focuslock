              private void renderStats() {
                  Map<String, Long> usage = Usage.today(this);
                  long total = 0;
                  for (long v : usage.values()) total += v;

                  LinearLayout card = card(LIGHT);
                  card.addView(text("आज का स्क्रीन टाइम", 15, MUTED, false));
                  card.addView(text(Store.mins(total / 60_000L), 28, DARK, true));
                  content.addView(card);

                  LinearLayout c2 = card(Color.parseColor("#FFF3E0"));
                  c2.addView(text("🔥 लगातार " + Store.streak(this) + " दिन फ़ोकस", 18, Color.parseColor("#9C4A00"), true));
                  c2.addView(text("आज फ़ोकस सत्र: " + Store.mins(Store.focusToday(this)), 15,
                          Color.parseColor("#9C6644"), false));
                  content.addView(c2);

                  addText("सबसे ज़्यादा चले ऐप", 17, DARK, true, dp(8));
                  List<Map.Entry<String, Long>> list = new ArrayList<>(usage.entrySet());
                  list.sort((a, b) -> Long.compare(b.getValue(), a.getValue()));
                  long max = list.isEmpty() ? 1 : Math.max(1, list.get(0).getValue());
                  int shown = 0;
                  for (Map.Entry<String, Long> e : list) {
                      long min = e.getValue() / 60_000L;
                      if (min < 1) continue;
                      if (shown++ >= 12) break;

                      addText(labelOf(e.getKey()) + "  –  " + Store.mins(min), 15, DARK, false, dp(2));
                      LinearLayout bar = new LinearLayout(this);
                      bar.setOrientation(LinearLayout.HORIZONTAL);
                      View fill = new View(this);
                      fill.setBackground(round(GREEN, 6));
                      float w = (float) e.getValue() / max;
                      bar.addView(fill, new LinearLayout.LayoutParams(0, dp(10), Math.max(w, 0.02f)));
                      View rest = new View(this);
                      bar.addView(rest, new LinearLayout.LayoutParams(0, dp(10), Math.max(1f - w, 0.0001f)));
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT, dp(10));
                      lp.setMargins(0, 0, 0, dp(12));
                      content.addView(bar, lp);
                  }
                  if (shown == 0) addText("आज अभी तक कोई डेटा नहीं।", 15, Color.GRAY, false, 0);
              }

              // ================= helpers =================

              private void addAppChecklist(Set<String> picked) {
                  List<App> first = new ArrayList<>();
                  List<App> rest = new ArrayList<>();
                  for (App a : apps()) {
                      if (picked.contains(a.pkg)) first.add(a);
                      else rest.add(a);
                  }
                  first.addAll(rest);
                  for (App app : first) {
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      row.setGravity(Gravity.CENTER_VERTICAL);
                      row.setPadding(0, dp(6), 0, dp(6));

                      ImageView icon = new ImageView(this);
                      icon.setImageDrawable(app.icon);
                      row.addView(icon, new LinearLayout.LayoutParams(dp(36), dp(36)));

                      CheckBox cb = new CheckBox(this);
                      cb.setText(app.label);
                      cb.setTextSize(16);
                      cb.setChecked(picked.contains(app.pkg));
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                              0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                      lp.setMargins(dp(12), 0, 0, 0);
                      row.addView(cb, lp);
                      row.setOnClickListener(v -> cb.toggle());

                      content.addView(row);
                      boxes.put(app.pkg, cb);
                  }
              }

              private Set<String> checkedPkgs() {
                  Set<String> chosen = new HashSet<>();
                  for (Map.Entry<String, CheckBox> e : boxes.entrySet()) {
                      if (e.getValue().isChecked()) chosen.add(e.getKey());
                  }
                  return chosen;
              }

              private List<App> apps() {
                  if (appsCache != null) return appsCache;
                  PackageManager pm = getPackageManager();

                  Set<String> skip = new HashSet<>();
                  skip.add(getPackageName());
                  Intent home = new Intent(Intent.ACTION_MAIN);
                  home.addCategory(Intent.CATEGORY_HOME);
                  for (ResolveInfo ri : pm.queryIntentActivities(home, 0)) {
                      skip.add(ri.activityInfo.packageName);
                  }
                  try {
                      TelecomManager tm = (TelecomManager) getSystemService(TELECOM_SERVICE);
                      String dialer = tm.getDefaultDialerPackage();
                      if (dialer != null) skip.add(dialer);
                  } catch (Exception ignored) {
                  }

                  Intent launcher = new Intent(Intent.ACTION_MAIN);
                  launcher.addCategory(Intent.CATEGORY_LAUNCHER);
                  Map<String, App> unique = new LinkedHashMap<>();
                  for (ResolveInfo ri : pm.queryIntentActivities(launcher, 0)) {
                      String pkg = ri.activityInfo.packageName;
                      if (skip.contains(pkg) || unique.containsKey(pkg)) continue;
                      App a = new App();
                      a.pkg = pkg;
                      a.label = ri.loadLabel(pm).toString();
                      try {
                          a.icon = ri.loadIcon(pm);
                      } catch (Exception ignored) {
                      }
                      unique.put(pkg, a);
                  }
                  List<App> list = new ArrayList<>(unique.values());
                  list.sort((a, b) -> a.label.compareToIgnoreCase(b.label));
                  appsCache = list;
                  return list;
              }

              private final Map<String, String> labelCache = new HashMap<>();

              private String labelOf(String pkg) {
                  String l = labelCache.get(pkg);
                  if (l != null) return l;
                  l = pkg;
                  try {
                      PackageManager pm = getPackageManager();
                      l = pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)).toString();
                  } catch (Exception ignored) {
                  }
                  labelCache.put(pkg, l);
                  return l;
              }

              private boolean hasUsageAccess() {
                  AppOpsManager aom = (AppOpsManager) getSystemService(APP_OPS_SERVICE);
                  int mode;
                  if (Build.VERSION.SDK_INT >= 29) {
                      mode = aom.unsafeCheckOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS,
                              Process.myUid(), getPackageName());
                  } else {
                      mode = aom.checkOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS,
                              Process.myUid(), getPackageName());
                  }
                  if (mode == AppOpsManager.MODE_DEFAULT) {
                      return checkSelfPermission(Manifest.permission.PACKAGE_USAGE_STATS)
                              == PackageManager.PERMISSION_GRANTED;
                  }
                  return mode == AppOpsManager.MODE_ALLOWED;
              }

              private void openBatterySetting() {
                  try {
                      startActivity(new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                              Uri.parse("package:" + getPackageName())));
                  } catch (Exception e) {
                      open(new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS));
                  }
              }

              private void open(Intent i) {
                  try {
                      startActivity(i);
                  } catch (Exception e) {
                      try {
                          startActivity(new Intent(Settings.ACTION_SETTINGS));
                      } catch (Exception ignored) {
                      }
                  }
              }

              private void showBottom(String label, Runnable action) {
                  bottomButton.setText(label);
                  bottomAction = action;
                  bottomButton.setVisibility(View.VISIBLE);
              }

              private void hideBottom() {
                  bottomAction = null;
                  bottomButton.setVisibility(View.GONE);
              }

              private void stopTicker() {
                  if (activeTicker != null) {
                      handler.removeCallbacks(activeTicker);
                      activeTicker = null;
                  }
              }

              private void toast(String s) {
                  Toast.makeText(this, s, Toast.LENGTH_SHORT).show();
              }

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private GradientDrawable round(int color, int radiusDp) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(radiusDp));
                  return g;
              }

              private TextView text(String s, int sp, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(color);
                  if (bold) t.setTypeface(Typeface.DEFAULT_BOLD);
                  return t;
              }

              private void addText(String s, int sp, int color, boolean bold, int bottomPad) {
                  TextView t = text(s, sp, color, bold);
                  t.setPadding(0, 0, 0, bottomPad);
                  content.addView(t);
              }

              private void addActionButton(String label, View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setAllCaps(false);
                  b.setTextSize(15);
                  b.setOnClickListener(l);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  lp.setMargins(0, 0, 0, dp(6));
                  content.addView(b, lp);
              }

              private LinearLayout card(int color) {
                  LinearLayout c = new LinearLayout(this);
                  c.setOrientation(LinearLayout.VERTICAL);
                  c.setPadding(dp(18), dp(16), dp(18), dp(16));
                  c.setBackground(round(color, 16));
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  lp.setMargins(0, dp(4), 0, dp(14));
                  c.setLayoutParams(lp);
                  return c;
              }
          }
