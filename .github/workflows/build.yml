          package com.rakesh.focuslock;

          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageInstaller;

          /** v3.16: PackageInstaller ka jawaab — pakka karne wali screen dikhao ya galti batao. */
          public class UpdateReceiver extends BroadcastReceiver {
              /** MainActivity samne khula hai? */
              static volatile boolean appVisible;

              @Override
              public void onReceive(Context c, Intent intent) {
                  int st = intent.getIntExtra(PackageInstaller.EXTRA_STATUS, -999);
                  if (st == PackageInstaller.STATUS_PENDING_USER_ACTION) {
                      Intent confirm = intent.getParcelableExtra(Intent.EXTRA_INTENT);
                      if (confirm == null) return;
                      confirm.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      boolean shown = false;
                      if (appVisible) {
                          try {
                              c.startActivity(confirm);
                              shown = true;
                          } catch (Exception ignored) {
                          }
                      }
                      if (!shown) {
                          PendingIntent tap = PendingIntent.getActivity(c, 1, confirm,
                                  PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                          Updater.notify(c, L.t(c, "Lagaam का अपडेट तैयार है", "Lagaam update is ready"),
                                  L.t(c, "Install करने के लिए यहाँ दबाएँ", "Tap here to install"), tap);
                      }
                  } else if (st != PackageInstaller.STATUS_SUCCESS) {
                      String m = intent.getStringExtra(PackageInstaller.EXTRA_STATUS_MESSAGE);
                      if (st == PackageInstaller.STATUS_FAILURE_ABORTED) return;   // user ne khud mana kiya
                      Updater.notify(c, L.t(c, "Lagaam अपडेट नहीं हो सका", "Lagaam update failed"),
                              L.t(c, "बाद में फिर कोशिश होगी. ", "Will try again later. ") + (m == null ? "" : m),
                              Updater.launch(c));
                  }
              }
          }
