name: Build Lagaam APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Project files banao
        run: |
          rm -rf FocusLock
          mkdir -p FocusLock
          cat > FocusLock/RELEASE_NOTES.md <<'ENDOFFILE'
          [en]
          - Automatic updates: Lagaam now finds new versions by itself and updates the app
          - Before each update you see what is new, and after the update a short summary
          - Your lock, limits and settings stay safe during the update
          [hi]
          - अपने-आप अपडेट: नया वर्शन आते ही Lagaam खुद ढूँढकर ऐप अपडेट करेगा
          - हर अपडेट से पहले दिखेगा कि क्या नया है, और अपडेट के बाद छोटा सा सार
          - अपडेट के दौरान आपका लॉक, सीमा और सेटिंग सुरक्षित रहेंगे
          ENDOFFILE
          mkdir -p FocusLock/app
          cat > FocusLock/app/build.gradle <<'ENDOFFILE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rakesh.focuslock'
              compileSdk 34

              defaultConfig {
                  applicationId "com.rakesh.focuslock"
                  minSdk 26
                  targetSdk 34
                  versionCode 20
                  versionName "3.16"
              }

              // v3.7: do roop. Lite me Accessibility/Notification service nahi (Play Protect chalu rehte install).
              flavorDimensions.add("edition")
              productFlavors {
                  full {
                      dimension "edition"
                  }
                  lite {
                      dimension "edition"
                  }
              }

              signingConfigs {
                  fixed {
                      storeFile file('focuslock.jks')
                      storePassword 'focuslock123'
                      keyAlias 'focuslock'
                      keyPassword 'focuslock123'
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.fixed
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.fixed
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          ENDOFFILE
          mkdir -p FocusLock/app/src/lite
          cat > FocusLock/app/src/lite/AndroidManifest.xml <<'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <!-- Lite: ye do service hata do, taaki Play Protect chalu rehte install ho -->
              <application>
                  <service
                      android:name="com.rakesh.focuslock.ShortsService"
                      tools:node="remove" />
                  <service
                      android:name="com.rakesh.focuslock.NotifService"
                      tools:node="remove" />
              </application>
          </manifest>
          ENDOFFILE
          mkdir -p FocusLock/app/src/main
          cat > FocusLock/app/src/main/AndroidManifest.xml <<'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS"
                  tools:ignore="ProtectedPermissions" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <!-- v3.16: apne-aap update (GitHub se naya version) -->
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.HOME" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
