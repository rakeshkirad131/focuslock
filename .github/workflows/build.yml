name: Build FocusLock APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Project files banao
        run: |
          rm -rf FocusLock
          mkdir -p FocusLock/app
          cat > FocusLock/app/build.gradle <<'ENDOFFILE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rakesh.focuslock'
              compileSdk 34

              defaultConfig {
                  applicationId "com.rakesh.focuslock"
                  minSdk 26
                  targetSdk 34
                  versionCode 3
                  versionName "2.1"
              }

              signingConfigs {
                  fixed {
                      storeFile file('focuslock.jks')
                      storePassword 'focuslock123'
                      keyAlias 'focuslock'
                      keyPassword 'focuslock123'
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.fixed
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.fixed
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          ENDOFFILE
          mkdir -p FocusLock/app/src/main
          cat > FocusLock/app/src/main/AndroidManifest.xml <<'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS"
                  tools:ignore="ProtectedPermissions" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.HOME" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@android:style/Theme.Material.Light.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".BlockActivity"
                      android:exported="false"
                      android:excludeFromRecents="true"
                      android:launchMode="singleTask"
                      android:taskAffinity="com.rakesh.focuslock.block"
                      android:theme="@android:style/Theme.Material.NoActionBar.Fullscreen" />

                  <service
                      android:name=".BlockService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Self-chosen app blocking timer chosen by the user" />
                  </service>

                  <service
                      android:name=".ShortsService"
                      android:exported="true"
                      android:label="@string/a11y_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>

                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
