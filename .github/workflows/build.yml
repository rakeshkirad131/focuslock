          package com.rakesh.focuslock;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.job.JobInfo;
          import android.app.job.JobScheduler;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageInstaller;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          /**
           * v3.16: Apne-aap update.
           * GitHub ki latest release dekhta hai → naya version mile to APK download karke
           * PackageInstaller se install karta hai. Kya naya hai, release ke notes se dikhata hai.
           */
          public final class Updater {
              private Updater() {}

              static final String REPO = "rakeshkirad131/focuslock";
              static final String API = "https://api.github.com/repos/" + REPO + "/releases/latest";
              static final String CH = "updates";
              static final int JOB_ID = 7716;
              static final int NOTIF_ID = 41;
              static final long CHECK_EVERY = 3L * 60 * 60 * 1000;   // khule ऐप me har 3 ghante

              /** Naye version ki jaankari */
              public static final class Info {
                  public String version;     // "3.16"
                  public String apkUrl;
                  public long size;
                  public String notesEn = "";
                  public String notesHi = "";

                  public String notes(Context c) {
                      String n = L.en(c) ? notesEn : notesHi;
                      if (n == null || n.isEmpty()) n = notesEn.isEmpty() ? notesHi : notesEn;
                      return n;
                  }
              }

              public interface Progress {
                  void onProgress(int percent);

                  void onDone(boolean ok, String msg);
              }

              static SharedPreferences p(Context c) {
                  return c.getSharedPreferences("update", Context.MODE_PRIVATE);
              }

              // ---------- version ----------

              public static String currentVersion(Context c) {
                  try {
                      return c.getPackageManager().getPackageInfo(c.getPackageName(), 0).versionName;
                  } catch (Exception e) {
                      return "0";
                  }
              }

              static long code(PackageInfo pi) {
                  return Build.VERSION.SDK_INT >= 28 ? pi.getLongVersionCode() : pi.versionCode;
              }

              /** "3.16" > "3.15" → 1 */
              public static int compare(String a, String b) {
                  String[] x = a.split("\\."), y = b.split("\\.");
                  for (int i = 0; i < Math.max(x.length, y.length); i++) {
                      int u = i < x.length ? num(x[i]) : 0, v = i < y.length ? num(y[i]) : 0;
                      if (u != v) return u > v ? 1 : -1;
                  }
                  return 0;
              }

              private static int num(String s) {
                  try {
                      return Integer.parseInt(s.replaceAll("[^0-9]", ""));
                  } catch (Exception e) {
                      return 0;
                  }
              }

              public static boolean isNewer(Context c, Info i) {
                  return i != null && i.version != null && i.apkUrl != null
                          && compare(i.version, currentVersion(c)) > 0;
              }

              // ---------- GitHub se jaankari ----------

              /** Network call — background thread par hi chalayen. Na mile to null. */
              public static Info fetch(Context c) {
                  HttpURLConnection con = null;
                  try {
                      con = (HttpURLConnection) new URL(API).openConnection();
                      con.setConnectTimeout(15000);
                      con.setReadTimeout(20000);
                      con.setRequestProperty("Accept", "application/vnd.github+json");
                      con.setRequestProperty("User-Agent", "Lagaam-Android");
                      if (con.getResponseCode() != 200) return null;
                      String body = read(con.getInputStream());
                      JSONObject o = new JSONObject(body);
                      Info i = new Info();
                      String tag = o.optString("tag_name", "");         // v3.16-build14
                      if (tag.startsWith("v")) tag = tag.substring(1);
                      int dash = tag.indexOf('-');
                      i.version = dash > 0 ? tag.substring(0, dash) : tag;
                      String want = Edition.lite(c) ? "FocusLock-Lite.apk" : "FocusLock.apk";
                      JSONArray as = o.optJSONArray("assets");
                      if (as != null) {
                          for (int k = 0; k < as.length(); k++) {
                              JSONObject a = as.getJSONObject(k);
                              if (want.equals(a.optString("name"))) {
                                  i.apkUrl = a.optString("browser_download_url", null);
                                  i.size = a.optLong("size", 0);
                              }
                          }
                      }
                      parseNotes(o.optString("body", ""), i);
                      p(c).edit().putLong("lastCheck", System.currentTimeMillis()).apply();
                      return i;
                  } catch (Exception e) {
                      return null;
                  } finally {
                      if (con != null) con.disconnect();
                  }
              }

              /** Release notes: [en] ... [hi] ... wale hisse alag karo, "- " ko "• " banao. */
              static void parseNotes(String body, Info i) {
                  StringBuilder en = new StringBuilder(), hi = new StringBuilder();
                  StringBuilder cur = en;
                  for (String raw : body.replace("\r", "").split("\n")) {
                      String line = raw.trim();
                      if (line.equalsIgnoreCase("[en]")) {
                          cur = en;
                          continue;
                      }
                      if (line.equalsIgnoreCase("[hi]")) {
                          cur = hi;
                          continue;
                      }
                      if (line.isEmpty() || line.startsWith("#")) continue;
                      if (line.startsWith("- ") || line.startsWith("* ")) line = "• " + line.substring(2).trim();
                      if (cur.length() > 0) cur.append('\n');
                      cur.append(line);
                  }
                  i.notesEn = en.toString();
                  i.notesHi = hi.toString();
              }

              public static boolean dueForCheck(Context c) {
                  return System.currentTimeMillis() - p(c).getLong("lastCheck", 0) > CHECK_EVERY;
              }

              // ---------- install ki anumati ----------

              public static boolean canInstall(Context c) {
                  return Build.VERSION.SDK_INT < 26 || c.getPackageManager().canRequestPackageInstalls();
              }

              /** Lock ke dauraan bhi hamara apna update-screen na roka jaaye (ShortsService dekhta hai). */
              public static boolean installing(Context c) {
                  return System.currentTimeMillis() < p(c).getLong("installUntil", 0);
              }

              // ---------- download + install ----------

              /** Background thread par chalayen. Progress callbacks usi thread par aate hain. */
              public static void downloadAndInstall(Context c, Info info, Progress cb) {
                  Context app = c.getApplicationContext();
                  File f = new File(app.getCacheDir(), "lagaam-update.apk");
                  try {
                      HttpURLConnection con = (HttpURLConnection) new URL(info.apkUrl).openConnection();
                      con.setInstanceFollowRedirects(true);
                      con.setConnectTimeout(15000);
                      con.setReadTimeout(30000);
                      con.setRequestProperty("User-Agent", "Lagaam-Android");
                      int rc = con.getResponseCode();
                      if (rc != 200) {
                          cb.onDone(false, "HTTP " + rc);
                          return;
                      }
                      long total = con.getContentLengthLong();
                      if (total <= 0) total = info.size;
                      try (InputStream in = con.getInputStream(); OutputStream out = new FileOutputStream(f)) {
                          byte[] buf = new byte[64 * 1024];
                          long got = 0;
                          int n, last = -1;
                          while ((n = in.read(buf)) > 0) {
                              out.write(buf, 0, n);
                              got += n;
                              if (total > 0) {
                                  int pc = (int) (got * 100 / total);
                                  if (pc != last) {
                                      last = pc;
                                      cb.onProgress(pc);
                                  }
                              }
                          }
                      } finally {
                          con.disconnect();
                      }

                      // Pakka karo: yahi ऐप hai aur version naya hai
                      PackageInfo nw = app.getPackageManager().getPackageArchiveInfo(f.getPath(), 0);
                      PackageInfo old = app.getPackageManager().getPackageInfo(app.getPackageName(), 0);
                      if (nw == null || !app.getPackageName().equals(nw.packageName) || code(nw) <= code(old)) {
                          f.delete();
                          cb.onDone(false, L.t(app, "डाउनलोड की गई फ़ाइल सही नहीं है", "Downloaded file is not valid"));
                          return;
                      }

                      // "Kya naya hai" — update ke baad dikhane ke liye rakh lo
                      p(app).edit()
                              .putString("pendingVer", info.version)
                              .putString("notesEn", info.notesEn)
                              .putString("notesHi", info.notesHi)
                              .putBoolean("notesShown", false)
                              .putLong("installUntil", System.currentTimeMillis() + 5 * 60 * 1000)
                              .apply();

                      install(app, f);
                      cb.onDone(true, null);
                  } catch (Exception e) {
                      f.delete();
                      cb.onDone(false, e.getClass().getSimpleName());
                  }
              }

              static void install(Context c, File f) throws Exception {
                  PackageInstaller pi = c.getPackageManager().getPackageInstaller();
                  PackageInstaller.SessionParams sp =
                          new PackageInstaller.SessionParams(PackageInstaller.SessionParams.MODE_FULL_INSTALL);
                  sp.setAppPackageName(c.getPackageName());
                  sp.setSize(f.length());
                  if (Build.VERSION.SDK_INT >= 31) {
                      // Android 12+: agar pichhla install isi ऐप ne kiya tha to bina "Install" dabaaye ho jaata hai
                      sp.setRequireUserAction(PackageInstaller.SessionParams.USER_ACTION_NOT_REQUIRED);
                  }
                  int id = pi.createSession(sp);
                  try (PackageInstaller.Session s = pi.openSession(id)) {
                      try (InputStream in = new FileInputStream(f);
                           OutputStream out = s.openWrite("lagaam.apk", 0, f.length())) {
                          byte[] buf = new byte[64 * 1024];
                          int n;
                          while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                          s.fsync(out);
                      }
                      Intent i = new Intent(c, UpdateReceiver.class).setPackage(c.getPackageName());
                      int fl = PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 31 ? PendingIntent.FLAG_MUTABLE : 0);
                      PendingIntent pend = PendingIntent.getBroadcast(c, id, i, fl);
                      s.commit(pend.getIntentSender());
                  }
              }

              // ---------- update ke baad "kya naya hai" ----------

              /** Abhi chal raha version wahi hai jiske notes rakhe the? to notes lautao (ek hi baar). */
              public static String freshNotes(Context c) {
                  SharedPreferences sp = p(c);
                  String v = sp.getString("pendingVer", null);
                  if (v == null || sp.getBoolean("notesShown", true)) return null;
                  if (compare(currentVersion(c), v) < 0) return null;   // abhi install nahi hua
                  String n = L.en(c) ? sp.getString("notesEn", "") : sp.getString("notesHi", "");
                  if (n == null || n.isEmpty()) n = sp.getString("notesEn", "");
                  return n == null ? "" : n;
              }

              public static void markNotesShown(Context c) {
                  p(c).edit().putBoolean("notesShown", true).remove("installUntil").apply();
              }

              /** MY_PACKAGE_REPLACED par: notification "Lagaam update ho gaya" + kya naya hai. */
              public static void onUpdated(Context c) {
                  new File(c.getCacheDir(), "lagaam-update.apk").delete();
                  String n = freshNotes(c);
                  if (n == null) return;
                  String title = L.t(c, "Lagaam v" + currentVersion(c) + " में अपडेट हो गया",
                          "Lagaam updated to v" + currentVersion(c));
                  notify(c, title, n.isEmpty() ? L.t(c, "नया वर्शन तैयार है", "The new version is ready") : n,
                          launch(c));
              }

              // ---------- notification ----------

              static PendingIntent launch(Context c) {
                  Intent i = new Intent(c, MainActivity.class).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  return PendingIntent.getActivity(c, 0, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              }

              static void notify(Context c, String title, String text, PendingIntent tap) {
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;
                  if (Build.VERSION.SDK_INT >= 26 && nm.getNotificationChannel(CH) == null) {
                      nm.createNotificationChannel(new NotificationChannel(CH,
                              L.t(c, "ऐप अपडेट", "App updates"), NotificationManager.IMPORTANCE_DEFAULT));
                  }
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26
                          ? new Notification.Builder(c, CH) : new Notification.Builder(c);
                  b.setSmallIcon(R.drawable.ic_lock_white)
                          .setContentTitle(L.clean(title))
                          .setContentText(L.clean(text))
                          .setStyle(new Notification.BigTextStyle().bigText(L.clean(text)))
                          .setAutoCancel(true);
                  if (tap != null) b.setContentIntent(tap);
                  try {
                      nm.notify(NOTIF_ID, b.build());
                  } catch (Exception ignored) {
                  }
              }

              // ---------- background jaanch (har 6 ghante) ----------

              public static void schedule(Context c) {
                  try {
                      JobScheduler js = (JobScheduler) c.getSystemService(Context.JOB_SCHEDULER_SERVICE);
                      if (js == null || js.getPendingJob(JOB_ID) != null) return;
                      js.schedule(new JobInfo.Builder(JOB_ID, new ComponentName(c, UpdateJob.class))
                              .setRequiredNetworkType(JobInfo.NETWORK_TYPE_ANY)
                              .setPeriodic(6L * 60 * 60 * 1000)
                              .setPersisted(true)
                              .build());
                  } catch (Exception ignored) {
                  }
              }

              /** Background me: naya version mile to khud download + install; anumati na ho to notification. */
              static void backgroundRun(Context c) {
                  Info i = fetch(c);
                  if (!isNewer(c, i)) return;
                  String ver = "v" + i.version;
                  if (!canInstall(c)) {
                      notify(c, L.t(c, "Lagaam " + ver + " आ गया है", "Lagaam " + ver + " is available"),
                              L.t(c, "अपडेट के लिए Lagaam खोलें.\n", "Open Lagaam to update.\n") + i.notes(c), launch(c));
                      return;
                  }
                  downloadAndInstall(c, i, new Progress() {
                      public void onProgress(int percent) {}

                      public void onDone(boolean ok, String msg) {}
                  });
              }

              static String read(InputStream in) throws Exception {
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  byte[] b = new byte[8192];
                  int n;
                  while ((n = in.read(b)) > 0) bo.write(b, 0, n);
                  in.close();
                  return bo.toString("UTF-8");
              }

              static void main(Runnable r) {
                  new Handler(Looper.getMainLooper()).post(r);
              }
          }
