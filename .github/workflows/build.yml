          package com.rakesh.focuslock;

          import android.content.Context;
          import android.content.SharedPreferences;

          import java.text.SimpleDateFormat;
          import java.time.LocalDate;
          import java.util.Calendar;
          import java.util.Date;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;

          /** Saari settings phone me save rehti hain (restart ke baad bhi). */
          public final class Store {

              private Store() {}

              private static SharedPreferences p(Context c) {
                  return c.getSharedPreferences("lock", Context.MODE_PRIVATE);
              }

              // ================= Focus session =================

              /*
               * Samay phone ki ghadi se nahi, "boot ke baad bita samay" (elapsedRealtime) se ginte hain.
               * Isliye phone ki tareekh/samay aage karne se lock jaldi khatam nahi hoga.
               * Restart hone par bacha hua samay wahi se aage chalta hai.
               */
              private static int bootCount(Context c) {
                  try {
                      return android.provider.Settings.Global.getInt(c.getContentResolver(),
                              android.provider.Settings.Global.BOOT_COUNT);
                  } catch (Exception e) {
                      return -1;
                  }
              }

              /** Session me kitne millisecond bache hain (0 = koi session nahi). */
              public static long remaining(Context c) {
                  SharedPreferences sp = p(c);
                  long endEl = sp.getLong("endEl", 0L);
                  if (endEl == 0L) return 0L;
                  long nowEl = android.os.SystemClock.elapsedRealtime();
                  int boot = bootCount(c);
                  boolean rebooted = boot != sp.getInt("boot", -2) || nowEl < sp.getLong("lastEl", 0L);
                  if (rebooted) {
                      long rem = sp.getLong("remain", 0L);
                      endEl = nowEl + rem;
                      sp.edit().putLong("endEl", rem > 0 ? endEl : 0L)
                              .putInt("boot", boot)
                              .putLong("lastEl", nowEl)
                              .commit();
                      return Math.max(0L, rem);
                  }
                  return Math.max(0L, endEl - nowEl);
              }

              /** Service har kuch second me bacha samay save karti hai (restart ke liye). */
              public static void saveRemain(Context c) {
                  long rem = remaining(c);
                  if (rem <= 0) return;
                  p(c).edit().putLong("remain", rem)
                          .putLong("lastEl", android.os.SystemClock.elapsedRealtime())
                          .apply();
              }

              /** Dikhane ke liye: session kab khatam hoga (ghadi ke hisaab se). */
              public static long end(Context c) {
                  long rem = remaining(c);
                  return rem > 0 ? System.currentTimeMillis() + rem : 0L;
              }

              public static boolean active(Context c) {
                  return remaining(c) > 0;
              }

              public static Set<String> pkgs(Context c) {
                  return new HashSet<>(p(c).getStringSet("pkgs", new HashSet<String>()));
              }

              public static Set<String> lastPick(Context c) {
                  Set<String> s = p(c).getStringSet("last", null);
                  return s == null ? null : new HashSet<>(s);
              }

              public static int lastMinutes(Context c) {
                  return p(c).getInt("mins", 60);
              }

              public static void start(Context c, Set<String> pkgs, int minutes) {
                  long ms = minutes * 60_000L;
                  long nowEl = android.os.SystemClock.elapsedRealtime();
                  p(c).edit()
                          .putStringSet("pkgs", new HashSet<>(pkgs))
                          .putStringSet("last", new HashSet<>(pkgs))
                          .putInt("mins", minutes)
                          .putInt("sessionMins", minutes)
                          .putLong("endEl", nowEl + ms)
                          .putLong("remain", ms)
                          .putLong("lastEl", nowEl)
                          .putInt("boot", bootCount(c))
                          .commit();
              }

              /** Session poora hone par: streak aur aaj ke focus minute badhao. */
              public static void completeSession(Context c) {
                  SharedPreferences sp = p(c);
                  long today = LocalDate.now().toEpochDay();
                  int mins = sp.getInt("sessionMins", 0);
                  long lastDay = sp.getLong("streakDay", -10);
                  int streak = sp.getInt("streak", 0);
                  if (lastDay == today) {
                      // aaj pehle hi gina ja chuka
                  } else if (lastDay == today - 1) {
                      streak++;
                  } else {
                      streak = 1;
                  }
                  int focusToday = sp.getLong("focusDay", -1) == today ? sp.getInt("focusMins", 0) : 0;
                  sp.edit()
                          .putLong("endEl", 0L)
                          .putLong("remain", 0L)
                          .putInt("sessionMins", 0)
                          .putLong("streakDay", today)
                          .putInt("streak", streak)
                          .putLong("focusDay", today)
                          .putInt("focusMins", focusToday + mins)
                          .commit();
              }

              public static int streak(Context c) {
                  SharedPreferences sp = p(c);
                  long today = LocalDate.now().toEpochDay();
                  long lastDay = sp.getLong("streakDay", -10);
                  if (lastDay == today || lastDay == today - 1) return sp.getInt("streak", 0);
                  return 0;
              }

              public static int focusToday(Context c) {
                  SharedPreferences sp = p(c);
                  long today = LocalDate.now().toEpochDay();
                  return sp.getLong("focusDay", -1) == today ? sp.getInt("focusMins", 0) : 0;
              }

              // ================= Daily limits =================

              /** pkg -> minute */
              public static Map<String, Integer> limits(Context c) {
                  Map<String, Integer> m = new HashMap<>();
                  for (String s : p(c).getStringSet("limits", new HashSet<String>())) {
                      int i = s.lastIndexOf('|');
                      if (i <= 0) continue;
                      try {
                          m.put(s.substring(0, i), Integer.parseInt(s.substring(i + 1)));
                      } catch (NumberFormatException ignored) {
                      }
                  }
                  return m;
              }

              public static void setLimit(Context c, String pkg, int minutes) {
                  Map<String, Integer> m = limits(c);
                  if (minutes <= 0) m.remove(pkg);
                  else m.put(pkg, minutes);
                  Set<String> out = new HashSet<>();
                  for (Map.Entry<String, Integer> e : m.entrySet()) out.add(e.getKey() + "|" + e.getValue());
                  p(c).edit().putStringSet("limits", out).commit();
              }

              // ================= Schedule =================

              public static boolean schedOn(Context c) {
                  return p(c).getBoolean("schedOn", false);
              }

              public static int schedStart(Context c) {
                  return p(c).getInt("schedStart", 9 * 60);
              }

              public static int schedEnd(Context c) {
                  return p(c).getInt("schedEnd", 17 * 60);
              }

              /** bit (Calendar.DAY_OF_WEEK - 1). Default: Som-Shani. */
              public static int schedDays(Context c) {
                  return p(c).getInt("schedDays", 0b1111110);
              }

              public static Set<String> schedPkgs(Context c) {
                  return new HashSet<>(p(c).getStringSet("schedPkgs", new HashSet<String>()));
              }

              public static void saveSchedule(Context c, boolean on, int start, int end, int days, Set<String> pkgs) {
                  p(c).edit()
                          .putBoolean("schedOn", on)
                          .putInt("schedStart", start)
                          .putInt("schedEnd", end)
                          .putInt("schedDays", days)
                          .putStringSet("schedPkgs", new HashSet<>(pkgs))
                          .commit();
              }

              /** Abhi shedule ka samay chal raha hai? */
              public static boolean schedNow(Context c) {
                  if (!schedOn(c) || schedPkgs(c).isEmpty()) return false;
                  Calendar cal = Calendar.getInstance();
                  int day = cal.get(Calendar.DAY_OF_WEEK) - 1;
                  int m = cal.get(Calendar.HOUR_OF_DAY) * 60 + cal.get(Calendar.MINUTE);
                  int s = schedStart(c), e = schedEnd(c);
                  int days = schedDays(c);
                  if (s == e) return false;
                  if (s < e) {
                      return ((days >> day) & 1) == 1 && m >= s && m < e;
                  }
                  // raat bhar wala (jaise 10 PM - 6 AM)
                  if (m >= s) return ((days >> day) & 1) == 1;
                  int prev = (day + 6) % 7;
                  return m < e && ((days >> prev) & 1) == 1;
              }

              // ================= Shorts / strict =================

              public static boolean blockYtShorts(Context c) {
                  return p(c).getBoolean("ytShorts", true);
              }

              public static boolean blockIgReels(Context c) {
                  return p(c).getBoolean("igReels", true);
              }

              public static boolean blockFbReels(Context c) {
                  return p(c).getBoolean("fbReels", false);
              }

              public static boolean strict(Context c) {
                  return p(c).getBoolean("strict", true);
              }

              public static void setFlag(Context c, String key, boolean v) {
                  p(c).edit().putBoolean(key, v).commit();
              }

              /** Session ya shedule chal raha hai: sakhti wala samay. */
              public static boolean lockedNow(Context c) {
                  return active(c) || schedNow(c);
              }

              /** Background service ki zaroorat hai? */
              public static boolean needsService(Context c) {
                  return active(c) || (schedOn(c) && !schedPkgs(c).isEmpty()) || !limits(c).isEmpty();
              }

              // ================= samay dikhane ke helper =================

              public static String left(long ms) {
                  long m = (ms + 59_999L) / 60_000L;
                  return mins(m);
              }

              public static String mins(long m) {
                  if (m >= 60) {
                      long h = m / 60;
                      long r = m % 60;
                      return r == 0 ? h + " घंटे" : h + " घंटे " + r + " मिनट";
                  }
                  return m + " मिनट";
              }

              public static String clock(long t) {
                  return new SimpleDateFormat("h:mm a", Locale.ENGLISH).format(new Date(t));
              }

              public static String clockMin(int minOfDay) {
                  int h = minOfDay / 60, m = minOfDay % 60;
                  String ap = h < 12 ? "AM" : "PM";
                  int h12 = h % 12 == 0 ? 12 : h % 12;
                  return String.format(Locale.ENGLISH, "%d:%02d %s", h12, m, ap);
              }

              public static String minutesLabel(int m) {
                  if (m < 60) return m + " मिनट";
                  if (m == 60) return "1 घंटा";
                  if (m % 60 == 0) return (m / 60) + " घंटे";
                  return mins(m);
              }
          }
