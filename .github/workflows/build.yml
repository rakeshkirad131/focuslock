              private void choosePauseApps() {
                  final List<App> all = apps();
                  final Set<String> current = Store.pausePkgs(this);
                  final String[] labels = new String[all.size()];
                  final boolean[] checked = new boolean[all.size()];
                  for (int i = 0; i < all.size(); i++) {
                      labels[i] = all.get(i).label;
                      checked[i] = current.contains(all.get(i).pkg);
                  }
                  new AlertDialog.Builder(this)
                          .setTitle(t("रुकिए mode के ऐप", "Apps for pause mode"))
                          .setMultiChoiceItems(labels, checked, (d, which, isChecked) -> checked[which] = isChecked)
                          .setPositiveButton("OK", (d, w) -> {
                              final Set<String> next = new HashSet<>();
                              for (int i = 0; i < all.size(); i++) if (checked[i]) next.add(all.get(i).pkg);
                              boolean removed = false;
                              for (String p : current) if (!next.contains(p)) removed = true;
                              Runnable save = () -> {
                                  Store.setPausePkgs(this, next);
                                  if (!next.isEmpty() && !Store.pauseOn(this)) Store.setFlag(this, "pauseOn", true);
                                  BlockService.ensure(this);
                                  render();
                              };
                              if (removed) requirePin(save);
                              else save.run();
                          })
                          .setNegativeButton(t("रद्द", "Cancel"), null)
                          .show();
              }

