          package com.rakesh.focuslock;

          import android.content.Context;

          /** Bhasha: Hindi ya English. */
          public final class L {
              private L() {}

              public static boolean en(Context c) {
                  return "en".equals(Store.lang(c));
              }

              public static String t(Context c, String hi, String en) {
                  return clean(en(c) ? en : hi);
              }

              /** v3.15: emoji wale chinh hatao (saaf, insaani design). ✓ ✕ ₹ → jaise chinh rehte hain. */
              public static boolean isEmoji(int cp) {
                  if (cp == 0x2713 || cp == 0x2715) return false;           // ✓ ✕
                  return (cp >= 0x1F000 && cp <= 0x1FAFF)
                          || (cp >= 0x2600 && cp <= 0x27BF)
                          || (cp >= 0x2300 && cp <= 0x23FF)
                          || (cp >= 0x2B00 && cp <= 0x2BFF)
                          || (cp >= 0xE0020 && cp <= 0xE007F)
                          || cp == 0xFE0F || cp == 0x20E3 || cp == 0x3030 || cp == 0x303D;
              }

              public static String clean(String s) {
                  if (s == null || s.isEmpty()) return s;
                  StringBuilder sb = new StringBuilder(s.length());
                  int[] cps = s.codePoints().toArray();
                  boolean removed = false;
                  for (int i = 0; i < cps.length; i++) {
                      int cp = cps[i];
                      if (isEmoji(cp)) {
                          removed = true;
                          continue;
                      }
                      if (cp == 0x200D) {
                          boolean prevE = i > 0 && isEmoji(cps[i - 1]);
                          boolean nextE = i + 1 < cps.length && isEmoji(cps[i + 1]);
                          if (prevE || nextE) {
                              removed = true;
                              continue;
                          }
                      }
                      sb.appendCodePoint(cp);
                  }
                  if (!removed) return s;
                  String out = sb.toString().replaceAll("[ \\t]{2,}", " ");
                  out = out.replaceAll("(?m)^[ \\t]+", "").replaceAll("\\( ", "(").replaceAll(" \\)", ")");
                  return out.replaceAll("^\\s+", "");
              }

              public static String mins(Context c, long m) {
                  if (!en(c)) return Store.mins(m);
                  if (m >= 60) {
                      long h = m / 60, r = m % 60;
                      return r == 0 ? h + " hr" : h + " hr " + r + " min";
                  }
                  return m + " min";
              }

              public static String left(Context c, long ms) {
                  return mins(c, (ms + 59_999L) / 60_000L);
              }

              public static String minutesLabel(Context c, int m) {
                  if (!en(c)) return Store.minutesLabel(m);
                  if (m < 60) return m + " min";
                  if (m == 60) return "1 hour";
                  if (m % 60 == 0) return (m / 60) + " hours";
                  return mins(c, m);
              }

              /** Chhota roop, chart ke liye: 45m, 2h, 1h30 */
              public static String shortMins(long m) {
                  if (m < 60) return m + "m";
                  long h = m / 60, r = m % 60;
                  return r == 0 ? h + "h" : h + "h" + r;
              }
          }
