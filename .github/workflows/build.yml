              private void showFor(Intent i) {
                  pkg = i == null ? null : i.getStringExtra("pkg");
                  label = L.t(this, "यह ऐप", "This app");
                  if (pkg != null) {
                      try {
                          PackageManager pm = getPackageManager();
                          label = pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)).toString();
                          appIcon.setImageDrawable(pm.getApplicationIcon(pkg));
                      } catch (Exception ignored) {
                      }
                  }
                  title.setText(L.t(this, label + " खोल रहे हैं", "Opening " + label));
                  openBtn.setText(L.t(this, "फिर भी खोलें (" + Store.pausePassMin(this) + " मिनट)",
                          "Open anyway (" + Store.pausePassMin(this) + " min)"));
                  startCountdown();
              }

              private void startCountdown() {
                  handler.removeCallbacks(tick);
                  left = WAIT_SEC;
                  count.setText(String.valueOf(left));
                  breath.setText(L.t(this, "साँस अंदर लें…", "Breathe in…"));
                  openBtn.setEnabled(false);
                  openBtn.setAlpha(0.35f);
                  handler.postDelayed(tick, 1000);
                  if (!pulse.isStarted()) pulse.start();
              }

              private void closeIt() {
                  Store.countPause(this, true);
                  goHome();
              }

              private void openAnyway() {
                  if (pkg == null) {
                      finish();
                      return;
                  }
                  int task = Store.pauseTask(this);
                  if (task == 1) askMath();
                  else if (task == 2) askSentence();
                  else doOpen();
              }

              // ---------- v3.5: kaam karke hi khule ----------

              private void askMath() {
                  java.util.Random r = new java.util.Random();
                  final int a = 12 + r.nextInt(38), b = 3 + r.nextInt(7), c = 11 + r.nextInt(49);
                  final int answer = a * b + c;
                  final android.widget.EditText et = new android.widget.EditText(this);
                  et.setInputType(android.text.InputType.TYPE_CLASS_NUMBER);
                  et.setHint(L.t(this, "जवाब", "Answer"));
                  new android.app.AlertDialog.Builder(this)
                          .setTitle(L.t(this, "➗ पहले यह हल करें", "➗ Solve this first"))
                          .setMessage(a + " × " + b + " + " + c + " = ?")
                          .setView(boxed(et))
                          .setPositiveButton(L.t(this, "खोलें", "Open"), (d, w) -> {
                              String v = et.getText().toString().trim();
                              if (v.equals(String.valueOf(answer))) doOpen();
                              else wrong();
                          })
                          .setNegativeButton(L.t(this, "रहने दें", "Never mind"), (d, w) -> closeIt())
                          .show();
              }

              private void askSentence() {
                  final String line = L.t(this, "Main yah app soch samajhkar khol raha hu", "I am opening this app on purpose");
                  final android.widget.EditText et = new android.widget.EditText(this);
                  et.setHint(L.t(this, "यहाँ वैसा ही लिखें", "Type it here"));
                  new android.app.AlertDialog.Builder(this)
                          .setTitle(L.t(this, "✍️ यह वाक्य हूबहू लिखें", "✍️ Type this sentence exactly"))
                          .setMessage(line)
                          .setView(boxed(et))
                          .setPositiveButton(L.t(this, "खोलें", "Open"), (d, w) -> {
                              if (norm(et.getText().toString()).equals(norm(line))) doOpen();
                              else wrong();
                          })
                          .setNegativeButton(L.t(this, "रहने दें", "Never mind"), (d, w) -> closeIt())
                          .show();
              }

              private static String norm(String s) {
                  return s.trim().replaceAll("[\\s.,!।]+", " ").trim().toLowerCase(java.util.Locale.ROOT);
              }

              private void wrong() {
                  android.widget.Toast.makeText(this, L.t(this, "❌ सही नहीं है, फिर से 10 सेकंड रुकें",
                          "❌ Not right, wait 10 seconds again"), android.widget.Toast.LENGTH_SHORT).show();
                  startCountdown();
              }

              private View boxed(View v) {
                  android.widget.FrameLayout f = new android.widget.FrameLayout(this);
                  f.setPadding(dp(20), dp(8), dp(20), 0);
                  f.addView(v);
                  return f;
              }

              private void doOpen() {
                  Store.countPause(this, false);
                  Store.grantPass(pkg, Store.pausePassMin(this));
                  try {
                      Intent launch = getPackageManager().getLaunchIntentForPackage(pkg);
                      if (launch != null) {
                          launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(launch);
                      }
                  } catch (Exception ignored) {
                  }
                  finish();
              }

              @Override
              public void onBackPressed() {
                  closeIt();
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacks(tick);
                  if (pulse != null) pulse.cancel();
                  super.onDestroy();
              }

              private void goHome() {
                  Intent i = new Intent(Intent.ACTION_MAIN);
                  i.addCategory(Intent.CATEGORY_HOME);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try {
                      startActivity(i);
                  } catch (Exception ignored) {
                  }
                  finish();
              }
          }
