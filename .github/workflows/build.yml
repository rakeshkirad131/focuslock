                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          ENDOFFILE
          mkdir -p FocusLock/app/src/main/java/com/rakesh/focuslock
          cat > FocusLock/app/src/main/java/com/rakesh/focuslock/AdminReceiver.java <<'ENDOFFILE'
          package com.rakesh.focuslock;

          import android.app.admin.DeviceAdminReceiver;
          import android.app.admin.DevicePolicyManager;
          import android.content.Context;
          import android.content.Intent;

          /**
           * "हटाने से बचाव". Chalu ho to yeh app seedhe uninstall nahi hota,
           * pehle Settings se ise band karna padta hai.
           * v3.10: lock ke dauraan band karne ki koshish par phone home par jaata hai
           * aur screen lock ho jaati hai, taaki lock ke beech app hataya na ja sake.
           */
          public class AdminReceiver extends DeviceAdminReceiver {

              @Override
              public CharSequence onDisableRequested(Context c, Intent intent) {
                  if (Store.lockedNow(c)) {
                      try {
                          Intent home = new Intent(Intent.ACTION_MAIN);
                          home.addCategory(Intent.CATEGORY_HOME);
                          home.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          c.startActivity(home);
                      } catch (Exception ignored) {
                      }
                      try {
                          DevicePolicyManager dpm = (DevicePolicyManager) c.getSystemService(Context.DEVICE_POLICY_SERVICE);
                          dpm.lockNow();   // purane (v3.9) bachav me yeh anumati nahi hoti, to bas chhod do
                      } catch (Exception ignored) {
                      }
                      long rem = Store.remaining(c);
                      return rem > 0
                              ? L.t(c, "🔒 लॉक चल रहा है (" + L.left(c, rem) + " बाकी)। अभी इसे बंद न करें।",
                              "🔒 A lock is running (" + L.left(c, rem) + " left). Don't turn this off now.")
                              : L.t(c, "🔒 शेड्यूल लॉक चल रहा है। अभी इसे बंद न करें।",
                              "🔒 A schedule lock is running. Don't turn this off now.");
                  }
                  return L.t(c, "इसे बंद करने पर Lagaam हटाया जा सकेगा।",
                          "Turning this off lets Lagaam be removed.");
              }
          }
          ENDOFFILE
          mkdir -p FocusLock/app/src/main/java/com/rakesh/focuslock
          cat > FocusLock/app/src/main/java/com/rakesh/focuslock/BarChartView.java <<'ENDOFFILE'
          package com.rakesh.focuslock;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.Typeface;
          import android.view.View;

          /** Hafte ka screen time chart (7 bar). */
          public class BarChartView extends View {

              private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final RectF rect = new RectF();
              private long[] values = new long[0];
              private String[] labels = new String[0];
              private int barColor, highlightColor, textColor, mutedColor;

              public BarChartView(Context c) {
                  super(c);
              }

              public void setColors(int bar, int highlight, int text, int muted) {
                  barColor = bar;
                  highlightColor = highlight;
                  textColor = text;
                  mutedColor = muted;
                  invalidate();
              }

              /** values = minute */
              public void setData(long[] values, String[] labels) {
                  this.values = values;
                  this.labels = labels;
                  invalidate();
              }

              @Override
              protected void onDraw(Canvas canvas) {
                  super.onDraw(canvas);
                  int n = values.length;
                  if (n == 0) return;
                  float w = getWidth(), h = getHeight();
                  float d = getResources().getDisplayMetrics().density;
                  float labelH = 22 * d, valueH = 18 * d;
                  float chartH = h - labelH - valueH;
                  float slot = w / n;
                  float barW = slot * 0.52f;

                  long max = 1;
                  for (long v : values) max = Math.max(max, v);

                  paint.setTextAlign(Paint.Align.CENTER);
                  for (int i = 0; i < n; i++) {
                      float cx = slot * i + slot / 2f;
                      float bh = Math.max(4 * d, chartH * values[i] / (float) max);
                      float top = valueH + (chartH - bh);
                      rect.set(cx - barW / 2f, top, cx + barW / 2f, valueH + chartH);
                      paint.setStyle(Paint.Style.FILL);
                      paint.setColor(i == n - 1 ? highlightColor : barColor);
                      canvas.drawRoundRect(rect, 6 * d, 6 * d, paint);

                      paint.setTypeface(Typeface.DEFAULT_BOLD);
                      paint.setTextSize(10 * d);
                      paint.setColor(textColor);
                      if (values[i] > 0) canvas.drawText(L.shortMins(values[i]), cx, top - 4 * d, paint);

                      paint.setTypeface(Typeface.DEFAULT);
                      paint.setTextSize(12 * d);
                      paint.setColor(i == n - 1 ? textColor : mutedColor);
                      if (i < labels.length) canvas.drawText(labels[i], cx, h - 5 * d, paint);
                  }
              }
          }
          ENDOFFILE
          mkdir -p FocusLock/app/src/main/java/com/rakesh/focuslock
          cat > FocusLock/app/src/main/java/com/rakesh/focuslock/BlockActivity.java <<'ENDOFFILE'
          package com.rakesh.focuslock;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.util.Map;

          /** Band app kholne par yeh screen aati hai. */
          public class BlockActivity extends Activity {

              private ImageView appIcon;
              private TextView title;
              private TextView sub;
              private TextView quote;
              private RingView ring;
              private String pkg;
              private int reason;
              private final Handler handler = new Handler(Looper.getMainLooper());

              private final Runnable updater = new Runnable() {
                  @Override
                  public void run() {
                      update();
                      handler.postDelayed(this, 1000);
                  }
              };

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  Ui ui = Ui.of(this);
                  getWindow().setStatusBarColor(ui.deepTop);
                  getWindow().setNavigationBarColor(ui.deepBottom);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setBackground(new GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM,
                          new int[]{ui.deepTop, ui.deepBottom}));
                  root.setPadding(dp(28), dp(28), dp(28), dp(28));

                  appIcon = new ImageView(this);
                  root.addView(appIcon, new LinearLayout.LayoutParams(dp(64), dp(64)));

                  title = new TextView(this);
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(24);
                  title.setTypeface(Fonts.head(this));
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, dp(14), 0, dp(6));
                  root.addView(title);

                  sub = new TextView(this);
                  sub.setTextColor(ui.deepText);
                  sub.setTextSize(16);
                  sub.setGravity(Gravity.CENTER);
                  root.addView(sub);

                  ring = new RingView(this);
                  ring.setColors(Color.argb(60, 255, 255, 255), ui.dark ? ui.accent : ui.accent2,
                          Color.WHITE, ui.deepText);
                  LinearLayout.LayoutParams rlp = new LinearLayout.LayoutParams(dp(200), dp(200));
                  rlp.setMargins(0, dp(20), 0, dp(8));
                  // v3.12: ring ke peeche saans leti roshni (gehraai ka ehsaas)
                  android.widget.FrameLayout ringBox = new android.widget.FrameLayout(this);
                  android.view.View glow = new android.view.View(this);
                  GradientDrawable gd = new GradientDrawable();
                  gd.setShape(GradientDrawable.OVAL);
                  gd.setGradientType(GradientDrawable.RADIAL_GRADIENT);
                  gd.setGradientRadius(dp(120));
                  gd.setColors(new int[]{Color.argb(70, Color.red(ui.deepText), Color.green(ui.deepText), Color.blue(ui.deepText)),
                          Color.argb(0, 0, 0, 0)});
                  glow.setBackground(gd);
                  ringBox.addView(glow, new android.widget.FrameLayout.LayoutParams(dp(240), dp(240), Gravity.CENTER));
                  ringBox.addView(ring, new android.widget.FrameLayout.LayoutParams(dp(200), dp(200), Gravity.CENTER));
                  Fx.breathe(glow, 3200);
                  root.addView(ringBox, new LinearLayout.LayoutParams(dp(240), dp(240)));

                  quote = new TextView(this);
                  quote.setTextColor(Color.parseColor("#F4F4FA"));
                  quote.setTextSize(17);
                  quote.setTypeface(Typeface.create(Typeface.SERIF, Typeface.ITALIC));
                  quote.setGravity(Gravity.CENTER);
                  quote.setPadding(dp(18), dp(16), dp(18), dp(16));
                  GradientDrawable qbg = new GradientDrawable();
                  qbg.setColor(ui.deepSoft);
                  qbg.setCornerRadius(dp(16));
                  quote.setBackground(qbg);
                  LinearLayout.LayoutParams qlp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  qlp.setMargins(0, dp(16), 0, dp(24));
                  root.addView(quote, qlp);

                  TextView home = new TextView(this);
                  home.setText(L.t(this, "🏠  होम पर जाएँ", "🏠  Go to Home"));
                  home.setTextSize(18);
                  home.setTypeface(Fonts.head(this));
                  home.setTextColor(ui.deepTop);
                  home.setGravity(Gravity.CENTER);
                  home.setBackground(Fx.raised(Color.WHITE, Color.parseColor("#EEF2F1"), Color.argb(110, 0, 0, 0), dp(26), dp(4)));
                  home.setPadding(0, 0, 0, dp(4));
                  Fx.press(home);
                  home.setOnClickListener(v -> goHome());
                  root.addView(home, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, dp(56)));

                  setContentView(root);
                  showFor(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  showFor(intent);
              }

              private void showFor(Intent i) {
                  pkg = i == null ? null : i.getStringExtra("pkg");
                  reason = i == null ? BlockService.REASON_SESSION
                          : i.getIntExtra("reason", BlockService.REASON_SESSION);
                  String label = L.t(this, "यह ऐप", "This app");
                  Drawable icon = null;
                  if (pkg != null) {
                      try {
                          PackageManager pm = getPackageManager();
                          label = pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)).toString();
                          icon = pm.getApplicationIcon(pkg);
                      } catch (Exception ignored) {
                      }
                  }
                  appIcon.setImageDrawable(icon);
                  if (reason == BlockService.REASON_LIMIT) {
                      title.setText(L.t(this, label + " की आज की सीमा पूरी", label + ": today's limit reached"));
                  } else {
                      title.setText(L.t(this, label + " अभी बंद है", label + " is locked now"));
                  }
                  quote.setText(Quotes.format(Quotes.random(this)));
                  update();
              }

              private void update() {
                  if (reason == BlockService.REASON_SESSION) {
                      long left = Store.remaining(this);
                      if (left <= 0) {
                          finish();
                          return;
                      }
                      int total = Math.max(1, Store.sessionMins(this));
                      float prog = 1f - left / (total * 60_000f);
                      ring.setVisibility(android.view.View.VISIBLE);
                      ring.set(prog, L.left(this, left), L.t(this, "बाकी", "left"));
                      sub.setText(L.t(this, "फ़ोकस सत्र · " + Store.clock(Store.end(this)) + " तक",
                              "Focus session · until " + Store.clock(Store.end(this))));
                  } else if (reason == BlockService.REASON_SCHEDULE) {
                      if (!Store.schedNow(this)) {
                          finish();
                          return;
                      }
                      ring.setVisibility(android.view.View.GONE);
                      sub.setText(L.t(this, "📅 शेड्यूल: ", "📅 Schedule: ")
                              + Store.clockMin(Store.schedStart(this)) + " – " + Store.clockMin(Store.schedEnd(this)));
                  } else {
                      Map<String, Integer> lim = Store.limits(this);
                      Integer m = pkg == null ? null : lim.get(pkg);
                      if (m == null) {
                          finish();
                          return;
                      }
                      ring.setVisibility(android.view.View.GONE);
                      sub.setText(L.t(this, "⏳ रोज़ की सीमा: " + L.minutesLabel(this, m) + "\nकल सुबह फिर खुलेगा",
                              "⏳ Daily limit: " + L.minutesLabel(this, m) + "\nOpens again tomorrow"));
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  handler.post(updater);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  handler.removeCallbacks(updater);
              }

              @Override
              public void onBackPressed() {
                  goHome();
              }

              private void goHome() {
                  Intent i = new Intent(Intent.ACTION_MAIN);
                  i.addCategory(Intent.CATEGORY_HOME);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try {
                      startActivity(i);
                  } catch (Exception ignored) {
                  }
                  finish();
              }
          }
          ENDOFFILE
