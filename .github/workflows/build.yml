              private void saveQr() {
                  if (Build.VERSION.SDK_INT < 29) {
                      toast(t("इस फ़ोन में screenshot लेकर सेव करें", "Take a screenshot to save it on this phone"));
                      return;
                  }
                  try {
                      android.graphics.Bitmap bmp = android.graphics.BitmapFactory.decodeResource(getResources(), R.drawable.upi_qr);
                      android.content.ContentValues cv = new android.content.ContentValues();
                      cv.put(android.provider.MediaStore.Images.Media.DISPLAY_NAME, "Lagaam-UPI-QR.png");
                      cv.put(android.provider.MediaStore.Images.Media.MIME_TYPE, "image/png");
                      cv.put(android.provider.MediaStore.Images.Media.RELATIVE_PATH, "Pictures/Lagaam");
                      Uri uri = getContentResolver().insert(android.provider.MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cv);
                      if (uri == null) throw new Exception();
                      try (java.io.OutputStream os = getContentResolver().openOutputStream(uri)) {
                          bmp.compress(android.graphics.Bitmap.CompressFormat.PNG, 100, os);
                      }
                      toast(t("✅ गैलरी में सेव हो गया (Pictures/Lagaam)", "✅ Saved to gallery (Pictures/Lagaam)"));
                  } catch (Exception e) {
                      toast(t("सेव नहीं हुआ, screenshot ले लें", "Couldn't save, take a screenshot"));
                  }
              }

