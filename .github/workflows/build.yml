              private boolean adminActive() {
                  android.app.admin.DevicePolicyManager dpm =
                          (android.app.admin.DevicePolicyManager) getSystemService(DEVICE_POLICY_SERVICE);
                  return dpm != null && dpm.isAdminActive(new ComponentName(this, AdminReceiver.class));
              }

              private void askAdmin(String why) {
                  Intent i = new Intent(android.app.admin.DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN);
                  i.putExtra(android.app.admin.DevicePolicyManager.EXTRA_DEVICE_ADMIN, new ComponentName(this, AdminReceiver.class));
                  i.putExtra(android.app.admin.DevicePolicyManager.EXTRA_ADD_EXPLANATION, why);
                  open(i);
              }

              private void renderUninstallCard() {
                  LinearLayout c = card();
                  c.addView(text(t("🛡️ हटाने से बचाव", "🛡️ Uninstall protection"), 17, ui.text, true));
                  final android.app.admin.DevicePolicyManager dpm =
                          (android.app.admin.DevicePolicyManager) getSystemService(DEVICE_POLICY_SERVICE);
                  final ComponentName admin = new ComponentName(this, AdminReceiver.class);
                  boolean on = dpm != null && dpm.isAdminActive(admin);
                  c.addView(text(on ? t("चालू ✅", "On ✅") : t("बंद ❌", "Off ❌"), 15, on ? ui.accent : ui.danger, true));
                  if (on && !dpm.hasGrantedPolicy(admin, android.app.admin.DeviceAdminInfo.USES_POLICY_FORCE_LOCK)) {
                      // v3.9 me chalu kiya tha: nayi "screen lock" anumati ke liye ek baar dobara
                      LinearLayout up = softCard(ui.warnSoft);
                      up.addView(text(t("⚠️ एक बार दोबारा चालू करें (नई सुरक्षा के लिए)। यहाँ टैप करें।",
                              "⚠️ Turn it on once more (for the new protection). Tap here."), 13, ui.warn, true));
                      up.setOnClickListener(v -> askAdmin(t("लॉक के दौरान Lagaam हटाया न जा सके।",
                              "So Lagaam can't be removed during a lock.")));
                      c.addView(up);
                  }
                  c.addView(text(t("चालू होने पर ऐप सीधे uninstall नहीं होगा। लॉक के दौरान इसे बंद करने की कोशिश पर फ़ोन home पर चला जाएगा और screen lock हो जाएगी। लॉक के दौरान यह बंद भी नहीं होगा।",
                          "When on, the app can't be uninstalled directly. Trying to turn it off during a lock sends the phone home and locks the screen. It can't be turned off during a lock."),
                          13, ui.muted, false));
                  TextView b = pill(on ? t("बचाव बंद करें", "Turn off protection") : t("🛡️ बचाव चालू करें", "🛡️ Turn on protection"), !on);
                  b.setOnClickListener(v -> {
                      if (on) {
                          if (Store.lockedNow(this)) {
                              toast(t("लॉक के दौरान बचाव बंद नहीं होगा 🔒", "Protection can't be turned off during a lock 🔒"));
                              return;
                          }
                          requirePin(() -> {
                              dpm.removeActiveAdmin(admin);
                              toast(t("बचाव बंद", "Protection off"));
                              handler.postDelayed(this::render, 600);
                          });
                      } else {
                          Intent i = new Intent(android.app.admin.DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN);
                          i.putExtra(android.app.admin.DevicePolicyManager.EXTRA_DEVICE_ADMIN, admin);
                          i.putExtra(android.app.admin.DevicePolicyManager.EXTRA_ADD_EXPLANATION,
                                  t("इससे Lagaam बिना अनुमति हटाया नहीं जा सकेगा। यह कोई जानकारी नहीं पढ़ता।",
                                          "This stops Lagaam from being removed without permission. It reads no data."));
                          open(i);
                      }
                  });
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  lp.setMargins(0, dp(8), 0, 0);
                  c.addView(b, lp);
                  content.addView(c);
              }

