name: Build FocusLock APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Project files banao
        run: |
          rm -rf FocusLock
          mkdir -p FocusLock/app
          cat > FocusLock/app/build.gradle <<'ENDOFFILE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rakesh.focuslock'
              compileSdk 34

              defaultConfig {
                  applicationId "com.rakesh.focuslock"
                  minSdk 26
                  targetSdk 34
                  versionCode 12
                  versionName "3.8"
              }

              // v3.7: do roop. Lite me Accessibility/Notification service nahi (Play Protect chalu rehte install).
              flavorDimensions.add("edition")
              productFlavors {
                  full {
                      dimension "edition"
                  }
                  lite {
                      dimension "edition"
                  }
              }

              signingConfigs {
                  fixed {
                      storeFile file('focuslock.jks')
                      storePassword 'focuslock123'
                      keyAlias 'focuslock'
                      keyPassword 'focuslock123'
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.fixed
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.fixed
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          ENDOFFILE
          mkdir -p FocusLock/app/src/lite
          cat > FocusLock/app/src/lite/AndroidManifest.xml <<'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <!-- Lite: ye do service hata do, taaki Play Protect chalu rehte install ho -->
              <application>
                  <service
                      android:name="com.rakesh.focuslock.ShortsService"
                      tools:node="remove" />
                  <service
                      android:name="com.rakesh.focuslock.NotifService"
                      tools:node="remove" />
              </application>
          </manifest>
          ENDOFFILE
          mkdir -p FocusLock/app/src/main
          cat > FocusLock/app/src/main/AndroidManifest.xml <<'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS"
                  tools:ignore="ProtectedPermissions" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.HOME" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@android:style/Theme.Material.Light.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".BlockActivity"
                      android:exported="false"
                      android:excludeFromRecents="true"
                      android:launchMode="singleTask"
                      android:taskAffinity="com.rakesh.focuslock.block"
                      android:theme="@android:style/Theme.Material.NoActionBar.Fullscreen" />

                  <activity
                      android:name=".PauseActivity"
                      android:exported="false"
                      android:excludeFromRecents="true"
                      android:launchMode="singleTask"
                      android:taskAffinity="com.rakesh.focuslock.pause"
                      android:theme="@android:style/Theme.Material.NoActionBar.Fullscreen" />

                  <service
                      android:name=".BlockService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Self-chosen app blocking timer chosen by the user" />
                  </service>

                  <service
                      android:name=".ShortsService"
                      android:exported="true"
                      android:label="@string/a11y_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>

                  <service
                      android:name=".NotifService"
                      android:exported="true"
                      android:label="@string/notif_name"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>

                  <receiver
                      android:name=".FocusWidget"
                      android:exported="true"
                      android:label="@string/widget_name">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_info" />
                  </receiver>

                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          ENDOFFILE
          mkdir -p FocusLock/app/src/main/java/com/rakesh/focuslock
          cat > FocusLock/app/src/main/java/com/rakesh/focuslock/BarChartView.java <<'ENDOFFILE'
          package com.rakesh.focuslock;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.Typeface;
          import android.view.View;

          /** Hafte ka screen time chart (7 bar). */
          public class BarChartView extends View {

              private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final RectF rect = new RectF();
              private long[] values = new long[0];
              private String[] labels = new String[0];
              private int barColor, highlightColor, textColor, mutedColor;

              public BarChartView(Context c) {
                  super(c);
              }

              public void setColors(int bar, int highlight, int text, int muted) {
                  barColor = bar;
                  highlightColor = highlight;
                  textColor = text;
                  mutedColor = muted;
                  invalidate();
              }

              /** values = minute */
              public void setData(long[] values, String[] labels) {
                  this.values = values;
                  this.labels = labels;
                  invalidate();
              }

              @Override
              protected void onDraw(Canvas canvas) {
                  super.onDraw(canvas);
                  int n = values.length;
                  if (n == 0) return;
                  float w = getWidth(), h = getHeight();
                  float d = getResources().getDisplayMetrics().density;
                  float labelH = 22 * d, valueH = 18 * d;
                  float chartH = h - labelH - valueH;
                  float slot = w / n;
                  float barW = slot * 0.52f;

                  long max = 1;
                  for (long v : values) max = Math.max(max, v);

                  paint.setTextAlign(Paint.Align.CENTER);
                  for (int i = 0; i < n; i++) {
                      float cx = slot * i + slot / 2f;
                      float bh = Math.max(4 * d, chartH * values[i] / (float) max);
                      float top = valueH + (chartH - bh);
                      rect.set(cx - barW / 2f, top, cx + barW / 2f, valueH + chartH);
                      paint.setStyle(Paint.Style.FILL);
                      paint.setColor(i == n - 1 ? highlightColor : barColor);
                      canvas.drawRoundRect(rect, 6 * d, 6 * d, paint);

                      paint.setTypeface(Typeface.DEFAULT_BOLD);
                      paint.setTextSize(10 * d);
                      paint.setColor(textColor);
                      if (values[i] > 0) canvas.drawText(L.shortMins(values[i]), cx, top - 4 * d, paint);

                      paint.setTypeface(Typeface.DEFAULT);
                      paint.setTextSize(12 * d);
                      paint.setColor(i == n - 1 ? textColor : mutedColor);
                      if (i < labels.length) canvas.drawText(labels[i], cx, h - 5 * d, paint);
                  }
              }
          }
          ENDOFFILE
          mkdir -p FocusLock/app/src/main/java/com/rakesh/focuslock
          cat > FocusLock/app/src/main/java/com/rakesh/focuslock/BlockActivity.java <<'ENDOFFILE'
          package com.rakesh.focuslock;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.util.Map;

          /** Band app kholne par yeh screen aati hai. */
          public class BlockActivity extends Activity {

              private ImageView appIcon;
              private TextView title;
              private TextView sub;
              private TextView quote;
              private RingView ring;
              private String pkg;
              private int reason;
              private final Handler handler = new Handler(Looper.getMainLooper());

              private final Runnable updater = new Runnable() {
                  @Override
                  public void run() {
                      update();
                      handler.postDelayed(this, 1000);
                  }
              };

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  Ui ui = Ui.of(this);
                  getWindow().setStatusBarColor(ui.deepTop);
                  getWindow().setNavigationBarColor(ui.deepBottom);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setBackground(new GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM,
                          new int[]{ui.deepTop, ui.deepBottom}));
                  root.setPadding(dp(28), dp(28), dp(28), dp(28));

                  appIcon = new ImageView(this);
                  root.addView(appIcon, new LinearLayout.LayoutParams(dp(64), dp(64)));

                  title = new TextView(this);
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(24);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, dp(14), 0, dp(6));
                  root.addView(title);

                  sub = new TextView(this);
                  sub.setTextColor(ui.deepText);
                  sub.setTextSize(16);
                  sub.setGravity(Gravity.CENTER);
                  root.addView(sub);

                  ring = new RingView(this);
                  ring.setColors(Color.argb(60, 255, 255, 255), ui.dark ? ui.accent : ui.accent2,
                          Color.WHITE, ui.deepText);
                  LinearLayout.LayoutParams rlp = new LinearLayout.LayoutParams(dp(200), dp(200));
                  rlp.setMargins(0, dp(20), 0, dp(8));
                  root.addView(ring, rlp);

                  quote = new TextView(this);
                  quote.setTextColor(Color.parseColor("#F4F4FA"));
                  quote.setTextSize(17);
                  quote.setTypeface(Typeface.create(Typeface.SERIF, Typeface.ITALIC));
                  quote.setGravity(Gravity.CENTER);
                  quote.setPadding(dp(18), dp(16), dp(18), dp(16));
                  GradientDrawable qbg = new GradientDrawable();
                  qbg.setColor(ui.deepSoft);
                  qbg.setCornerRadius(dp(16));
                  quote.setBackground(qbg);
                  LinearLayout.LayoutParams qlp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  qlp.setMargins(0, dp(16), 0, dp(24));
                  root.addView(quote, qlp);

                  TextView home = new TextView(this);
                  home.setText(L.t(this, "🏠  होम पर जाएँ", "🏠  Go to Home"));
                  home.setTextSize(18);
                  home.setTypeface(Typeface.DEFAULT_BOLD);
                  home.setTextColor(ui.deepTop);
                  home.setGravity(Gravity.CENTER);
                  GradientDrawable hbg = new GradientDrawable();
                  hbg.setColor(Color.WHITE);
                  hbg.setCornerRadius(dp(28));
                  home.setBackground(hbg);
                  home.setOnClickListener(v -> goHome());
                  root.addView(home, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, dp(56)));

                  setContentView(root);
                  showFor(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  showFor(intent);
              }

              private void showFor(Intent i) {
                  pkg = i == null ? null : i.getStringExtra("pkg");
                  reason = i == null ? BlockService.REASON_SESSION
                          : i.getIntExtra("reason", BlockService.REASON_SESSION);
                  String label = L.t(this, "यह ऐप", "This app");
                  Drawable icon = null;
                  if (pkg != null) {
                      try {
                          PackageManager pm = getPackageManager();
                          label = pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)).toString();
                          icon = pm.getApplicationIcon(pkg);
                      } catch (Exception ignored) {
                      }
                  }
                  appIcon.setImageDrawable(icon);
                  if (reason == BlockService.REASON_LIMIT) {
                      title.setText(L.t(this, label + " की आज की सीमा पूरी", label + ": today's limit reached"));
                  } else {
                      title.setText(L.t(this, label + " अभी बंद है", label + " is locked now"));
                  }
                  quote.setText(Quotes.format(Quotes.random(this)));
                  update();
              }

              private void update() {
                  if (reason == BlockService.REASON_SESSION) {
                      long left = Store.remaining(this);
                      if (left <= 0) {
                          finish();
                          return;
                      }
                      int total = Math.max(1, Store.sessionMins(this));
                      float prog = 1f - left / (total * 60_000f);
                      ring.setVisibility(android.view.View.VISIBLE);
                      ring.set(prog, L.left(this, left), L.t(this, "बाकी", "left"));
                      sub.setText(L.t(this, "फ़ोकस सत्र · " + Store.clock(Store.end(this)) + " तक",
                              "Focus session · until " + Store.clock(Store.end(this))));
                  } else if (reason == BlockService.REASON_SCHEDULE) {
                      if (!Store.schedNow(this)) {
                          finish();
                          return;
                      }
                      ring.setVisibility(android.view.View.GONE);
                      sub.setText(L.t(this, "📅 शेड्यूल: ", "📅 Schedule: ")
                              + Store.clockMin(Store.schedStart(this)) + " – " + Store.clockMin(Store.schedEnd(this)));
                  } else {
                      Map<String, Integer> lim = Store.limits(this);
                      Integer m = pkg == null ? null : lim.get(pkg);
                      if (m == null) {
                          finish();
                          return;
                      }
                      ring.setVisibility(android.view.View.GONE);
                      sub.setText(L.t(this, "⏳ रोज़ की सीमा: " + L.minutesLabel(this, m) + "\nकल सुबह फिर खुलेगा",
                              "⏳ Daily limit: " + L.minutesLabel(this, m) + "\nOpens again tomorrow"));
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  handler.post(updater);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  handler.removeCallbacks(updater);
              }

              @Override
              public void onBackPressed() {
                  goHome();
              }

              private void goHome() {
                  Intent i = new Intent(Intent.ACTION_MAIN);
                  i.addCategory(Intent.CATEGORY_HOME);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try {
                      startActivity(i);
                  } catch (Exception ignored) {
                  }
                  finish();
              }
          }
          ENDOFFILE
          mkdir -p FocusLock/app/src/main/java/com/rakesh/focuslock
          cat > FocusLock/app/src/main/java/com/rakesh/focuslock/BlockService.java <<'ENDOFFILE'
          package com.rakesh.focuslock;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.app.usage.UsageEvents;
          import android.app.usage.UsageStatsManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;

          import java.util.HashMap;
          import java.util.Map;
          import java.util.Set;

          /**
           * Background me chalta hai: har 0.7 second dekhta hai ki saamne kaunsa app khula hai.
           * 3 niyam: focus session, shedule, aur roz ki seema.
           */
          public class BlockService extends Service {

              public static final int REASON_SESSION = 1;
              public static final int REASON_SCHEDULE = 2;
              public static final int REASON_LIMIT = 3;
              public static final int REASON_PAUSE = 4;

              private static final String CHANNEL = "focus_lock";
              private static final int NOTIF_ID = 7;

              private Handler handler;
              private String currentFg;
              private long lastLaunch;
              private String lastNotifText = "";

              // settings cache (har 5 sec taaza)
              private long settingsAt;
              private boolean sessionWas;
              private boolean lockedWas;
              private long end;
              private Set<String> sessionPkgs;
              private Set<String> schedPkgs;
              private boolean schedNow;
              private Map<String, Integer> limits = new HashMap<>();
              private boolean pauseOn;
              private Set<String> pausePkgs;
              private String lockedNames = "";

              // usage cache (har 15 sec taaza)
              private long usageAt;
              private Map<String, Long> usage = new HashMap<>();

              private final Runnable tick = new Runnable() {
                  @Override
                  public void run() {
                      check();
                      if (handler != null) handler.postDelayed(this, 700);
                  }
              };

              /** Zaroorat ho to service chalao, nahi to band karo. */
              public static void ensure(Context c) {
                  Intent i = new Intent(c, BlockService.class);
                  try {
                      if (Store.needsService(c)) c.startForegroundService(i);
                      else c.stopService(i);
                  } catch (Exception ignored) {
                  }
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  settingsAt = 0;
                  usageAt = 0;
                  loadSettings(System.currentTimeMillis());
                  lockedWas = Store.lockedNow(this);
                  Notification n = buildNotification(notifText());
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                  } else {
                      startForeground(NOTIF_ID, n);
                  }

                  if (!Store.needsService(this)) {
                      shutdown();
                      return START_NOT_STICKY;
                  }
                  if (handler == null) {
                      handler = new Handler(Looper.getMainLooper());
                      handler.post(tick);
                  }
                  return START_STICKY;
              }

              private void loadSettings(long now) {
                  settingsAt = now;
                  Store.saveRemain(this);
                  end = Store.end(this);
                  sessionPkgs = Store.pkgs(this);
                  schedPkgs = Store.schedPkgs(this);
                  schedNow = Store.schedNow(this);
                  limits = Store.limitsLive(this);
                  pauseOn = Store.pauseLive(this);
                  pausePkgs = Store.pausePkgs(this);
                  lockedNames = names(Store.remaining(this) > 0 ? sessionPkgs : schedNow ? schedPkgs : null);
              }

              /** Notification ke liye: pehle 3 band apps ke naam */
              private String names(Set<String> pkgs) {
                  if (pkgs == null || pkgs.isEmpty()) return "";
                  StringBuilder sb = new StringBuilder();
                  int n = 0;
                  for (String p : pkgs) {
                      if (n == 3) break;
                      String label = p;
                      try {
                          label = getPackageManager().getApplicationLabel(getPackageManager().getApplicationInfo(p, 0)).toString();
                      } catch (Exception ignored) {
                      }
                      if (n > 0) sb.append(", ");
                      sb.append(label);
                      n++;
                  }
                  if (pkgs.size() > 3) sb.append(" +").append(pkgs.size() - 3);
                  return sb.toString();
              }

              private String notifText() {
                  long rem = Store.remaining(this);
                  String apps = lockedNames.isEmpty() ? "" : L.t(this, " · बंद: ", " · Locked: ") + lockedNames;
                  if (rem > 0) return L.t(this, "फ़ोकस सत्र: " + L.left(this, rem) + " बाकी",
                          "Focus session: " + L.left(this, rem) + " left") + apps;
                  if (schedNow) {
                      int pi = Math.max(0, Store.activeProfile(this));
                      return Store.profileName(this, pi) + L.t(this, " चालू, " + Store.clockMin(Store.schedEnd(this, pi)) + " तक",
                              " on until " + Store.clockMin(Store.schedEnd(this, pi))) + apps;
                  }
                  return L.t(this, "सीमा और शेड्यूल पर नज़र रखी जा रही है", "Watching limits and schedule");
              }

              private Notification buildNotification(String text) {
                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  NotificationChannel ch = new NotificationChannel(CHANNEL, "फ़ोकस लॉक",
                          NotificationManager.IMPORTANCE_LOW);
                  nm.createNotificationChannel(ch);
                  PendingIntent pi = PendingIntent.getActivity(this, 0,
                          new Intent(this, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
                  lastNotifText = text;
                  return new Notification.Builder(this, CHANNEL)
                          .setSmallIcon(R.drawable.ic_lock_white)
                          .setContentTitle(L.t(this, "🔒 फ़ोकस लॉक", "🔒 FocusLock"))
                          .setContentText(text)
                          .setStyle(new Notification.BigTextStyle().bigText(text))
                          .setOngoing(true)
                          .setContentIntent(pi)
                          .build();
              }

              private void check() {
                  long now = System.currentTimeMillis();

                  // focus session: ghadi badalne se asar nahi (bacha samay elapsedRealtime se)
                  long rem = Store.remaining(this);
                  boolean sessionOn = rem > 0;
                  if (sessionWas && !sessionOn) {
                      Store.completeSession(this);
                      settingsAt = 0;
                  }
                  sessionWas = sessionOn;

                  if (now - settingsAt > 5000) {
                      loadSettings(now);
                      // v3.5: lock khatam hua -> roki gayi notifications ka saransh + widget taaza
                      boolean locked = sessionOn || schedNow;
                      if (lockedWas && !locked) NotifService.showSummary(this);
                      lockedWas = locked;
                      FocusWidget.updateAll(this);
                      if (!Store.needsService(this)) {
                          shutdown();
                          return;
                      }
                      String t = notifText();
                      if (!t.equals(lastNotifText)) {
                          NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                          nm.notify(NOTIF_ID, buildNotification(t));
                      }
                  }

                  String fg = foregroundApp(now);
                  if (fg != null) currentFg = fg;
                  if (currentFg == null || currentFg.equals(getPackageName())) return;

                  int reason = 0;
                  if (sessionOn && sessionPkgs.contains(currentFg)) {
                      reason = REASON_SESSION;
                  } else if (schedNow && schedPkgs.contains(currentFg)) {
                      reason = REASON_SCHEDULE;
                  } else if (limits.containsKey(currentFg)) {
                      if (now - usageAt > 15000) {
                          usage = Usage.today(this);
                          usageAt = now;
                      }
                      Long used = usage.get(currentFg);
                      long ms = (used == null ? 0 : used) + (now - usageAt);
                      if (ms >= limits.get(currentFg) * 60_000L) reason = REASON_LIMIT;
                  }

                  if (reason == 0 && pauseOn && pausePkgs.contains(currentFg) && !Store.hasPass(currentFg)) {
                      reason = REASON_PAUSE;
                  }

                  if (reason != 0 && now - lastLaunch > 1500) {
                      lastLaunch = now;
                      Intent i = new Intent(this, reason == REASON_PAUSE ? PauseActivity.class : BlockActivity.class);
                      i.putExtra("pkg", currentFg);
                      i.putExtra("reason", reason);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_NO_ANIMATION);
                      try {
                          startActivity(i);
                      } catch (Exception ignored) {
                      }
                  }
              }

              /** Pichhle 1 minute ke events me se aakhri "saamne aaya" app. */
              private String foregroundApp(long now) {
                  try {
                      UsageStatsManager usm = (UsageStatsManager) getSystemService(USAGE_STATS_SERVICE);
                      UsageEvents events = usm.queryEvents(now - 60_000L, now);
                      UsageEvents.Event e = new UsageEvents.Event();
                      String last = null;
                      while (events.hasNextEvent()) {
                          events.getNextEvent(e);
                          if (e.getEventType() == UsageEvents.Event.MOVE_TO_FOREGROUND) {
                              last = e.getPackageName();
                          }
                      }
                      return last;
                  } catch (Exception ex) {
                      return null;
                  }
              }

              private void shutdown() {
                  if (handler != null) {
                      handler.removeCallbacks(tick);
                      handler = null;
                  }
                  stopForeground(true);
                  stopSelf();
              }

              @Override
              public void onDestroy() {
                  if (handler != null) {
                      handler.removeCallbacks(tick);
                      handler = null;
                  }
                  super.onDestroy();
              }
          }
