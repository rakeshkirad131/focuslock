                          : miniStat("🌱", t("नई शुरुआत", "Fresh start"), t("आज एक फ़ोकस करें", "Do one focus today") + bestTxt, ui.warnSoft, ui.warn);
                  LinearLayout b = miniStat("⏱️", L.mins(this, Store.focusToday(this)), t("आज फ़ोकस", "Focus today"), ui.accentSoft, ui.accent);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                  lp.setMargins(0, 0, dp(6), 0);
                  row.addView(a, lp);
                  LinearLayout.LayoutParams lp2 = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                  lp2.setMargins(dp(6), 0, 0, 0);
                  row.addView(b, lp2);
                  LinearLayout.LayoutParams rl = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  rl.setMargins(0, 0, 0, dp(12));
                  content.addView(row, rl);
              }

