              private void payUpi(int rs, String plan, String dev) {
                  try {
                      Uri u = new Uri.Builder().scheme("upi").authority("pay")
                              .appendQueryParameter("pa", Pro.UPI_ID)
                              .appendQueryParameter("pn", Pro.UPI_NAME)
                              .appendQueryParameter("am", rs + ".00")
                              .appendQueryParameter("cu", "INR")
                              .appendQueryParameter("tn", "FocusLock Pro " + dev)
                              .build();
                      startActivity(Intent.createChooser(new Intent(Intent.ACTION_VIEW, u), t("UPI ऐप चुनें", "Choose UPI app")));
                  } catch (Exception e) {
                      copyText(Pro.UPI_ID);
                      toast(t("UPI ऐप नहीं मिला। UPI ID कॉपी हो गई: ", "No UPI app found. UPI ID copied: ") + Pro.UPI_ID);
                  }
              }

              private void openWhatsApp(String msg) {
                  try {
