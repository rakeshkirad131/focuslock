          package com.rakesh.focuslock;

          import android.content.Context;
          import android.content.SharedPreferences;

          import java.time.DayOfWeek;
          import java.time.LocalDate;
          import java.time.format.DateTimeFormatter;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;

          /**
           * Khud se mukabla: har din ke ank.
           * Ank = fokus minute (1 ank/minute)
           *     + pichhle 7 din ke ausat se jitne minute kam phone chalaya, uska aadha
           *     + lagataar har din 5 ank (zyada se zyada 150)
           * Saara data sirf phone me ("history" prefs).
           */
          public final class Score {
              private Score() {}

              /** Ek din ka hisaab. */
              public static class Day {
                  public long day;      // epochDay
                  public int focus;     // minute
                  public int screen;    // minute (-1 = pata nahi)
                  public int streak;    // us din ki streak
                  public int pFocus, pLess, pStreak;

                  public int points() {
                      return pFocus + pLess + pStreak;
                  }
              }

              private static SharedPreferences h(Context c) {
                  return c.getSharedPreferences("history", Context.MODE_PRIVATE);
              }

              private static int[] read(Context c, long day) {
                  String v = h(c).getString("d" + day, null);
                  int[] out = {0, -1, 0};
                  if (v == null) return out;
                  String[] p = v.split("\\|");
                  try {
                      out[0] = Integer.parseInt(p[0]);
                      out[1] = Integer.parseInt(p[1]);
                      out[2] = Integer.parseInt(p[2]);
                  } catch (Exception ignored) {
                  }
                  return out;
              }

              private static void write(Context c, long day, int[] v) {
                  h(c).edit().putString("d" + day, v[0] + "|" + v[1] + "|" + v[2]).apply();
              }

              /** Fokus satra poora hone par (Store.completeSession se). */
              public static void addFocus(Context c, long day, int mins, int streak) {
                  int[] v = read(c, day);
                  v[0] += Math.max(0, mins);
                  v[2] = Math.max(v[2], streak);
                  write(c, day, v);
              }

              /** Us din ka screen time (minute). */
              public static void setScreen(Context c, long day, int mins) {
                  int[] v = read(c, day);
                  v[1] = mins;
                  write(c, day, v);
              }

              /** Saare din, ank ke saath (purana -> naya). */
              public static List<Day> all(Context c) {
                  List<Long> keys = new ArrayList<>();
                  for (String k : h(c).getAll().keySet()) {
                      if (!k.startsWith("d")) continue;
                      try {
                          keys.add(Long.parseLong(k.substring(1)));
                      } catch (NumberFormatException ignored) {
                      }
                  }
                  Collections.sort(keys);
                  Map<Long, int[]> raw = new HashMap<>();
                  for (long k : keys) raw.put(k, read(c, k));

                  List<Day> out = new ArrayList<>();
                  for (long k : keys) {
                      int[] v = raw.get(k);
                      Day d = new Day();
                      d.day = k;
                      d.focus = v[0];
                      d.screen = v[1];
                      d.streak = v[2];
                      d.pFocus = d.focus;
                      d.pStreak = Math.min(d.streak, 30) * 5;
                      // pichhle 7 din ka ausat screen time
                      int n = 0;
                      long sum = 0;
                      for (long p = k - 7; p < k; p++) {
                          int[] pv = raw.get(p);
                          if (pv != null && pv[1] > 0) {
                              sum += pv[1];
                              n++;
                          }
                      }
                      if (n > 0 && d.screen >= 0) {
                          double avg = (double) sum / n;
                          d.pLess = (int) Math.max(0, (avg - d.screen) / 2);
                      }
                      out.add(d);
                  }
                  return out;
              }

              public static Day find(List<Day> days, long day) {
                  for (Day d : days) if (d.day == day) return d;
                  return null;
              }

              /** Ank ke hisaab se kram (sabse zyada pehle). */
              public static List<Day> ranked(List<Day> days) {
                  List<Day> r = new ArrayList<>(days);
                  Collections.sort(r, (a, b) -> {
                      int c = Integer.compare(b.points(), a.points());
                      return c != 0 ? c : Long.compare(b.day, a.day);
                  });
                  return r;
              }

              /** Hafte (Somvaar se) -> kul ank. [weekStartDay, points] */
              public static List<long[]> weeks(List<Day> days) {
                  Map<Long, Long> m = new HashMap<>();
                  for (Day d : days) {
                      LocalDate ld = LocalDate.ofEpochDay(d.day);
                      long start = ld.with(DayOfWeek.MONDAY).toEpochDay();
                      Long old = m.get(start);
                      m.put(start, (old == null ? 0 : old) + d.points());
                  }
                  List<long[]> out = new ArrayList<>();
                  for (Map.Entry<Long, Long> e : m.entrySet()) out.add(new long[]{e.getKey(), e.getValue()});
                  Collections.sort(out, (a, b) -> Long.compare(b[1], a[1]));
                  return out;
              }

              public static String date(Context c, long day) {
                  Locale loc = L.en(c) ? Locale.ENGLISH : new Locale("hi", "IN");
                  return LocalDate.ofEpochDay(day).format(DateTimeFormatter.ofPattern("d MMM", loc));
              }

              public static String weekRange(Context c, long start) {
                  return date(c, start) + " – " + date(c, start + 6);
              }
          }
