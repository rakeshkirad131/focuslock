              private void renderBatteryGuide() {
                  String m = (Build.MANUFACTURER == null ? "" : Build.MANUFACTURER).toLowerCase(Locale.ROOT);
                  String brand;
                  String hi;
                  String en;
                  if (m.contains("xiaomi") || m.contains("redmi") || m.contains("poco")) {
                      brand = "Xiaomi / Redmi / POCO";
                      hi = "1. Settings → Apps → फ़ोकस लॉक → Autostart ON\n2. Battery saver → No restrictions\n3. Recent apps में फ़ोकस लॉक को नीचे खींचकर 🔒 lock करें";
                      en = "1. Settings → Apps → फ़ोकस लॉक → Autostart ON\n2. Battery saver → No restrictions\n3. In Recent apps, pull फ़ोकस लॉक down and tap 🔒";
                  } else if (m.contains("vivo") || m.contains("iqoo")) {
                      brand = "Vivo / iQOO";
                      hi = "1. Settings → Battery → Background power consumption → फ़ोकस लॉक → Allow\n2. i Manager → App manager → Autostart → फ़ोकस लॉक ON\n3. Ultra power saving mode बंद रखें";
                      en = "1. Settings → Battery → Background power consumption → फ़ोकस लॉक → Allow\n2. i Manager → App manager → Autostart → फ़ोकस लॉक ON\n3. Keep Ultra power saving off";
