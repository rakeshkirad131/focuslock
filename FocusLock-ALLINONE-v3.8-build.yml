              /** looseWhenOn: true = ON karna dheel dena hai (jaise "sirf lock ke samay"). */
              private View guardSwitch(String label, boolean value, final String key, final boolean looseWhenOn) {
                  Switch s = new Switch(this);
                  s.setText(label + "  ");
                  s.setTextSize(15);
                  s.setChecked(value);
                  s.setPadding(0, dp(10), 0, dp(10));
                  styleSwitch(s);
                  s.setOnCheckedChangeListener((btn, checked) -> {
                      if (Boolean.TRUE.equals(btn.getTag())) return;
                      boolean loosen = checked == looseWhenOn;
                      if (!loosen) {
                          Store.setFlag(this, key, checked);
                          if (checked && "strict".equals(key) && !a11yEnabled()) {
                              toast(t("ब्लॉक सेवा भी चालू करें", "Also turn on the block service"));
                          }
                          return;
                      }
                      setSilently(btn, !checked);
                      if (Store.lockedNow(this)) {
                          toast(t("लॉक के दौरान इसे बदल नहीं सकते", "Can't change this during a lock"));
                          return;
                      }
                      requirePin(() -> {
                          Store.setFlag(this, key, checked);
                          render();
                      });
                  });
                  return s;
              }

              private void setSilently(CompoundButton b, boolean v) {
                  b.setTag(Boolean.TRUE);
                  b.setChecked(v);
                  b.setTag(null);
              }

              private void askSite() {
                  final EditText et = new EditText(this);
                  et.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_URI);
                  et.setHint("example.com");
                  new AlertDialog.Builder(this)
                          .setTitle(t("वेबसाइट जोड़ें", "Add website"))
                          .setView(padded(et))
                          .setPositiveButton("OK", (d, w) -> {
                              String s = et.getText().toString().trim().toLowerCase(Locale.ROOT);
                              int sch = s.indexOf("://");
                              if (sch >= 0) s = s.substring(sch + 3);
                              if (s.startsWith("www.")) s = s.substring(4);
                              int slash = s.indexOf('/');
                              if (slash >= 0) s = s.substring(0, slash);
                              if (!s.contains(".") || s.contains(" ")) {
                                  toast(t("सही वेबसाइट लिखें, जैसे example.com", "Enter a valid site like example.com"));
                                  return;
                              }
                              Set<String> all = Store.sites(this);
                              all.add(s);
                              Store.setSites(this, all);
                              render();
                          })
                          .setNegativeButton(t("रद्द", "Cancel"), null)
                          .show();
              }

              // ================= PIN =================

              private void requirePin(final Runnable ok) {
                  if (!Store.hasPin(this)) {
                      ok.run();
                      return;
                  }
                  final EditText et = new EditText(this);
                  et.setInputType(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_VARIATION_PASSWORD);
                  et.setHint("PIN");
                  new AlertDialog.Builder(this)
                          .setTitle(t("🔑 PIN डालें", "🔑 Enter PIN"))
                          .setView(padded(et))
                          .setPositiveButton("OK", (d, w) -> {
                              if (Store.checkPin(this, et.getText().toString())) ok.run();
                              else toast(t("गलत PIN", "Wrong PIN"));
                          })
                          .setNegativeButton(t("रद्द", "Cancel"), null)
                          .show();
              }

              private void askNewPin() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  final EditText p1 = new EditText(this);
                  p1.setInputType(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_VARIATION_PASSWORD);
                  p1.setHint(t("नया PIN (4 से 8 अंक)", "New PIN (4 to 8 digits)"));
                  final EditText p2 = new EditText(this);
                  p2.setInputType(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_VARIATION_PASSWORD);
                  p2.setHint(t("दोबारा लिखें", "Repeat PIN"));
                  box.addView(p1);
                  box.addView(p2);
                  new AlertDialog.Builder(this)
                          .setTitle(t("🔑 PIN लगाएँ", "🔑 Set PIN"))
                          .setView(padded(box))
                          .setPositiveButton("OK", (d, w) -> {
                              String a = p1.getText().toString(), b = p2.getText().toString();
                              if (a.length() < 4 || a.length() > 8) {
                                  toast(t("PIN 4 से 8 अंक का हो", "PIN must be 4 to 8 digits"));
                              } else if (!a.equals(b)) {
                                  toast(t("दोनों PIN एक जैसे नहीं", "PINs don't match"));
                              } else {
                                  Store.setPin(this, a);
                                  toast(t("✅ PIN लग गया", "✅ PIN set"));
