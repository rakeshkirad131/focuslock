              /** v3.8: do rang ka tircha gradient */
              private GradientDrawable grad(int a, int b, int radiusDp) {
                  GradientDrawable g = new GradientDrawable(GradientDrawable.Orientation.TL_BR, new int[]{a, b});
                  g.setCornerRadius(dp(radiusDp));
                  return g;
              }

              /** v3.8: rang + mahin kinara */
              private GradientDrawable outlined(int color, int stroke, int radiusDp) {
                  GradientDrawable g = round(color, radiusDp);
