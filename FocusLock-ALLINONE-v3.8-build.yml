          /**
           * v3.5: Home screen widget.
           * Lock chal raha ho to "kab tak" dikhata hai, warna ek tap me 25 minute ka fokus
           * (tap karne par ऐप khulta hai aur pakka karne ka sawaal poochta hai).
           */
          public class FocusWidget extends AppWidgetProvider {

              private static String lastKey = "";

              @Override
              public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
                  lastKey = "";
                  updateAll(c);
              }

              /** Sab widget taaza karo (sirf tab jab dikhane wala text badla ho). */
              public static void updateAll(Context c) {
                  try {
                      AppWidgetManager m = AppWidgetManager.getInstance(c);
                      int[] ids = m.getAppWidgetIds(new ComponentName(c, FocusWidget.class));
                      if (ids == null || ids.length == 0) return;

                      String status;
                      String btn;
                      boolean quick;
                      long rem = Store.remaining(c);
                      if (rem > 0) {
                          status = L.t(c, "🔒 " + Store.clock(Store.end(c)) + " तक लॉक",
                                  "🔒 Locked until " + Store.clock(Store.end(c)));
                          btn = L.t(c, Store.pkgs(c).size() + " ऐप बंद हैं", Store.pkgs(c).size() + " apps locked");
                          quick = false;
                      } else if (Store.schedNow(c)) {
                          int pi = Math.max(0, Store.activeProfile(c));
                          status = Store.profileName(c, pi) + L.t(c, " · " + Store.clockMin(Store.schedEnd(c, pi)) + " तक",
                                  " · until " + Store.clockMin(Store.schedEnd(c, pi)));
                          btn = L.t(c, "शेड्यूल चालू है", "Schedule is on");
                          quick = false;
                      } else {
                          int streak = Store.streak(c);
                          status = L.t(c, "आज फ़ोकस: " + L.minutesLabel(c, Store.focusToday(c)),
                                  "Focus today: " + L.minutesLabel(c, Store.focusToday(c)))
                                  + (streak > 0 ? "  🔥" + streak : "");
                          btn = L.t(c, "🍅 25 मिनट फ़ोकस", "🍅 25 min focus");
                          quick = true;
                      }
                      String key = status + "|" + btn + "|" + Store.lang(c);
                      if (key.equals(lastKey)) return;
                      lastKey = key;

                      RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.widget_focus);
                      v.setTextViewText(R.id.w_title, L.t(c, "🔒 फ़ोकस लॉक", "🔒 FocusLock"));
                      v.setTextViewText(R.id.w_status, status);
                      v.setTextViewText(R.id.w_btn, btn);

                      Intent open = new Intent(c, MainActivity.class);
                      open.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      v.setOnClickPendingIntent(R.id.w_root, PendingIntent.getActivity(c, 10, open,
                              PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT));

                      Intent q = new Intent(c, MainActivity.class);
                      q.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      if (quick) q.putExtra("quick", 25);
                      v.setOnClickPendingIntent(R.id.w_btn, PendingIntent.getActivity(c, quick ? 11 : 12, q,
                              PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT));

                      m.updateAppWidget(ids, v);
                  } catch (Exception ignored) {
                  }
              }
          }
