          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;

          import java.util.Map;
          import java.util.Set;

          /**
           * v3.5: Lock ke dauraan band apps ki notifications rokta hai (sirf ginti rakhta hai,
           * likha hua kuch save nahi karta). Lock khatam hone par ek saransh dikhata hai.
           */
          public class NotifService extends NotificationListenerService {

              private static final String CHANNEL = "focus_held";
              private static final int SUMMARY_ID = 21;

              private long lockedAt;
              private Set<String> locked = new java.util.HashSet<>();

              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  try {
                      if (sbn == null || !Store.notifHold(this) || !Pro.has(this)) return;
                      String pkg = sbn.getPackageName();
                      if (pkg == null || pkg.equals(getPackageName())) return;
                      long now = System.currentTimeMillis();
                      if (now - lockedAt > 5000) {
                          locked = Store.lockedPkgs(this);
                          lockedAt = now;
                      }
                      if (!locked.contains(pkg)) return;
                      Notification n = sbn.getNotification();
                      // chalte hue kaam (music, download) aur group ka saransh na gino
                      if (sbn.isOngoing()) return;
                      boolean summary = n != null && (n.flags & Notification.FLAG_GROUP_SUMMARY) != 0;
                      cancelNotification(sbn.getKey());
                      if (!summary) Store.countHeld(this, pkg);
                  } catch (Exception ignored) {
                  }
              }

              /** Lock khatam: kitni notifications roki gayin, ek notification me batao. */
              public static void showSummary(Context c) {
                  Map<String, Integer> held = Store.takeHeld(c);
                  if (held.isEmpty()) return;
                  int total = 0;
                  StringBuilder sb = new StringBuilder();
                  PackageManager pm = c.getPackageManager();
                  for (Map.Entry<String, Integer> e : held.entrySet()) {
                      total += e.getValue();
                      String label = e.getKey();
                      try {
                          label = pm.getApplicationLabel(pm.getApplicationInfo(e.getKey(), 0)).toString();
                      } catch (Exception ignored) {
                      }
                      if (sb.length() > 0) sb.append(", ");
                      sb.append(label).append(" ").append(e.getValue());
                  }
                  try {
                      NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                      nm.createNotificationChannel(new NotificationChannel(CHANNEL,
                              L.t(c, "रोकी गई सूचनाएँ", "Held notifications"), NotificationManager.IMPORTANCE_DEFAULT));
                      PendingIntent pi = PendingIntent.getActivity(c, 3,
                              new Intent(c, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
                      String title = L.t(c, "🔕 लॉक के दौरान " + total + " सूचनाएँ रोकीं",
                              "🔕 " + total + " notifications held during the lock");
                      String body = sb + L.t(c, "\nअब ऐप खोलकर देख सकते हैं।", "\nOpen the apps to see them.");
                      nm.notify(SUMMARY_ID, new Notification.Builder(c, CHANNEL)
                              .setSmallIcon(R.drawable.ic_lock_white)
                              .setContentTitle(title)
                              .setContentText(sb.toString())
                              .setStyle(new Notification.BigTextStyle().bigText(body))
                              .setContentIntent(pi)
                              .setAutoCancel(true)
                              .build());
                  } catch (Exception ignored) {
                  }
              }

              /** Kya notification access di gayi hai? */
              public static boolean enabled(Context c) {
                  String s = android.provider.Settings.Secure.getString(c.getContentResolver(), "enabled_notification_listeners");
                  if (s == null) return false;
                  android.content.ComponentName me = new android.content.ComponentName(c, NotifService.class);
                  for (String part : s.split(":")) {
                      if (part.equalsIgnoreCase(me.flattenToString()) || part.equalsIgnoreCase(me.flattenToShortString())) return true;
                  }
                  return false;
              }
          }
