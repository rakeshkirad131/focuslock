                      } else if (YT.equals(pkg) && Store.blockYtShorts(this)) {
                          if (hasAny(YT_IDS)) back(L.t(this, "YouTube Shorts बंद हैं 🚫", "YouTube Shorts are blocked 🚫"));
                      } else if ((IG.equals(pkg) || IG_LITE.equals(pkg)) && Store.blockIgReels(this)) {
                          if (hasAny(IG_IDS) || reelsOnScreen()) back(L.t(this, "Instagram Reels बंद हैं 🚫", "Instagram Reels are blocked 🚫"));
                      } else if ((FB.equals(pkg) || FB_LITE.equals(pkg)) && Store.blockFbReels(this)) {
                          if (hasAny(FB_IDS) || reelsOnScreen()) back(L.t(this, "Facebook Reels बंद हैं 🚫", "Facebook Reels are blocked 🚫"));
                      } else if (isStore(pkg) && Store.playLock(this) && Store.lockedNow(this)) {
                          lastAction = now;
                          performGlobalAction(GLOBAL_ACTION_HOME);
                          toast(L.t(this, "🔒 लॉक के दौरान Play Store / नए ऐप install बंद हैं",
                                  "🔒 Play Store and new installs are locked right now"));
                      } else if (isSettings(pkg) && Store.strict(this) && Store.lockedNow(this)) {
                          if (mentionsMe()) {
                              lastAction = now;
                              performGlobalAction(GLOBAL_ACTION_HOME);
                              toast(L.t(this, "सख़्त मोड: लॉक के दौरान यह सेटिंग नहीं खुलेगी 🔒",
                                      "Strict mode: this setting is locked right now 🔒"));
                          }
                      }
                  } catch (Exception ignored) {
                  }
              }

              private String urlBarId(String pkg) {
                  for (String[] b : BROWSERS) if (b[0].equals(pkg)) return b[1];
                  return null;
              }

              private void checkBrowser(String urlBarId) {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return;
                  List<AccessibilityNodeInfo> bars = root.findAccessibilityNodeInfosByViewId(urlBarId);
                  if (bars == null || bars.isEmpty()) return;
                  AccessibilityNodeInfo bar = bars.get(0);
                  if (bar == null || bar.isFocused() || bar.getText() == null) return; // user abhi type kar raha hai
                  String url = bar.getText().toString().toLowerCase(Locale.ROOT);

                  if (Store.blockYtShorts(this) && url.contains("youtube.com/shorts")) {
                      back(L.t(this, "YouTube Shorts बंद हैं 🚫", "YouTube Shorts are blocked 🚫"));
                      return;
                  }
                  if (Store.blockIgReels(this) && url.contains("instagram.com/reel")) {
                      back(L.t(this, "Instagram Reels बंद हैं 🚫", "Instagram Reels are blocked 🚫"));
                      return;
                  }
                  if (Store.blockFbReels(this) && url.contains("facebook.com/reel")) {
                      back(L.t(this, "Facebook Reels बंद हैं 🚫", "Facebook Reels are blocked 🚫"));
                      return;
                  }
                  // sirf domain dekho (google search me "youtube.com" likhne par na roke)
                  String host = url;
                  int sch = host.indexOf("://");
                  if (sch >= 0) host = host.substring(sch + 3);
                  int slash = host.indexOf('/');
                  if (slash >= 0) host = host.substring(0, slash);
                  int colon = host.indexOf(':');
                  if (colon >= 0) host = host.substring(0, colon);

                  // v3.5: jo app band hai, uski website bhi band
                  if (Store.appWeb(this)) {
                      long now = System.currentTimeMillis();
                      if (now - lockedAt > 5000) {
                          lockedCache = Store.lockedPkgs(this);
                          lockedAt = now;
                      }
                      if (!lockedCache.isEmpty()) {
                          for (String[] row : APP_SITES) {
                              if (!lockedCache.contains(row[0])) continue;
                              for (int i = 1; i < row.length; i++) {
                                  String site = row[i];
                                  if (host.equals(site) || host.endsWith("." + site)) {
                                      back(L.t(this, "🔒 " + site + " भी लॉक है (ऐप बंद है)",
                                              "🔒 " + site + " is locked too (the app is locked)"));
                                      return;
                                  }
                              }
                          }
                      }
                  }

                  if (Store.webActive(this)) {
                      for (String site : Store.sites(this)) {
                          if (site.isEmpty()) continue;
                          if (host.equals(site) || host.endsWith("." + site)) {
                              back(L.t(this, "🌐 " + site + " बंद है", "🌐 " + site + " is blocked"));
                              return;
                          }
                      }
                  }
              }

              private boolean isStore(String pkg) {
                  for (String s : STORE_PKGS) if (s.equals(pkg)) return true;
                  return false;
              }

              private boolean isSettings(String pkg) {
                  for (String s : SETTINGS_PKGS) if (s.equals(pkg)) return true;
                  return false;
              }

              private boolean hasAny(String[] ids) {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return false;
                  for (String id : ids) {
                      List<AccessibilityNodeInfo> found = root.findAccessibilityNodeInfosByViewId(id);
                      if (found != null) {
                          for (AccessibilityNodeInfo n : found) {
                              if (n != null && n.isVisibleToUser()) return true;
                          }
                      }
                  }
                  return false;
              }

              /**
               * Reels screen khula hai? Do pehchaan:
               * 1) "Reels" tab chuna hua hai (neeche ya upar ki patti me), ya
               * 2) screen ke sabse upar "Reels" likha hai (Reels dekhte samay title).
               * Sirf poora shabd milaate hain, taaki kisi post ke andar likha "reel" na pakda jaaye.
               */
              private boolean reelsOnScreen() {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return false;
                  int screenH = getResources().getDisplayMetrics().heightPixels;
                  android.graphics.Rect r = new android.graphics.Rect();
                  for (String w : REEL_WORDS) {
                      List<AccessibilityNodeInfo> list = root.findAccessibilityNodeInfosByText(w);
                      if (list == null) continue;
                      for (AccessibilityNodeInfo n : list) {
                          if (n == null || !n.isVisibleToUser()) continue;
                          CharSequence tx = n.getText();
                          CharSequence cd = n.getContentDescription();
                          String text = tx == null ? "" : tx.toString().trim();
                          String desc = cd == null ? "" : cd.toString().trim();
                          boolean exact = text.equalsIgnoreCase(w) || desc.equalsIgnoreCase(w);
                          boolean tabLike = desc.toLowerCase(Locale.ROOT).startsWith(w.toLowerCase(Locale.ROOT) + ",");
                          if (!exact && !tabLike) continue;
                          // chuna hua tab (khud ya uska parent)
                          if (n.isSelected()) return true;
                          AccessibilityNodeInfo parent = n.getParent();
                          if (parent != null && parent.isSelected()) return true;
                          // upar likha title (tab nahi)
                          if (exact && !tabLike) {
                              n.getBoundsInScreen(r);
                              if (r.top >= 0 && r.top < screenH * 0.16 && r.height() < screenH * 0.1) return true;
                          }
                      }
                  }
                  return false;
              }

              private boolean mentionsMe() {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return false;
                  String name = getString(R.string.app_name);
                  List<AccessibilityNodeInfo> a = root.findAccessibilityNodeInfosByText(name);
                  if (a != null && !a.isEmpty()) return true;
                  List<AccessibilityNodeInfo> b = root.findAccessibilityNodeInfosByText("FocusLock");
                  return b != null && !b.isEmpty();
              }

              private void back(String msg) {
                  lastAction = System.currentTimeMillis();
                  performGlobalAction(GLOBAL_ACTION_BACK);
                  toast(msg);
              }

              private void toast(String msg) {
                  try {
                      Toast.makeText(this, msg, Toast.LENGTH_SHORT).show();
                  } catch (Exception ignored) {
                  }
              }

              @Override
              public void onInterrupt() {
              }
          }
