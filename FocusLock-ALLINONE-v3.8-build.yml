              private void renderStats() {
                  Map<String, Long> usage = Usage.today(this);
                  long total = 0;
                  for (long v : usage.values()) total += v;

                  LinearLayout top = card();
                  top.addView(text(t("आज का स्क्रीन टाइम", "Screen time today"), 14, ui.muted, false));
                  top.addView(text(L.mins(this, total / 60_000L), 32, ui.text, true));
                  content.addView(top);

                  long[] week = Usage.week(this);
                  String[] labels = new String[7];
                  Calendar cal = Calendar.getInstance();
                  cal.add(Calendar.DAY_OF_YEAR, -6);
                  for (int i = 0; i < 7; i++) {
                      int d = cal.get(Calendar.DAY_OF_WEEK) - 1;
                      labels[i] = L.en(this) ? DAYS_EN[d] : DAYS_HI[d];
                      cal.add(Calendar.DAY_OF_YEAR, 1);
                  }
                  long sum = 0;
                  for (long v : week) sum += v;
                  LinearLayout wk = card();
                  wk.addView(text(t("📈 पिछले 7 दिन", "📈 Last 7 days"), 16, ui.text, true));
                  wk.addView(text(t("रोज़ औसत: ", "Daily average: ") + L.mins(this, sum / 7), 13, ui.muted, false));
                  BarChartView chart = new BarChartView(this);
                  chart.setColors(ui.accentSoft, ui.accent, ui.text, ui.muted);
                  chart.setData(week, labels);
                  LinearLayout.LayoutParams clp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, dp(180));
                  clp.setMargins(0, dp(12), 0, 0);
                  wk.addView(chart, clp);
                  content.addView(wk);

                  renderStatsRow();

                  // 🏆 khud se mukabla: pichhle 7 din ka screen time history me daalo
                  long todayDay = java.time.LocalDate.now().toEpochDay();
                  for (int i = 0; i < 7; i++) {
                      long d = todayDay - 6 + i;
                      if (week[i] > 0 || d == todayDay) Score.setScreen(this, d, (int) week[i]);
                  }
                  if (Pro.has(this)) renderLeaderboard(todayDay);
                  else proGate(t("🏆 खुद से मुकाबला + 🎖️ Badges", "🏆 Beat your best + 🎖️ Badges"));

