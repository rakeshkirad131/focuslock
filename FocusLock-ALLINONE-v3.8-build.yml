          package com.rakesh.focuslock;

          import android.content.Context;

          /** Bhasha: Hindi ya English. */
          public final class L {
              private L() {}

              public static boolean en(Context c) {
                  return "en".equals(Store.lang(c));
              }

              public static String t(Context c, String hi, String en) {
                  return en(c) ? en : hi;
              }

              public static String mins(Context c, long m) {
                  if (!en(c)) return Store.mins(m);
                  if (m >= 60) {
                      long h = m / 60, r = m % 60;
                      return r == 0 ? h + " hr" : h + " hr " + r + " min";
                  }
                  return m + " min";
              }

              public static String left(Context c, long ms) {
                  return mins(c, (ms + 59_999L) / 60_000L);
              }

              public static String minutesLabel(Context c, int m) {
                  if (!en(c)) return Store.minutesLabel(m);
                  if (m < 60) return m + " min";
                  if (m == 60) return "1 hour";
                  if (m % 60 == 0) return (m / 60) + " hours";
                  return mins(c, m);
              }

              /** Chhota roop, chart ke liye: 45m, 2h, 1h30 */
              public static String shortMins(long m) {
                  if (m < 60) return m + "m";
                  long h = m / 60, r = m % 60;
                  return r == 0 ? h + "h" : h + "h" + r;
              }
          }
