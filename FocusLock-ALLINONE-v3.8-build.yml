          package com.rakesh.focuslock;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.Typeface;
          import android.view.View;

          /** Gol progress ring, beech me bacha samay. */
          public class RingView extends View {

              private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final RectF rect = new RectF();
              private float progress;
              private String big = "";
              private String small = "";
              private int trackColor, ringColor, textColor, mutedColor;

              public RingView(Context c) {
                  super(c);
              }

              public void setColors(int track, int ring, int text, int muted) {
                  trackColor = track;
                  ringColor = ring;
                  textColor = text;
                  mutedColor = muted;
                  invalidate();
              }

              public void set(float progress, String big, String small) {
                  this.progress = Math.max(0f, Math.min(1f, progress));
                  this.big = big == null ? "" : big;
                  this.small = small == null ? "" : small;
                  invalidate();
              }

              @Override
              protected void onDraw(Canvas canvas) {
                  super.onDraw(canvas);
                  float w = getWidth(), h = getHeight();
                  float size = Math.min(w, h);
                  float stroke = size * 0.075f;
                  float cx = w / 2f, cy = h / 2f;
                  float r = size / 2f - stroke;
                  rect.set(cx - r, cy - r, cx + r, cy + r);

                  paint.setStyle(Paint.Style.STROKE);
                  paint.setStrokeWidth(stroke);
                  paint.setStrokeCap(Paint.Cap.ROUND);
                  paint.setColor(trackColor);
                  canvas.drawArc(rect, 0, 360, false, paint);
                  paint.setColor(ringColor);
                  canvas.drawArc(rect, -90, 360f * progress, false, paint);

                  paint.setStyle(Paint.Style.FILL);
                  paint.setTextAlign(Paint.Align.CENTER);
                  paint.setTypeface(Typeface.DEFAULT_BOLD);
                  paint.setColor(textColor);
                  paint.setTextSize(size * 0.15f);
                  canvas.drawText(big, cx, cy + size * 0.03f, paint);

                  paint.setTypeface(Typeface.DEFAULT);
                  paint.setColor(mutedColor);
                  paint.setTextSize(size * 0.065f);
                  canvas.drawText(small, cx, cy + size * 0.15f, paint);
              }
          }
