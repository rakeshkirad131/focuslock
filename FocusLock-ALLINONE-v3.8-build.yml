              private GradientDrawable round(int color, int radiusDp) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(radiusDp));
                  return g;
              }

              private TextView text(String s, int sp, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(color);
                  if (bold) t.setTypeface(Typeface.DEFAULT_BOLD);
                  return t;
              }

              private View gap(int h) {
                  View v = new View(this);
                  v.setLayoutParams(new LinearLayout.LayoutParams(1, dp(h)));
                  return v;
              }

              private TextView pill(String label, boolean selected) {
                  TextView p = text(label, 14, selected ? ui.onAccent : ui.accent, true);
                  p.setGravity(Gravity.CENTER);
                  p.setSingleLine(true);
                  p.setPadding(dp(14), dp(9), dp(14), dp(9));
                  p.setBackground(selected ? grad(ui.accent, ui.accent2, 20) : outlined(ui.accentSoft, ui.accentSoft, 20));
                  return p;
              }

              private void addFlow(LinearLayout parent, List<View> items, int perRow) {
                  LinearLayout row = null;
                  for (int i = 0; i < items.size(); i++) {
                      if (i % perRow == 0) {
                          row = new LinearLayout(this);
                          row.setOrientation(LinearLayout.HORIZONTAL);
                          LinearLayout.LayoutParams rl = new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                          rl.setMargins(0, 0, 0, dp(8));
                          parent.addView(row, rl);
                      }
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                      lp.setMargins(dp(3), 0, dp(3), 0);
                      row.addView(items.get(i), lp);
                  }
                  // aakhri line ko barabar rakhne ke liye khali jagah
                  int extra = (perRow - items.size() % perRow) % perRow;
                  for (int i = 0; i < extra && row != null; i++) {
                      View v = new View(this);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, 1, 1f);
                      lp.setMargins(dp(3), 0, dp(3), 0);
                      row.addView(v, lp);
                  }
              }

              private View progressBar(float frac, int color) {
                  LinearLayout bar = new LinearLayout(this);
                  bar.setOrientation(LinearLayout.HORIZONTAL);
                  bar.setBackground(round(ui.line, 4));
                  View fill = new View(this);
                  fill.setBackground(round(color, 4));
                  float f = Math.max(0.02f, Math.min(1f, frac));
                  bar.addView(fill, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, f));
                  bar.addView(new View(this), new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT,
                          Math.max(0.0001f, 1f - f)));
                  return bar;
              }

              private void styleSwitch(Switch s) {
                  s.setTextColor(ui.text);
                  int[][] states = {{android.R.attr.state_checked}, {}};
                  s.setThumbTintList(new ColorStateList(states, new int[]{ui.accent, ui.dark ? Color.GRAY : Color.WHITE}));
                  s.setTrackTintList(new ColorStateList(states, new int[]{ui.accent, ui.muted}));
              }

              private View padded(View v) {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(22), dp(8), dp(22), 0);
                  box.addView(v);
                  return box;
              }

              private LinearLayout card() {
                  LinearLayout c = new LinearLayout(this);
                  c.setOrientation(LinearLayout.VERTICAL);
                  c.setPadding(dp(18), dp(18), dp(18), dp(18));
                  c.setBackground(outlined(ui.card, ui.line, 22));
                  if (!ui.dark) c.setElevation(dp(1));
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  lp.setMargins(dp(2), dp(2), dp(2), dp(12));
                  c.setLayoutParams(lp);
                  return c;
              }

              private LinearLayout softCard(int color) {
                  LinearLayout c = card();
                  c.setBackground(round(color, 20));
                  c.setElevation(0);
                  c.setPadding(dp(16), dp(12), dp(16), dp(12));
                  return c;
              }
