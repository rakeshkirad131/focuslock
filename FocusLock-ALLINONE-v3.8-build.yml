              private void renderLeaderboard(long todayDay) {
                  java.util.List<Score.Day> days = Score.all(this);
                  java.util.List<Score.Day> ranked = Score.ranked(days);
                  Score.Day today = Score.find(days, todayDay);
                  int todayRank = 0;
                  for (int i = 0; i < ranked.size(); i++) {
                      if (ranked.get(i).day == todayDay) {
                          todayRank = i + 1;
                          break;
                      }
                  }

                  // aaj ke ank
                  LinearLayout c = card();
                  c.setBackground(grad(ui.accent, ui.accent2, 20));
                  c.addView(text(t("🏆 खुद से मुकाबला", "🏆 Beat your own best"), 14, ui.onAccent, true));
                  int pts = today == null ? 0 : today.points();
                  c.addView(text(pts + t(" अंक आज", " points today"), 30, ui.onAccent, true));
                  if (todayRank > 0) {
                      c.addView(text(t("आपके सब " + ranked.size() + " दिनों में आज #" + todayRank,
                              "Today is #" + todayRank + " of your " + ranked.size() + " days"), 14, ui.onAccent, false));
                  }
                  if (today != null) {
                      c.addView(text(t("फ़ोकस " + today.pFocus + " + कम फ़ोन " + today.pLess + " + लगातार " + today.pStreak,
                              "Focus " + today.pFocus + " + less phone " + today.pLess + " + streak " + today.pStreak),
                              13, ui.onAccent, false));
                  }
                  content.addView(c);

                  // sabse achhe din
                  LinearLayout best = card();
                  best.addView(text(t("सबसे अच्छे दिन", "Your best days"), 16, ui.text, true));
                  best.addView(gap(6));
                  String[] medal = {"🥇", "🥈", "🥉"};
                  int shown = 0;
                  for (Score.Day d : ranked) {
                      if (shown >= 7) break;
                      if (d.points() <= 0 && d.day != todayDay) continue;
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      row.setGravity(Gravity.CENTER_VERTICAL);
                      row.setPadding(dp(10), dp(9), dp(10), dp(9));
                      if (d.day == todayDay) row.setBackground(round(ui.accentSoft, 12));
                      String pos = shown < 3 ? medal[shown] : "#" + (shown + 1);
                      TextView p = text(pos, 16, ui.text, true);
                      row.addView(p, new LinearLayout.LayoutParams(dp(40), LinearLayout.LayoutParams.WRAP_CONTENT));
                      String label = Score.date(this, d.day) + (d.day == todayDay ? t(" (आज)", " (today)") : "");
                      row.addView(text(label, 15, ui.text, d.day == todayDay),
                              new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                      row.addView(text(d.points() + t(" अंक", " pts"), 15, ui.accent, true));
                      best.addView(row);
                      shown++;
                  }
                  if (shown == 0) {
                      best.addView(text(t("पहला फ़ोकस सत्र पूरा कीजिए, यहाँ आपके दिन दिखेंगे।",
                              "Finish your first focus session and your days will show here."), 14, ui.muted, false));
                  }
                  content.addView(best);

                  // sabse achhe hafte
                  java.util.List<long[]> weeks = Score.weeks(days);
                  if (!weeks.isEmpty()) {
                      LinearLayout wk = card();
                      wk.addView(text(t("सबसे अच्छे हफ़्ते", "Your best weeks"), 16, ui.text, true));
                      wk.addView(gap(6));
                      for (int i = 0; i < Math.min(3, weeks.size()); i++) {
                          long[] w = weeks.get(i);
                          LinearLayout row = new LinearLayout(this);
                          row.setOrientation(LinearLayout.HORIZONTAL);
                          row.setPadding(0, dp(6), 0, dp(6));
                          row.addView(text(medal[i], 16, ui.text, true),
                                  new LinearLayout.LayoutParams(dp(40), LinearLayout.LayoutParams.WRAP_CONTENT));
                          row.addView(text(Score.weekRange(this, w[0]), 15, ui.text, false),
                                  new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                          row.addView(text(w[1] + t(" अंक", " pts"), 15, ui.accent, true));
                          wk.addView(row);
                      }
                      content.addView(wk);
                  }

                  // badges
                  int totalFocus = 0;
                  int bestPts = 0;
                  boolean lowDay = false;
                  for (Score.Day d : days) {
                      totalFocus += d.focus;
                      bestPts = Math.max(bestPts, d.points());
                      if (d.day != todayDay && d.screen > 0 && d.screen < 120) lowDay = true;
                  }
                  int bs = Store.bestStreak(this);
                  String[][] badges = {
                          {"🌱", "पहला फ़ोकस", "First focus", totalFocus > 0 ? "1" : "0"},
                          {"🔥", "3 दिन लगातार", "3-day streak", bs >= 3 ? "1" : "0"},
                          {"⚡", "7 दिन लगातार", "7-day streak", bs >= 7 ? "1" : "0"},
                          {"👑", "30 दिन लगातार", "30-day streak", bs >= 30 ? "1" : "0"},
                          {"⏱️", "10 घंटे फ़ोकस", "10 hours of focus", totalFocus >= 600 ? "1" : "0"},
                          {"🏔️", "50 घंटे फ़ोकस", "50 hours of focus", totalFocus >= 3000 ? "1" : "0"},
                          {"📵", "2 घंटे से कम फ़ोन वाला दिन", "A day under 2 hours", lowDay ? "1" : "0"},
                          {"💯", "100 अंक का दिन", "A 100-point day", bestPts >= 100 ? "1" : "0"},
                          {"🚀", "300 अंक का दिन", "A 300-point day", bestPts >= 300 ? "1" : "0"},
                  };
                  int got = 0;
                  for (String[] b : badges) if ("1".equals(b[3])) got++;
                  LinearLayout bc = card();
                  bc.addView(text(t("🎖️ Badges (" + got + "/" + badges.length + ")", "🎖️ Badges (" + got + "/" + badges.length + ")"), 16, ui.text, true));
                  bc.addView(gap(8));
                  java.util.List<View> cells = new java.util.ArrayList<>();
                  for (String[] b : badges) {
                      boolean on = "1".equals(b[3]);
                      LinearLayout cell = new LinearLayout(this);
                      cell.setOrientation(LinearLayout.VERTICAL);
                      cell.setGravity(Gravity.CENTER_HORIZONTAL);
                      cell.setPadding(dp(6), dp(10), dp(6), dp(10));
                      cell.setBackground(round(on ? ui.warnSoft : ui.bg, 14));
                      TextView ic = text(on ? b[0] : "🔒", 24, ui.text, false);
                      ic.setGravity(Gravity.CENTER);
                      if (!on) ic.setAlpha(0.5f);
                      cell.addView(ic);
                      TextView nm = text(L.en(this) ? b[2] : b[1], 11, on ? ui.text : ui.muted, on);
                      nm.setGravity(Gravity.CENTER);
                      cell.addView(nm);
                      cells.add(cell);
                  }
                  addFlow(bc, cells, 3);
                  content.addView(bc);

                  TextView how = text(t("अंक कैसे बनते हैं: हर फ़ोकस मिनट = 1 अंक। पिछले 7 दिन के औसत से जितने मिनट कम फ़ोन चलाया, उसका आधा। लगातार हर दिन = 5 अंक (ज़्यादा से ज़्यादा 150)। सारा हिसाब सिर्फ़ आपके फ़ोन में।",
                          "How points work: 1 point per focus minute. Half a point per minute below your 7-day average screen time. 5 points per streak day (max 150). All of it stays on your phone."),
                          12, ui.muted, false);
                  how.setPadding(dp(6), 0, dp(6), dp(12));
                  content.addView(how);
              }

