              private void renderActive() {
                  renderStatsRow();
                  renderThought();
                  renderStrictWarning();

                  LinearLayout c = card();
                  c.setGravity(Gravity.CENTER_HORIZONTAL);
                  c.addView(text(t("🔒 फ़ोकस सत्र चालू है", "🔒 Focus session running"), 18, ui.text, true));
                  final RingView ring = new RingView(this);
                  ring.setColors(ui.accentSoft, ui.accent, ui.text, ui.muted);
                  LinearLayout.LayoutParams rlp = new LinearLayout.LayoutParams(dp(230), dp(230));
                  rlp.setMargins(0, dp(14), 0, dp(10));
                  c.addView(ring, rlp);
                  final TextView until = text("", 14, ui.muted, false);
                  until.setGravity(Gravity.CENTER);
                  c.addView(until);
                  c.addView(gap(8));
                  TextView note = text(t("समय पूरा होने से पहले यह लॉक नहीं खुलेगा।", "This lock won't open before time is up."),
                          13, ui.muted, false);
                  note.setGravity(Gravity.CENTER);
                  c.addView(note);
                  content.addView(c);

                  LinearLayout apps = card();
                  apps.addView(text(t("बंद ऐप", "Locked apps"), 16, ui.text, true));
                  apps.addView(gap(10));
                  HorizontalScrollView hs = new HorizontalScrollView(this);
                  hs.setHorizontalScrollBarEnabled(false);
                  LinearLayout icons = new LinearLayout(this);
                  icons.setOrientation(LinearLayout.HORIZONTAL);
                  for (String pkg : Store.pkgs(this)) {
                      LinearLayout one = new LinearLayout(this);
                      one.setOrientation(LinearLayout.VERTICAL);
                      one.setGravity(Gravity.CENTER_HORIZONTAL);
                      ImageView iv = new ImageView(this);
                      iv.setImageDrawable(iconOf(pkg));
                      iv.setAlpha(0.5f);
                      one.addView(iv, new LinearLayout.LayoutParams(dp(44), dp(44)));
                      TextView lb = text(labelOf(pkg), 11, ui.muted, false);
                      lb.setMaxWidth(dp(64));
                      lb.setSingleLine(true);
                      lb.setGravity(Gravity.CENTER);
                      one.addView(lb);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(dp(68), LinearLayout.LayoutParams.WRAP_CONTENT);
                      icons.addView(one, lp);
                  }
                  hs.addView(icons);
                  apps.addView(hs);
                  content.addView(apps);

                  final long emStart = Store.emergencyWaitLeft(this);
                  final TextView emText = renderEmergency(emStart);

                  activeTicker = new Runnable() {
                      @Override
                      public void run() {
                          long ms = Store.remaining(MainActivity.this);
                          long em = Store.emergencyWaitLeft(MainActivity.this);
                          if (emStart > 0 && em <= 0) {
                              render();
                              return;
                          }
                          if (emText != null && em > 0) {
                              emText.setText(t("⏳ " + L.left(MainActivity.this, em) + " बाद unlock कर सकेंगे",
                                      "⏳ You can unlock in " + L.left(MainActivity.this, em)));
                          }
                          if (ms <= 0) {
                              toast(t("🎉 शाबाश! फ़ोकस पूरा हुआ", "🎉 Well done! Focus complete"));
                              render();
                              return;
                          }
                          int total = Math.max(1, Store.sessionMins(MainActivity.this));
                          ring.set(1f - ms / (total * 60_000f), L.left(MainActivity.this, ms), t("बाकी", "left"));
                          until.setText(t(Store.clock(Store.end(MainActivity.this)) + " तक",
                                  "until " + Store.clock(Store.end(MainActivity.this))));
                          handler.postDelayed(this, 1000);
                      }
                  };
                  handler.post(activeTicker);
              }

              /** Hafte me 1 baar, 10 minute intezaar ke baad. Lautata hai: intezaar wala TextView (ya null). */
              private TextView renderEmergency(long wait) {
                  LinearLayout c = card();
                  c.addView(text(t("🆘 आपातकालीन unlock", "🆘 Emergency unlock"), 16, ui.text, true));
                  TextView live = null;
                  if (wait > 0) {
                      live = text("", 14, ui.warn, true);
                      live.setPadding(0, dp(6), 0, dp(8));
                      c.addView(live);
                      c.addView(text(t("तब तक ऐप बंद रहेंगे। सच में ज़रूरी न हो तो रद्द कर दें।",
                              "Apps stay locked meanwhile. Cancel if it is not really urgent."), 13, ui.muted, false));
                      TextView cancel = pill(t("रद्द करें", "Cancel request"), false);
                      cancel.setOnClickListener(v -> {
                          Store.emergencyCancel(this);
                          toast(t("👍 बढ़िया! फ़ोकस जारी", "👍 Great! Focus continues"));
                          render();
                      });
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                      lp.setMargins(0, dp(10), 0, 0);
                      c.addView(cancel, lp);
                  } else if (wait == 0) {
                      c.addView(text(t("इंतज़ार पूरा। अब चाहें तो फ़ोकस खत्म कर सकते हैं (यह streak में नहीं गिना जाएगा)।",
                              "Wait over. You may end the focus now (it won't count toward your streak)."), 13, ui.muted, false));
                      TextView go = pill(t("🔓 अभी unlock करें", "🔓 Unlock now"), true);
                      go.setOnClickListener(v -> new AlertDialog.Builder(this)
                              .setTitle(t("फ़ोकस खत्म करें?", "End the focus?"))
                              .setMessage(t("अगला आपातकालीन unlock 7 दिन बाद मिलेगा।", "The next emergency unlock is available in 7 days."))
                              .setPositiveButton(t("हाँ, unlock", "Yes, unlock"), (d, w) -> {
                                  Store.emergencyUse(this);
                                  BlockService.ensure(this);
                                  toast(t("🔓 Unlock हो गया", "🔓 Unlocked"));
                                  render();
                              })
                              .setNegativeButton(t("नहीं, फ़ोकस जारी रखें", "No, keep focusing"), (d, w) -> {
                                  Store.emergencyCancel(this);
                                  render();
                              })
                              .show());
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                      lp.setMargins(0, dp(10), 0, 0);
                      c.addView(go, lp);
                  } else if (Store.emergencyAvailable(this)) {
                      c.addView(text(t("सच में ज़रूरी हो तो। हफ़्ते में 1 बार, माँगने के बाद 10 मिनट इंतज़ार।",
                              "Only for real emergencies. Once a week, with a 10-minute wait after asking."), 13, ui.muted, false));
                      TextView ask = pill(t("आपातकालीन unlock माँगें", "Request emergency unlock"), false);
                      ask.setOnClickListener(v -> requirePin(() -> {
                          Store.emergencyRequest(this);
                          render();
                      }));
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                      lp.setMargins(0, dp(10), 0, 0);
                      c.addView(ask, lp);
                  } else {
                      c.addView(text(t("अगला आपातकालीन unlock " + Store.emergencyDaysLeft(this) + " दिन बाद।",
                              "Next emergency unlock in " + Store.emergencyDaysLeft(this) + " days."), 13, ui.muted, false));
                  }
                  content.addView(c);
                  return live;
              }

              private void renderFocusSetup() {
                  renderStatsRow();
                  renderThought();
                  renderStrictWarning();

                  if (selectedMinutes <= 0) selectedMinutes = Store.lastMinutes(this);
                  LinearLayout c = card();
                  c.addView(text(t("कितनी देर के लिए?", "How long?"), 17, ui.text, true));
                  c.addView(gap(10));
                  List<View> chips = new ArrayList<>();
                  boolean custom = true;
                  for (int m : MINUTES) {
                      final int mins = m;
                      boolean sel = m == selectedMinutes;
                      if (sel) custom = false;
                      String label = m == 25 ? "🍅 25" : L.minutesLabel(this, m);
                      TextView ch = pill(label, sel);
                      ch.setOnClickListener(v -> {
                          selectedMinutes = mins;
                          render();
                      });
                      chips.add(ch);
                  }
                  TextView cus = pill(custom ? "✏️ " + L.minutesLabel(this, selectedMinutes) : t("✏️ अपना", "✏️ Custom"), custom);
                  cus.setOnClickListener(v -> askCustomMinutes());
                  chips.add(cus);
                  addFlow(c, chips, 4);
                  c.addView(gap(4));
                  c.addView(text(t("🍅 25 = पोमोडोरो (25 मिनट गहरा काम)", "🍅 25 = Pomodoro (25 min deep work)"),
                          12, ui.muted, false));
                  content.addView(c);

                  LinearLayout a = card();
                  a.addView(text(t("कौन से ऐप बंद करने हैं?", "Which apps to lock?"), 17, ui.text, true));
                  a.addView(gap(6));
                  Set<String> picked = Store.lastPick(this);
                  if (picked == null) picked = POPULAR;
                  addAppChecklist(a, picked);
                  content.addView(a);

                  showBottom(t("🔒  फ़ोकस शुरू करें", "🔒  Start focus"), this::confirmStart);
              }

              private void askCustomMinutes() {
                  final EditText et = new EditText(this);
                  et.setInputType(InputType.TYPE_CLASS_NUMBER);
                  et.setHint(t("मिनट (5 से 720)", "Minutes (5 to 720)"));
                  new AlertDialog.Builder(this)
                          .setTitle(t("कितने मिनट?", "How many minutes?"))
                          .setView(padded(et))
                          .setPositiveButton("OK", (d, w) -> {
                              try {
                                  int m = Integer.parseInt(et.getText().toString().trim());
                                  if (m < 5 || m > 720) throw new NumberFormatException();
                                  selectedMinutes = m;
                                  render();
                              } catch (NumberFormatException e) {
                                  toast(t("5 से 720 के बीच लिखें", "Enter between 5 and 720"));
                              }
                          })
                          .setNegativeButton(t("रद्द", "Cancel"), null)
                          .show();
              }

              private void confirmStart() {
                  final Set<String> chosen = checkedPkgs();
                  if (chosen.isEmpty()) {
                      toast(t("कम से कम एक ऐप चुनें", "Pick at least one app"));
                      return;
                  }
                  final int mins = selectedMinutes;
                  long end = System.currentTimeMillis() + mins * 60_000L;
                  new AlertDialog.Builder(this)
                          .setTitle(t("पक्का शुरू करें?", "Start for sure?"))
                          .setMessage(t(chosen.size() + " ऐप " + L.minutesLabel(this, mins) + " के लिए बंद होंगे ("
                                          + Store.clock(end) + " तक)।\n\nयह लॉक बीच में किसी भी तरह नहीं खुलेगा, "
                                          + "फ़ोन का समय बदलने या restart करने पर भी नहीं।",
                                  chosen.size() + " apps will be locked for " + L.minutesLabel(this, mins) + " (until "
                                          + Store.clock(end) + ").\n\nThis lock cannot be opened early, "
                                          + "not even by changing the phone time or restarting."))
                          .setPositiveButton(t("हाँ, शुरू करें", "Yes, start"), (d, w) -> {
                              Store.start(this, chosen, mins);
                              BlockService.ensure(this);
                              toast(t("🔒 फ़ोकस शुरू हो गया", "🔒 Focus started"));
                              render();
                          })
                          .setNegativeButton(t("रद्द करें", "Cancel"), null)
                          .show();
              }

              // ================= 2. LIMITS =================

              private void renderLimits() {
                  if (proGate(t("⏳ रोज़ की सीमा", "⏳ Daily limits"))) return;
                  LinearLayout head = card();
                  head.addView(text(t("⏳ रोज़ की सीमा", "⏳ Daily limits"), 18, ui.text, true));
                  head.addView(text(t("सीमा पूरी होते ही ऐप रात 12 बजे तक बंद रहेगा।",
                          "When the limit is reached, the app stays locked until midnight."), 13, ui.muted, false));
                  content.addView(head);

                  final boolean locked = Store.lockedNow(this);
                  if (locked) {
                      LinearLayout w = softCard(ui.warnSoft);
                      w.addView(text(t("🔒 फ़ोकस/शेड्यूल चालू है: अभी सिर्फ़ नई सीमा लगा सकते हैं या घटा सकते हैं।",
                              "🔒 Focus/schedule running: you can only add or reduce limits now."), 13, ui.warn, false));
                      content.addView(w);
                  }

                  final Map<String, Long> usage = Usage.today(this);
                  final Map<String, Integer> limits = Store.limits(this);
                  List<App> apps = new ArrayList<>(apps());
                  apps.sort((a, b) -> {
                      boolean la = limits.containsKey(a.pkg), lb = limits.containsKey(b.pkg);
                      if (la != lb) return la ? -1 : 1;
                      long ua = usage.containsKey(a.pkg) ? usage.get(a.pkg) : 0;
                      long ub = usage.containsKey(b.pkg) ? usage.get(b.pkg) : 0;
                      return Long.compare(ub, ua);
                  });

                  LinearLayout list = card();
                  for (App app : apps) {
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      row.setGravity(Gravity.CENTER_VERTICAL);
                      row.setPadding(0, dp(8), 0, dp(8));

                      ImageView icon = new ImageView(this);
                      icon.setImageDrawable(app.icon);
                      row.addView(icon, new LinearLayout.LayoutParams(dp(38), dp(38)));

                      long usedMin = (usage.containsKey(app.pkg) ? usage.get(app.pkg) : 0) / 60_000L;
                      final Integer lim = limits.get(app.pkg);
                      boolean over = lim != null && usedMin >= lim;

                      LinearLayout col = new LinearLayout(this);
                      col.setOrientation(LinearLayout.VERTICAL);
                      col.addView(text(app.label, 15, ui.text, true));
                      col.addView(text(t("आज: ", "Today: ") + L.mins(this, usedMin)
                              + (lim != null ? "  /  " + L.minutesLabel(this, lim) : ""), 12, over ? ui.danger : ui.muted, false));
                      if (lim != null) {
                          col.addView(gap(4));
                          col.addView(progressBar(Math.min(1f, usedMin / (float) lim), over ? ui.danger : ui.accent),
                                  new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(6)));
                      }
                      LinearLayout.LayoutParams clp = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                      clp.setMargins(dp(12), 0, dp(8), 0);
                      row.addView(col, clp);

                      TextView btn = pill(lim != null ? L.minutesLabel(this, lim) : t("+ सीमा", "+ Limit"), lim != null);
                      btn.setOnClickListener(v -> chooseLimit(app, lim, locked));
                      row.addView(btn);
                      list.addView(row);
                  }
                  content.addView(list);
              }

              private void chooseLimit(App app, Integer current, boolean locked) {
                  String[] labels = new String[LIMIT_OPTIONS.length];
                  for (int i = 0; i < LIMIT_OPTIONS.length; i++) {
                      labels[i] = LIMIT_OPTIONS[i] == 0 ? t("कोई सीमा नहीं", "No limit") : L.minutesLabel(this, LIMIT_OPTIONS[i]);
                  }
                  new AlertDialog.Builder(this)
                          .setTitle(app.label + t(" – रोज़ कितनी देर?", " – how long per day?"))
                          .setItems(labels, (d, which) -> {
                              final int m = LIMIT_OPTIONS[which];
                              boolean loosen = current != null && (m == 0 || m > current);
                              Runnable apply = () -> {
                                  Store.setLimit(this, app.pkg, m);
                                  BlockService.ensure(this);
                                  render();
                              };
                              if (!loosen) {
                                  apply.run();
                              } else if (locked) {
                                  toast(t("लॉक के दौरान सीमा बढ़ा या हटा नहीं सकते", "Can't raise or remove limits during a lock"));
                              } else {
                                  requirePin(apply);
                              }
                          })
                          .show();
              }

              // ================= 3. SCHEDULE =================

              private void renderSchedule() {
                  LinearLayout head = card();
                  head.addView(text(t("📅 रोज़ का शेड्यूल", "📅 Daily schedule"), 18, ui.text, true));
                  head.addView(text(t("3 अलग प्रोफ़ाइल: हर एक का अपना समय, अपने दिन और अपने ऐप।",
                          "3 separate profiles: each with its own time, days and apps."), 13, ui.muted, false));
                  head.addView(gap(10));
                  List<View> tabs = new ArrayList<>();
                  for (int i = 0; i < Store.PROFILES; i++) {
                      final int idx = i;
                      String dot = (i > 0 && !Pro.has(this)) ? "⭐ " : Store.schedNow(this, i) ? "🟢 " : Store.schedOn(this, i) ? "● " : "";
                      TextView p = pill(dot + Store.profileName(this, i), i == profile);
                      p.setOnClickListener(v -> {
                          profile = idx;
                          schedDraftLoaded = false;
                          render();
                      });
                      tabs.add(p);
                  }
                  addFlow(head, tabs, 2);
                  head.addView(text(t("🟢 अभी चल रहा  ● चालू", "🟢 running now  ● on"), 12, ui.muted, false));
                  content.addView(head);

                  final int pi = profile;
                  if (pi > 0 && proGate(Store.profileName(this, pi) + t(" प्रोफ़ाइल", " profile"))) return;
                  if (Store.schedNow(this, pi)) {
                      LinearLayout c = softCard(ui.accentSoft);
                      c.addView(text(Store.profileName(this, pi) + t(" अभी चालू है", " is running now"), 17, ui.accent, true));
                      c.addView(text(Store.clockMin(Store.schedStart(this, pi)) + " – " + Store.clockMin(Store.schedEnd(this, pi))
                              + t("\nखत्म होने के बाद बदल सकेंगे।", "\nYou can edit it after it ends."), 14, ui.muted, false));
                      content.addView(c);
                      LinearLayout a = card();
                      a.addView(text(t("बंद ऐप", "Locked apps"), 16, ui.text, true));
                      for (String pkg : Store.schedPkgs(this, pi)) a.addView(text("•  " + labelOf(pkg), 15, ui.muted, false));
                      content.addView(a);
                      return;
                  }

                  if (!schedDraftLoaded) {
                      schedStart = Store.schedStart(this, pi);
                      schedEnd = Store.schedEnd(this, pi);
                      schedDays = Store.schedDays(this, pi);
                      schedDraftLoaded = true;
                  }

                  LinearLayout c = card();
                  final Switch on = new Switch(this);
                  on.setText(Store.profileName(this, pi) + t(" चालू  ", " on  "));
                  on.setTextSize(17);
                  on.setChecked(Store.schedOn(this, pi));
                  styleSwitch(on);
                  c.addView(on);
                  c.addView(gap(12));

                  LinearLayout times = new LinearLayout(this);
                  times.setOrientation(LinearLayout.HORIZONTAL);
                  LinearLayout s = timeBox(t("शुरू", "Start"), Store.clockMin(schedStart));
                  s.setOnClickListener(v -> new TimePickerDialog(this, (tp, h, m) -> {
                      schedStart = h * 60 + m;
                      render();
                  }, schedStart / 60, schedStart % 60, false).show());
                  LinearLayout e = timeBox(t("खत्म", "End"), Store.clockMin(schedEnd));
                  e.setOnClickListener(v -> new TimePickerDialog(this, (tp, h, m) -> {
                      schedEnd = h * 60 + m;
                      render();
                  }, schedEnd / 60, schedEnd % 60, false).show());
                  LinearLayout.LayoutParams l1 = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                  l1.setMargins(0, 0, dp(6), 0);
                  LinearLayout.LayoutParams l2 = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                  l2.setMargins(dp(6), 0, 0, 0);
                  times.addView(s, l1);
                  times.addView(e, l2);
                  c.addView(times);
                  c.addView(gap(14));

                  c.addView(text(t("किन दिनों में?", "Which days?"), 15, ui.text, true));
                  c.addView(gap(8));
                  LinearLayout days = new LinearLayout(this);
                  days.setOrientation(LinearLayout.HORIZONTAL);
                  int[] order = {1, 2, 3, 4, 5, 6, 0};
                  for (int d : order) {
                      final int bit = d;
                      boolean sel = ((schedDays >> d) & 1) == 1;
                      TextView tv = text(L.en(this) ? DAYS_EN[d] : DAYS_HI[d], 15, sel ? ui.onAccent : ui.text, true);
                      tv.setGravity(Gravity.CENTER);
                      tv.setBackground(round(sel ? ui.accent : ui.accentSoft, 22));
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, dp(42), 1f);
                      lp.setMargins(dp(3), 0, dp(3), 0);
                      tv.setOnClickListener(v -> {
                          schedDays ^= (1 << bit);
                          render();
                      });
                      days.addView(tv, lp);
                  }
                  c.addView(days);
                  content.addView(c);

                  LinearLayout a = card();
                  a.addView(text(t("कौन से ऐप बंद हों?", "Which apps to lock?"), 17, ui.text, true));
                  Set<String> picked = Store.schedPkgs(this, pi);
                  if (picked.isEmpty()) picked = POPULAR;
                  addAppChecklist(a, picked);
                  content.addView(a);

                  showBottom(t("💾  सेव करें: ", "💾  Save: ") + Store.profileName(this, pi), () -> {
                      final Set<String> chosen = checkedPkgs();
                      final boolean isOn = on.isChecked();
                      if (isOn && chosen.isEmpty()) {
                          toast(t("कम से कम एक ऐप चुनें", "Pick at least one app"));
                          return;
                      }
                      if (isOn && schedDays == 0) {
                          toast(t("कम से कम एक दिन चुनें", "Pick at least one day"));
                          return;
                      }
                      if (schedStart == schedEnd) {
                          toast(t("शुरू और खत्म का समय अलग रखें", "Start and end must differ"));
                          return;
                      }
                      Runnable save = () -> {
                          Store.saveSchedule(this, pi, isOn, schedStart, schedEnd, schedDays, chosen);
                          BlockService.ensure(this);
                          toast(isOn ? t("✅ शेड्यूल सेव और चालू", "✅ Schedule saved and on")
                                  : t("शेड्यूल बंद कर दिया", "Schedule turned off"));
                          render();
                      };
                      if (Store.schedOn(this, pi)) requirePin(save);
                      else save.run();
                  });
              }

