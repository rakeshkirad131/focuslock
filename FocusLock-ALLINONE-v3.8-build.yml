          package com.rakesh.focuslock;

          import android.app.usage.UsageEvents;
          import android.app.usage.UsageStatsManager;
          import android.content.Context;

          import java.util.Calendar;
          import java.util.HashMap;
          import java.util.Map;

          /** Aaj (raat 12 baje se) har app kitni der chala. */
          public final class Usage {

              private Usage() {}

              public static long startOfDay() {
                  Calendar c = Calendar.getInstance();
                  c.set(Calendar.HOUR_OF_DAY, 0);
                  c.set(Calendar.MINUTE, 0);
                  c.set(Calendar.SECOND, 0);
                  c.set(Calendar.MILLISECOND, 0);
                  return c.getTimeInMillis();
              }

              /** pkg -> milliseconds (aaj) */
              public static Map<String, Long> today(Context ctx) {
                  return range(ctx, startOfDay(), System.currentTimeMillis());
              }

              /** Pichhle 7 din ka kul screen time, minute me (purana -> aaj). */
              public static long[] week(Context ctx) {
                  long[] out = new long[7];
                  long today = startOfDay();
                  long now = System.currentTimeMillis();
                  for (int i = 0; i < 7; i++) {
                      Calendar c = Calendar.getInstance();
                      c.setTimeInMillis(today);
                      c.add(Calendar.DAY_OF_YEAR, -(6 - i));
                      long start = c.getTimeInMillis();
                      c.add(Calendar.DAY_OF_YEAR, 1);
                      long end = Math.min(c.getTimeInMillis(), now);
                      long total = 0;
                      for (long v : range(ctx, start, end).values()) total += v;
                      out[i] = total / 60_000L;
                  }
                  return out;
              }

              /** pkg -> milliseconds, diye gaye samay ke beech */
              public static Map<String, Long> range(Context ctx, long from, long to) {
                  Map<String, Long> out = new HashMap<>();
                  long now = to;
                  try {
                      UsageStatsManager usm = (UsageStatsManager) ctx.getSystemService(Context.USAGE_STATS_SERVICE);
                      UsageEvents ev = usm.queryEvents(from, to);
                      UsageEvents.Event e = new UsageEvents.Event();
                      String cur = null;
                      long since = 0;
                      while (ev.hasNextEvent()) {
                          ev.getNextEvent(e);
                          int t = e.getEventType();
                          long ts = e.getTimeStamp();
                          if (t == UsageEvents.Event.MOVE_TO_FOREGROUND) {
                              if (cur != null) add(out, cur, ts - since);
                              cur = e.getPackageName();
                              since = ts;
                          } else if (t == UsageEvents.Event.MOVE_TO_BACKGROUND) {
                              if (cur != null && cur.equals(e.getPackageName())) {
                                  add(out, cur, ts - since);
                                  cur = null;
                              }
                          } else if (t == UsageEvents.Event.SCREEN_NON_INTERACTIVE) {
                              if (cur != null) add(out, cur, ts - since);
                              cur = null;
                          }
                      }
                      if (cur != null) add(out, cur, now - since);
                  } catch (Exception ignored) {
                  }
                  out.remove(ctx.getPackageName());
                  return out;
              }

              private static void add(Map<String, Long> m, String pkg, long ms) {
                  if (ms <= 0) return;
                  Long old = m.get(pkg);
                  m.put(pkg, (old == null ? 0L : old) + ms);
              }
          }
